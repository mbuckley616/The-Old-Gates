name: check
# 29 Sep 2026: every agent push ran the suites twice (push and pull_request) and 29 runs sat queued.
# Agent branches are tested through their PR only, and a new commit cancels its branch's older run.
# 19 Oct 2026 (Michael's A on the pipeline): a pull request runs only the suites its change can reach (tests/lib/select.mjs),
# a docs-only one none; main runs every suite after each merge, and a run on main is never cancelled by the next merge.
# 20 Oct 2026 (Michael, in chat: basic tests, not bulletproof ones): a pull request runs the smoke set and the suites it adds
# or edits (tests/lib/select.mjs), a docs-only one none. Main no longer runs every suite after each merge (709 runner-minutes
# a merge, in 20 shards from the runner pool Airsoft shares); every suite runs on Sunday at 06:00 UTC, and whenever check is run by
# hand (Actions, check, Run workflow, on any branch).
# `gate` is the one check that says whether a pull request may merge: green when parse passed and the suites passed or
# were not needed. The automerge workflow reads it.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'
# A concurrency group holds one running and ONE pending run: a third run queued in the group cancels the pending one,
# whatever cancel-in-progress says. With every main run in one group, five of the six main runs after #459 were cancelled
# while they waited (6871654, e343522, 82c7d46, ba34c3a, 6210ccf; Session 1171). So a pull request's runs share its branch's
# group (a new commit cancels the old run), and every other run (the weekly run, a run by hand) is a group of its own.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.head_ref) || format('check-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.p.outputs.mode }}
      n: ${{ steps.p.outputs.n }}
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - id: p
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tests/lib/select.mjs --base=${{ github.event.pull_request.base.sha }} --github-output
          else
            node tests/lib/select.mjs --full --github-output
          fi
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: python3 scripts/parsecheck.py
      # Session 822 (F1): the new look's classic three.js 0.170 is what scripts/three_bundle.py makes from the pinned module
      - run: python3 scripts/three_bundle.py --check
      # Session 368 (backlog K): the split script's anchors are patterns on main's code. This shows when a change moves
      # one, so switch-over day finds no surprise; it never blocks a merge. Once index.html is split it reports so and passes.
      - run: python3 scripts/split.py --check
        continue-on-error: true
  headless:
    # Session 254: the suites run in eight shares side by side. One job running all of them had outgrown its 30 minutes,
    # and every run was cancelled before it could report.
    # 30 Sep 2026 (the split session): 45, not 30. On a slow shared runner five of eight shards ran past 30 minutes
    # twice in a row on auto/systems; the limit measured the runner, not the tests.
    # 3 Oct 2026 (Session 454): 60, not 45. The suites now add up to 19,054 s on CI, about 40 minutes a shard before
    # the install, so 45 left three minutes of slack; shard 2 was cancelled at 45:19 on 0af251a.
    # 8 Oct 2026 (Session 652): twelve shares, not eight. 360 suites came to about 52 minutes a shard before the install;
    # on auto/systems six of eight shards were cancelled at 60:00 on ab0ee3f, and main and auto/backlog failed at 55-56.
    # 15 Oct 2026 (Session 915, card F2a): fourteen shares, not twelve. 455 suites came to about 50 minutes a shard on CI
    # (598 minutes in all), and one suite's time moves by a third between runs (scaleratio: 567 s, then 357); shards 5 and 12
    # were cut at 60:00 on 3748198 with nothing failed. Fourteen is about 43 minutes a shard.
    # 18 Oct 2026 (Session 1138): sixteen shares, not fourteen. 502 suites on auto/systems came to 710 minutes on CI (run
    # 39146959449, af62671), 51 a shard at fourteen, and its shard 14 was cut at 60:00 on its last suite with nothing failed
    # (kittown took 346 s where 60 was counted). Sixteen is about 44 minutes a shard.
    # 19 Oct 2026: as many shards as the selection needs at about 35 minutes each (tests/lib/select.mjs), up to twenty.
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tests/run.mjs --shard=${{ matrix.shard }}/${{ needs.plan.outputs.n }} ${{ needs.plan.outputs.mode == 'some' && format('--changed={0}', github.event.pull_request.base.sha) || '' }}
  gate:
    needs: [plan, parse, headless]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "plan: ${{ needs.plan.result }} (${{ needs.plan.outputs.mode }}, ${{ needs.plan.outputs.n }} shards); parse: ${{ needs.parse.result }}; suites: ${{ needs.headless.result }}"
          [ "${{ needs.plan.result }}" = success ] && [ "${{ needs.parse.result }}" = success ] && { [ "${{ needs.headless.result }}" = success ] || [ "${{ needs.headless.result }}" = skipped ]; }
