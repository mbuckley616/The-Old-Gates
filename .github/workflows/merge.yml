name: merge
# Michael, 29 Sep 2026: an approval on the control room or in Slack should reach main without a local Claude session.
# The producer carries the approval here as a PR comment from the owner's account:
#   /merge <sha>          merges that exact commit once its CI is green (refuses otherwise)
#   /merge-anyway <sha>   merges that exact commit whatever CI says (Michael's "merge despite the flake" call)
# The commit is merged, not the branch head, so commits the builders add after an approval never ride along unapproved.
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  checks: read
  pages: write
concurrency: merge-main
jobs:
  merge:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.author_association == 'OWNER' &&
      (startsWith(github.event.comment.body, '/merge ') || startsWith(github.event.comment.body, '/merge-anyway '))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BODY: ${{ github.event.comment.body }}
      PR: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Merge the approved commit
        run: |
          set -euo pipefail
          say() { gh pr comment "$PR" --repo "$REPO" --body "$1"; }
          cmd=$(printf '%s' "$BODY" | head -1 | awk '{print $1}')
          sha=$(printf '%s' "$BODY" | head -1 | awk '{print $2}')
          if ! [[ "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then say "merge: no commit sha after $cmd — nothing merged."; exit 1; fi
          branch=$(gh pr view "$PR" --repo "$REPO" --json headRefName -q .headRefName)
          git fetch -q origin "$branch"
          full=$(git rev-parse --verify "$sha^{commit}") || { say "merge: $sha is not a commit I can find — nothing merged."; exit 1; }
          git merge-base --is-ancestor "$full" "origin/$branch" || { say "merge: $sha is not on $branch — nothing merged."; exit 1; }
          if git merge-base --is-ancestor "$full" HEAD; then say "merge: ${full:0:7} is already on main."; exit 0; fi
          if [ "$cmd" = "/merge" ]; then
            runs=$(gh api "repos/$REPO/commits/$full/check-runs?per_page=100" -q '[.check_runs[] | select(.name != "merge")]')
            total=$(jq length <<<"$runs")
            bad=$(jq '[.[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "skipped"))] | length' <<<"$runs")
            if [ "$total" = 0 ] || [ "$bad" != 0 ]; then
              say "merge: CI on ${full:0:7} is not green yet ($bad of $total checks not passed) — nothing merged. Comment \`/merge ${full:0:7}\` again once it is, or \`/merge-anyway ${full:0:7}\` if Michael called it."
              exit 1
            fi
          fi
          git config user.name "old-gates-merge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          title=$(gh pr view "$PR" --repo "$REPO" --json title -q .title)
          if ! git merge --no-ff "$full" -m "Merge $branch at ${full:0:7}: $title ($cmd, approved by Michael)"; then
            git merge --abort || true
            say "merge: ${full:0:7} conflicts with main — nothing merged. The branch needs main merged into it first."
            exit 1
          fi
          git push origin HEAD:main
          say "merge: ${full:0:7} is on main as $(git rev-parse --short HEAD)."
      - name: Rebuild the Pages site
        continue-on-error: true
        run: gh api -X POST "repos/$REPO/pages/builds"
