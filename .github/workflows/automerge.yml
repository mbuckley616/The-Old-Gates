name: automerge
# 19 Oct 2026 (Michael's A on the pipeline): a pull request merges the minute it is ready, not at the producer's next run.
# Ready means `check`'s gate is green on its head, it merges cleanly, and either it changes only docs/ and tests/ (not the
# harness), or Michael approved it: a comment on the PR "Approved by Michael: <sha>", which the producer posts when he taps
# Approve on the control room. Commits after the approved one that add only docs, tests or merges of main go in with it;
# anything else waits for a new tap, and the approved commit itself is merged meanwhile. scripts/automerge.mjs is the rule.
# It runs from main's copy: when a check run finishes, and every fifteen minutes in case GitHub drops an event.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: automerge
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/automerge.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
