name: stamp
# 19 Oct 2026 (Michael's A on the pipeline): the build number in index.html is set here, on main, after each merge, and no
# branch bumps it any more. Every branch used to bump the same line, so each merge left every other open PR in conflict on it.
# The number goes up by one a landing; the commit says [skip ci] so it runs nothing, and the Pages build is asked for by name
# because a push made with the workflow's own token starts no other workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: stamp
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  stamp:
    if: ${{ !contains(github.event.head_commit.message, '[stamp]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - name: bump the build number on main
        run: |
          git config user.name "old-gates-stamp"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            if git log -1 --format=%s | grep -q '\[stamp\]'; then echo "main's tip is already a stamp"; exit 0; fi
            python3 scripts/tag.py bump
            git commit -qam "Build $(python3 scripts/tag.py) [stamp] [skip ci]"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          exit 1
      - name: ask for the Pages build
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
