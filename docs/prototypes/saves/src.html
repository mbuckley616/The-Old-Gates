<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>The Save Register</title>
<!-- The Old Gates — saving and loading on the approved parchment kit (docs/prototypes/ui, Michael A, 27 Sep 2026).
     Concept, 6 Oct 2026. build.py inlines kit.css, the icon symbols (defs.html) and the game's own saves (current.json,
     written by shoot-current.mjs: two characters played in and round Dunmore, eight saves written through ssWrite and
     saveGame, each entry of SS.idx with its date by gameDateLine and calDateLine). Every .screen is 1280×720.
     For the builder: plain DOM. .reg is one .parch sheet of two columns: .who, a list of .ch character cards (name, people,
     beginning, level, last played; .on the open one), and .saves, the open character's .sv rows (a .kind mark — the quill
     for a slot you wrote, the ring for an autosave — the date in the calendar's words, the hour, the place, level, gold,
     how long ago in real time). A row once pressed is .primed and says what a second press does. B adds .pic, a picture of
     the view kept with each save (320×180 JPEG from REN.domElement at the moment of saving, about 15 KB, stored in the
     index entry as m.pic, so the list needs no read of the save itself), and .big, the chosen save's picture with its lines.
     The foot (.regfoot) carries Import, the two exports (character, world: ssExportChar/ssExportWorld) and Delete, and the
     seal: Load or Write. -->
<link href="../ui/fonts/fonts.css" rel="stylesheet">
<style>
/*KIT*/
.screen{background-size:cover;background-position:center}
.screen.menu::before{backdrop-filter:blur(2px) brightness(.5) sepia(.3)}

/* ───────── the register ───────── */
.reg{left:60px;top:40px;width:1160px;height:640px;padding:22px 34px 18px;display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto auto 1fr auto;gap:0 30px}
.reg.b{grid-template-columns:270px 1fr 360px}
.reghead{grid-column:1/-1;display:flex;align-items:flex-end;gap:18px}
.reghead .h{font-size:38px;line-height:1}
.reghead .sub{font:italic 18px var(--fell);color:var(--ink-soft);padding-bottom:3px}
.reghead .mode{margin-left:auto;display:flex;gap:20px;font:18px var(--display);color:var(--ink-faint);padding-bottom:3px}
.reghead .mode .on{color:var(--rubric);border-bottom:2px solid var(--rubric)}
.reg .rule{grid-column:1/-1}
.who{border-right:1px solid rgba(90,65,40,.3);padding-right:20px;overflow:hidden}
.colh{font:13px var(--display);letter-spacing:.12em;color:var(--ink-faint);margin:2px 0 6px}
.ch{padding:9px 12px 10px;border-bottom:1px solid rgba(90,65,40,.18)}
.ch .nm{font:24px/1.05 var(--display);color:var(--ink)}
.ch .ln{font:15.5px/1.3 var(--body);color:var(--ink-soft)}
.ch .ln2{font:italic 14px var(--fell);color:var(--ink-faint)}
.ch.on{background:linear-gradient(90deg,rgba(122,31,16,.14),rgba(122,31,16,.03));box-shadow:inset 3px 0 var(--rubric)}
.ch.on .nm{color:var(--rubric)}
.ch .play{font:12px var(--display);letter-spacing:.1em;color:var(--gilt);margin-left:8px}
.ch.new{color:var(--ink-faint);font:italic 16px var(--fell);border-bottom:none;padding-top:12px}
.saves{overflow:hidden}
.sv{display:grid;grid-template-columns:26px 1fr 150px 92px;gap:0 14px;align-items:center;padding:7px 10px;border-bottom:1px solid rgba(90,65,40,.18);min-height:58px}
.reg.b .sv{grid-template-columns:96px 1fr 70px;gap:0 12px;padding:6px 8px;min-height:66px}
.reg.b .sv .d{font-size:17px}
.sv svg.ico{width:22px;height:22px;color:var(--ink-soft)}
.sv .d{font:18px/1.2 var(--body);font-weight:500}
.sv .d .hr{font-weight:400;color:var(--ink-soft)}
.sv .p{font:italic 15px/1.25 var(--fell);color:var(--ink-soft)}
.sv .k{font:12px var(--display);letter-spacing:.1em;color:var(--ink-faint)}
.sv .st{font:16px var(--body);text-align:right;white-space:nowrap}
.sv .st small{display:block;font:italic 13px var(--fell);color:var(--ink-faint)}
.sv .ago{font:italic 14px var(--fell);color:var(--ink-faint);text-align:right}
.sv.auto .d{font-weight:400}
.sv.on{background:linear-gradient(90deg,rgba(122,31,16,.14),rgba(122,31,16,.03));box-shadow:inset 3px 0 var(--rubric)}
.sv.on .d{color:var(--rubric)}
.sv.primed{box-shadow:inset 3px 0 var(--rubric),inset 0 0 0 1.5px rgba(122,31,16,.55)}
.sv.primed .d{color:var(--rubric)}
.sv .ask{font:italic 15px var(--fell);color:var(--rubric)}
.sv.empty .d{font:italic 16px var(--fell);color:var(--ink-faint);font-weight:400}
.sv.empty svg.ico{opacity:.4}
.thumb{width:96px;height:54px;border-radius:2px;background-size:cover;background-position:center;box-shadow:0 0 0 1px rgba(46,28,12,.6),0 0 0 3px rgba(224,201,148,.7),0 0 0 4px rgba(90,65,40,.4);filter:sepia(.25) saturate(.9)}
.thumb.none{background:repeating-linear-gradient(135deg,rgba(90,65,40,.08) 0 6px,transparent 6px 12px)}
.sub2{font:12px var(--display);letter-spacing:.14em;color:var(--ink-faint);margin:10px 0 2px 10px;display:flex;gap:10px;align-items:center}
.sub2::after{content:"";flex:1;height:1px;background:rgba(90,65,40,.25)}
.big{border-left:1px solid rgba(90,65,40,.3);padding-left:22px}
.big .pic{width:336px;height:189px;background-size:cover;background-position:center;border-radius:2px;box-shadow:0 0 0 1px rgba(46,28,12,.7),0 0 0 4px rgba(224,201,148,.8),0 0 0 5px rgba(90,65,40,.5),0 6px 12px rgba(40,20,5,.35);filter:sepia(.2) saturate(.92);margin:4px 0 14px}
.big .t{font:22px/1.15 var(--display);color:var(--rubric)}
.big .l{font:16.5px/1.4 var(--body);color:var(--ink)}
.big .l.f{font:italic 15px var(--fell);color:var(--ink-faint)}
.big .dv{font-size:16px}
.regfoot{grid-column:1/-1;display:flex;align-items:center;gap:12px;border-top:1px solid rgba(90,65,40,.3);padding-top:10px;margin-top:6px;position:relative}
.regfoot .btn{font-size:14.5px;padding:5px 12px;display:inline-flex;gap:7px;align-items:center}
.regfoot .btn svg.ico{width:16px;height:16px}
.regfoot .del{font:italic 15px var(--fell);color:var(--ink-faint)}
.regfoot .store{font:italic 13.5px var(--fell);color:var(--ink-faint);margin-left:6px}
.regfoot .go{margin-left:auto;font:24px var(--display);color:var(--rubric);padding-right:64px}
.regfoot .seal{right:0;top:-2px;width:52px;height:52px;font-size:22px}
.esc{position:absolute;right:26px;bottom:6px;font:italic 14px var(--fell);color:rgba(240,226,192,.8);display:flex;gap:8px;align-items:center;z-index:3;text-shadow:0 1px 2px #000}
.esc .key{width:auto;padding:0 6px}

/* ───────── C: today's column, restyled ───────── */
.c1{left:240px;top:30px;width:800px;height:660px;padding:22px 36px;overflow:hidden}
.c1 .scroll{position:absolute;left:36px;right:36px;top:150px;bottom:20px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 85%,transparent)}
.c1 .tt{display:flex;gap:16px;align-items:baseline}
.c1 .tt .h{font-size:26px}
.c1 .tb{font:16px var(--display);color:var(--ink-faint)} .c1 .tb.on{color:var(--rubric);border-bottom:2px solid var(--rubric)}
.c1 .st{font:italic 13px var(--fell);color:var(--ink-faint);margin:4px 0}
.c1 .gh{display:flex;gap:10px;align-items:baseline;margin:10px 0 3px;font:18px var(--display);color:var(--ink)}
.c1 .gh small{font:italic 13px var(--fell);color:var(--ink-faint)}
.c1 .gh .btn{font-size:12px;padding:2px 8px;margin-left:6px}
.c1 .ss{font:11px var(--display);letter-spacing:.2em;color:var(--ink-faint);margin:4px 0 2px 4px}
.c1 .r1{display:grid;grid-template-columns:26px 22px 1fr 30px;gap:8px;align-items:center;padding:5px 10px;border-bottom:1px solid rgba(90,65,40,.18)}
.c1 .r1 .n{font:14px var(--display);color:var(--ink-faint)} .c1 .r1 .a{font:15.5px var(--body);font-weight:500} .c1 .r1 .b{font:italic 13px var(--fell);color:var(--ink-faint)}
.c1 .r1 svg.ico{width:18px;height:18px;color:var(--ink-soft)}

/* the page around the screens */
.cmp{background:#1a140c}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:18px}
.pair figure{margin:0}
.pair figcaption{font:18px var(--display);color:#e0c994;margin-bottom:6px}
.pair figcaption small{font:13px var(--body);color:#a89878;margin-left:8px}
.pair img{width:100%;display:block;box-shadow:0 0 0 1px #5a4018}
</style>
</head>
<body>
<!--DEFS-->
<svg width="0" height="0" style="position:absolute"><defs>
 <symbol id="i-autoring" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19.5 4.5v3.2h-3.2"/><path d="M12 8.5V12l2.4 1.6"/></symbol>
 <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 11h7M9 14.5h7M9 18h4"/></symbol>
 <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v11"/><path d="M8 10.5l4 4 4-4"/><path d="M4 16v4h16v-4"/></symbol>
 <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 15V4"/><path d="M8 7.5l4-4 4 4"/><path d="M4 16v4h16v-4"/></symbol>
 <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17"/></symbol>
</defs></svg>
<h1 class="page">The Save Register — saving and loading on the parchment</h1>
<p class="lede">Two characters played in this browser: Aoife, a Duelist on her seventh day round Dunmore, and Tadhg, a Sentinel two weeks in. Every save was written by the game's own ssWrite and saveGame; every date, place, level and sum is from its index.</p>
<div id="out"></div>
<script>
/*DATA*/
const ico=(id,c='ico')=>`<svg class="${c}"><use href="#${id}"/></svg>`;
const screens=[];
function screen(id,cap,cls,html){const bg=cls.includes('menu')&&PIC[savesOf(OPEN)[0].key]?` style="background-image:url(${PIC[savesOf(OPEN)[0].key]}.jpg)"`:'';screens.push(id);document.getElementById('out').insertAdjacentHTML('beforeend',`<div class="cap">${cap}</div><div class="screen ${cls}" id="${id}"${bg}>${html}</div>`);}
const ARCH=Object.fromEntries(DATA.archetypes.map(a=>[a.id,a.label]));
const PEOPLE={gatelander:'Gatelander',gatelands:'Gatelander',mark:'of the Mark',aurenne:'Aurennois'};
const peo=p=>PEOPLE[String(p||'').toLowerCase()]||p||'';
const ago=ts=>{const d=Math.floor((DATA.now-ts)/60000);return d<1?'just now':d<60?`${d} min ago`:d<1440?`${Math.floor(d/60)} h ago`:`${Math.floor(d/1440)} d ago`;};
// the row reads the calendar's words (calDateLine) and the hour; the era is kept for the large pane
const parts=m=>{const s=m.date||'';const i=s.lastIndexOf(' · ');return [m.cal||s,i<0?'':s.slice(i+3)];};
const era=m=>{const s=m.date||'';const i=s.indexOf(', in the ');return i<0?'':s.slice(i+2,s.lastIndexOf(' · '));};
const place=m=>m.zoneLine||'';
// the run wrote every save within minutes; for the pictures, the real-time stamps are spread back over a week, newest last
const REAL={}; {const rk=m=>m.charId==='caoife'?0:m.charId==='ctadhg'?1:2;const order=[...DATA.idx].sort((a,b)=>rk(a)-rk(b)||b.ts-a.ts);const mins=[8,52,190,1440+300,2*1440+90,4*1440,8*1440,9*1440+200,30*1440];order.forEach((m,i)=>REAL[m.key]=DATA.now-mins[Math.min(i,mins.length-1)]*60000);}
// the picture each save was written over (shoot-current.mjs photographs the view before every save)
const PIC=DATA.pics||{};
const pic=m=>PIC[m.key]?`background-image:url(${PIC[m.key]}.jpg)`:'';
const chars=DATA.chars.map(c=>({...c,last:Math.max(...DATA.idx.filter(m=>m.charId===c.id).map(m=>REAL[m.key]))})).sort((a,b)=>b.last-a.last);
const OPEN='caoife';
const savesOf=id=>DATA.idx.filter(m=>m.charId===id).sort((a,b)=>REAL[b.key]-REAL[a.key]);

function who(sel,playing){
  return `<div class="who"><div class="colh">CHARACTERS</div>${chars.map(c=>{const last=savesOf(c.id)[0];
    return `<div class="ch ${c.id===sel?'on':''}"><div class="nm">${c.name}${c.id===playing?'<span class="play">PLAYING</span>':''}</div>
    <div class="ln">${[ARCH[c.arch]||c.arch,peo(c.people)].filter(Boolean).join(' · ')} · level ${c.level}</div>
    <div class="ln2">${parts(last)[0]}, ${place(last)}</div><div class="ln2">${c.n} save${c.n===1?'':'s'} · ${ago(c.last)}</div></div>`;}).join('')}
    <div class="ch new">${ico('i-import')} or bring one in from a file…</div></div>`;}

function svRow(m,o={}){const [d,h]=parts(m);const auto=m.kind==='auto';
  const mark=auto?ico('i-autoring'):ico('i-quill');
  const kind=auto?'AUTOSAVE':`SLOT ${m.slot+1}`;
  if(o.pics) return `<div class="sv ${auto?'auto':''} ${o.on?'on':''} ${o.primed?'primed':''}"><div class="thumb ${PIC[m.key]?'':'none'}" style="${pic(m)}"></div>
    <div><div class="d">${d}</div><div class="p">${o.primed?`<span class="ask">${o.primed}</span>`:`${h}, ${place(m)} · <span class="k">${kind}</span>`}</div></div>
    <div class="ago">${ago(REAL[m.key])}</div></div>`;
  return `<div class="sv ${auto?'auto':''} ${o.on?'on':''} ${o.primed?'primed':''}">${mark}
    <div><div class="d">${d} <span class="hr">· ${h}</span></div><div class="p">${o.primed?`<span class="ask">${o.primed}</span>`:`${place(m)} · <span class="k">${kind}</span>`}</div></div>
    <div class="st">level ${m.level} · ${m.gold} gold<small>${(m.size/1024).toFixed(0)} KB</small></div><div class="ago">${ago(REAL[m.key])}</div></div>`;}

function foot(mode){return `<div class="regfoot"><span class="btn">${ico('i-import')} Import</span><span class="btn">${ico('i-export')} Export Aoife</span><span class="btn">${ico('i-globe')} Export her world</span>
  <span class="del">· Delete this save · Delete Aoife</span><span class="store">${DATA.idx.length} saves, ${(DATA.total/1024).toFixed(0)} KB in this browser</span>
  <span class="go">${mode==='load'?'Load':'Write'}</span><span class="seal">${mode==='load'?'L':'W'}</span></div>`;}
const head=(mode,sub)=>`<div class="reghead"><span class="h">The Register</span><span class="sub">${sub}</span><span class="mode"><span class="${mode==='save'?'on':''}">Save</span><span class="${mode==='load'?'on':''}">Load</span></span></div><div class="rule"></div>`;
const ESC=`<div class="esc"><span class="key">↑</span><span class="key">↓</span> choose · <span class="key">E</span> twice to load · <span class="key">Tab</span> save / load · <span class="key">Esc</span> close</div>`;

// ── A: load, no pictures
{const S=savesOf(OPEN);const sel=S[1];
 const manual=S.filter(m=>m.kind==='manual'),auto=S.filter(m=>m.kind==='auto');
 screen('a-load','A — The register <small>characters on the left, the open one\'s saves on the right, newest first; every line in the calendar\'s words</small>','menu',
 `<div class="parch reg">${head('load','Choose a day to go back to.')}${who(OPEN,OPEN)}
  <div class="saves"><div class="colh">AOIFE'S SAVES</div>${S.map(m=>svRow(m,{on:m===sel,primed:m===sel?'Press again to load: the day as it was. What you have not saved is lost.':''})).join('')}</div>
  ${foot('load')}</div>${ESC}`);}

// ── A: save
{const S=savesOf(OPEN);const slots=[...Array(DATA.manual)].map((_,i)=>S.find(m=>m.kind==='manual'&&m.slot===i)||null);
 const rows=slots.slice(0,5).map((m,i)=>m?svRow(m,{primed:i===1?'Press again to write over Slot 2. The day it holds is lost.':'',on:i===1}):
   `<div class="sv empty">${ico('i-leaf')}<div><div class="d">An empty leaf</div><div class="p"><span class="k">SLOT ${i+1}</span></div></div><div class="st"></div><div class="ago"></div></div>`).join('');
 screen('a-save','A — Saving <small>today\'s eight slots as leaves; a full slot asks before it is written over, in words</small>','menu',
 `<div class="parch reg">${head('save',`${parts(savesOf(OPEN)[0]).join(' · ')}, ${place(savesOf(OPEN)[0])}`)}${who(OPEN,OPEN)}
  <div class="saves"><div class="colh">WRITE THIS DAY IN A SLOT · ${DATA.manual} SLOTS, ${DATA.auto} AUTOSAVES KEPT</div>${rows}
  <div class="sub2">THREE MORE EMPTY LEAVES</div></div>${foot('save')}</div>${ESC}`);}

// ── B: load, with pictures
{const S=savesOf(OPEN);const sel=S.find(m=>m.kind==='manual'&&m.slot===0)||S[2];const [d,h]=parts(sel);
 screen('b-load','B — The register with a picture <small>each save keeps a small picture of where you stood (about 15 KB); the chosen one shown large with its lines</small>','menu',
 `<div class="parch reg b">${head('load','Choose a day to go back to.')}${who(OPEN,OPEN)}
  <div class="saves"><div class="colh">AOIFE'S SAVES</div>${S.map(m=>svRow(m,{pics:1,on:m===sel})).join('')}</div>
  <div class="big"><div class="colh">${sel.kind==='auto'?'AUTOSAVE':'SLOT '+(sel.slot+1)}</div><div class="pic" style="${pic(sel)}"></div>
   <div class="t">${d}</div><div class="l">${era(sel)}</div><div class="l">${h}, ${place(sel)}</div><div class="rule"></div>
   <div class="dv"><span>Level</span><b>${sel.level}</b></div><div class="dv"><span>Gold</span><b>${sel.gold}</b></div><div class="dv"><span>Written</span><b>${ago(REAL[sel.key])}</b></div>
   <div class="l f" style="margin-top:8px">${(sel.size/1024).toFixed(0)} KB · ${DATA.store||'IndexedDB'} · build ${DATA.tag||''}</div></div>
  ${foot('load')}</div>${ESC}`);}

// ── B: save
{const NOW=savesOf(OPEN)[0];const S=savesOf(OPEN);const slots=[...Array(DATA.manual)].map((_,i)=>S.find(m=>m.kind==='manual'&&m.slot===i)||null);
 const rows=slots.slice(0,6).map((m,i)=>m?svRow(m,{pics:1,on:i===1,primed:i===1?'Press again to write over Slot 2.':''}):
   `<div class="sv empty"><div class="thumb none"></div><div><div class="d">An empty leaf</div><div class="p"><span class="k">SLOT ${i+1}</span></div></div><div class="ago"></div></div>`).join('');
 screen('b-save','B — Saving, with the picture <small>the view you will keep, beside the day it replaces</small>','menu',
 `<div class="parch reg b">${head('save',`${parts(savesOf(OPEN)[0]).join(' · ')}, ${place(savesOf(OPEN)[0])}`)}${who(OPEN,OPEN)}
  <div class="saves"><div class="colh">WRITE THIS DAY IN A SLOT</div>${rows}</div>
  <div class="big"><div class="colh">NOW</div><div class="pic" style="${pic(NOW)}"></div>
   <div class="t">${parts(NOW)[0]}</div><div class="l">${parts(NOW)[1]}, ${place(NOW)} · level ${NOW.level} · ${NOW.gold} gold</div><div class="rule"></div>
   <div class="l f">Slot 2 holds ${parts(slots[1])[0]}, ${place(slots[1])}. Writing over it keeps this picture and loses that day.</div></div>
  ${foot('save')}</div>${ESC}`);}

// ── C: today's menu on the paper
{const rows=(list)=>list.map(m=>`<div class="r1"><span class="n">${m.kind==='auto'?'A'+(m.slot+1):m.slot+1}</span>${ico(m.kind==='auto'?'i-autoring':'i-leaf')}<span><span class="a">Lv${m.level} · ${place(m)}</span><br><span class="b">${m.dateShort} · ${m.gold} gold · ${ago(REAL[m.key])} · ${(m.size/1024).toFixed(0)} KB</span></span><span class="b">✕</span></div>`).join('');
 const body=chars.map(c=>{const S=savesOf(c.id);return `<div class="gh">${c.name}${c.id===OPEN?' <small>(playing)</small>':''} <small>Lv${c.level}${c.people?' · '+c.people:''} · ${ago(c.last)}</small><span class="btn">Export</span><span class="btn">World</span><span class="btn">Delete character</span></div>
   <div class="ss">AUTOSAVES</div>${rows(S.filter(m=>m.kind==='auto'))}<div class="ss">SLOTS</div>${rows(S.filter(m=>m.kind==='manual').sort((a,b)=>a.slot-b.slot))}`;}).join('');
 screen('c-restyle','C — Restyle only <small>today\'s one column on the paper: the same groups, the same words</small>','menu',
 `<div class="parch c1"><div class="tt"><span class="h">Load Game</span><span class="tb">Save</span><span class="tb on">Load</span></div><div class="rule"></div>
  <div class="st">Saved in ${DATA.store||'IndexedDB'} · ${DATA.idx.length} saves, ${(DATA.total/1024).toFixed(0)} KB</div><span class="btn" style="font-size:13px;padding:3px 10px">Import a character from a file</span><div class="scroll">${body}</div></div>`);}

// ── comparison
screen('cmp-load','Today beside B — loading','cmp',`<div class="pair"><figure><figcaption>Today <small>the Load tab, two characters</small></figcaption><img src="current-load.png"></figure><figure><figcaption>B, the register with a picture</figcaption><img id="cl-b" src=""></figure></div>`);
window.SCREENS=screens;
</script>
</body>
</html>
