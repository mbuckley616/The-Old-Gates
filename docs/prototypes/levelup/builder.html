<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The human builder — level-up slice</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1014; overflow: hidden; color: #f3ead6; font: 12px/1.35 system-ui, sans-serif; }
  canvas { display: block; position: fixed; left: 0; top: 0; }
  #panel { position: fixed; z-index: 2; left: 0; top: 0; bottom: 0; width: 300px; overflow-y: auto; background: rgba(13, 16, 20, .88); border-right: 1px solid #2a2f36; padding: 8px 10px 40px; box-sizing: border-box; }
  #panel h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #b9a98a; margin: 12px 0 4px; border-bottom: 1px solid #2a2f36; padding-bottom: 2px; }
  .row { display: grid; grid-template-columns: 96px 1fr 38px 16px; gap: 4px; align-items: center; margin: 2px 0; }
  .row input[type=range] { width: 100%; }
  .row span { text-align: right; font-variant-numeric: tabular-nums; color: #cfc3aa; }
  .crow { display: grid; grid-template-columns: 96px 1fr 44px; gap: 4px; align-items: center; margin: 2px 0; }
  button, select, input[type=text] { background: #1c2128; color: #f3ead6; border: 1px solid #3a414b; border-radius: 3px; padding: 3px 6px; font: inherit; }
  button:hover { background: #262d36; }
  .bar { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0; }
  textarea { width: 100%; height: 110px; background: #11151a; color: #cfc3aa; border: 1px solid #2a2f36; font: 10px/1.3 ui-monospace, monospace; box-sizing: border-box; }
  #note { position: fixed; z-index: 2; right: 12px; bottom: 10px; color: #f3ead6; font: 13px/1.4 system-ui, sans-serif; text-shadow: 0 1px 2px #000; pointer-events: none; }
  body.still #panel { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<div id="panel"></div>
<div id="note">The human builder (Session 776, backlog K B1): a genome in, a person out. Drag to turn, wheel to zoom.</div>
<script type="module" src="./builder.js"></script>
</body>
</html>
