<!doctype html><html><head><meta charset="utf-8"><title>Houses prototype</title>
<style>html,body{margin:0;background:#8fa3b0;overflow:hidden}canvas{display:block}#t{position:absolute;left:0;right:0;font:15px Georgia,serif;color:#fff;text-shadow:0 1px 2px #000;display:flex}#t div{flex:1;text-align:center;padding-top:10px}</style>
<script src="../../../tests/vendor/three.min.js"></script>
<script src="../creatures/sk.js"></script><script src="houses.src.js"></script></head><body><div id="t"></div>
<script>
// #<nation>: today's house (left) beside the proposed one (right), three-quarter from the front
const view=(location.hash||'#irish').slice(1),W=1280,H=640;
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(W,H);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x9fb4c2);S.add(new THREE.HemisphereLight(0xdfe8f0,0x5a5040,.7));
const sun=new THREE.DirectionalLight(0xfff0d8,1.0);sun.position.set(8,14,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14});sun.shadow.bias=-.0005;S.add(sun);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshLambertMaterial({color:0x6a7a48}));gr.rotation.x=-Math.PI/2;gr.receiveShadow=true;S.add(gr);
const mat=new THREE.MeshLambertMaterial({vertexColors:true});const st=STYLE[view];const two=view==='french'||view==='aurenne';const w=view==='mark'?9:6,d=view==='mark'?4.6:4.4;
const tri=g=>g.attributes.position.count/3;
const a=oldBuilding(w,d,st,hRng(view+'a'),two),b=newBuilding(w,d,st,hRng(view+'b'),two);
const ma=new THREE.Mesh(a,mat),mb=new THREE.Mesh(b,mat);ma.position.set(-w*.75-1,0,0);mb.position.set(w*.75+1,0,0);[ma,mb].forEach(m=>{m.castShadow=true;m.receiveShadow=true;m.rotation.y=-.35;S.add(m);});
const cam=new THREE.PerspectiveCamera(32,W/H,.1,200);cam.position.set(2,5.2,w*2.1+8);cam.lookAt(0,2,0);
document.getElementById('t').innerHTML=`<div>Today (${tri(a)} triangles)</div><div>Proposed (${tri(b)} triangles)</div>`;
R.render(S,cam);window.INFO={old:tri(a),neu:tri(b)};window.READY=true;
</script></body></html>
