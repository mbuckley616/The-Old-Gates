<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>The Journal</title>
<!-- The Old Gates — the Journal (Michael's C on DECISION #132: the chronicle, the quests, what you were told, what is due)
     on the approved parchment kit (docs/prototypes/ui, A, 27 Sep 2026) and the open book (docs/prototypes/books, A, 2 Oct).
     Concept, 5 Oct 2026. build.py inlines kit.css, the icon symbols (defs.html), the book's CSS and the game's own journal
     (current.json, written by shoot-current.mjs from four days of play on auto/systems: GAME_LOG with every stamp,
     worldState.told, calendarDue(), journalNames(), CAL and FEASTS, every date line made by gameDateLine/calDateLine).
     Every .screen is 1280×720; shoot.mjs photographs them.
     For the builder: plain DOM on the books prototype's .tome. Four chapters on .chap2 ribbons at the fore-edge. Each leaf is
     filled by flow(): blocks are appended in order and a block that would cross the foot starts the next leaf, so the
     Chronicle opens on its last spread with the line you write at the foot of the last leaf. .je is a line (.tm the time in
     the margin, .tx the words; .q a quest's own words with its .qt title in rubric capitals; .note your own line, in a
     second ink); .nm a name that opens its page in Told. Quests: .qi index rows (.on the open one) and the quest's page.
     Told (A): one page a person or a place (.ti rows, .ta answers). Due: .cal, the month as four weeks of seven named days,
     and .du rows. -->
<link href="../ui/fonts/fonts.css" rel="stylesheet">
<style>
/* Copied from docs/prototypes/ui/index.html (the approved parchment kit, 27 Sep) via rest; asset paths point there. */

:root{
  /* paper */
  --paper-hi:#ecdcb2; --paper:#e0c994; --paper-lo:#c9ab6e; --paper-edge:#7a4e1e;
  /* ink */
  --ink:#2e1c0c; --ink-soft:#5a4128; --ink-faint:#8a7050; --rubric:#7a1f10; --gilt:#9a7020;
  /* metal (HUD only) */
  --iron:#1c1812; --iron-hi:#3a3226; --bronze:#a07a38; --bronze-hi:#d8b46a; --bronze-lo:#5a4018;
  /* vitals */
  --hp:#a8281c; --hp-hi:#d8503a; --mp:#2c5aa6; --mp-hi:#5a8ad8; --st:#3c7e2e; --st-hi:#6aac48;
  --display:'IM Fell English SC',Georgia,serif; --fell:'IM Fell English',Georgia,serif; --body:'EB Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#141008;color:#e8dcc0;font:15px/1.4 var(--body);padding:24px 0}
h1.page{font:28px var(--display);text-align:center;color:#e0c994;margin:8px 0 2px}
p.lede{max-width:1100px;margin:0 auto 18px;text-align:center;color:#b8a888}
.cap{width:1280px;margin:28px auto 8px;font:17px var(--display);color:#e0c994;letter-spacing:.04em}
.cap small{font:13px var(--body);color:#a89878;letter-spacing:0;margin-left:10px}
.screen{width:1280px;height:720px;margin:0 auto;position:relative;overflow:hidden;background:#000 url(../ui/backdrop.png) center/cover;font-family:var(--body)}
.screen.menu::before{content:"";position:absolute;inset:0;backdrop-filter:blur(3px) brightness(.42) sepia(.35);z-index:0}
svg.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex:none}
.num{font-variant-numeric:lining-nums tabular-nums}

/* ───────── parchment ───────── */
.parch{position:absolute;isolation:isolate;color:var(--ink);z-index:2}
.parch::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:4px;
  background:
    radial-gradient(ellipse at 50% 42%,rgba(255,250,230,.35) 0,transparent 45%),
    radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(110,60,15,.30) 88%,rgba(80,40,8,.55) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='520' height='520'><filter id='s'><feTurbulence type='fractalNoise' baseFrequency='.011' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .28  0 0 0 0 .08  0 0 0 -1.6 .9'/></filter><rect width='100%' height='100%' filter='url(%23s)'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .2  0 0 0 0 .06  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>"),
    linear-gradient(170deg,var(--paper-hi),var(--paper) 55%,var(--paper-lo));
  filter:url(#deckle) drop-shadow(0 14px 22px rgba(0,0,0,.6));}
.parch.small::before{filter:url(#deckle-s) drop-shadow(0 8px 14px rgba(0,0,0,.55))}
.rule{height:9px;margin:6px 0 8px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='9' preserveAspectRatio='none'><path d='M0 4.5 Q200 2.5 400 4.5' stroke='%235a4128' stroke-width='1.1' fill='none'/><path d='M40 6.5 Q200 5.2 360 6.5' stroke='%235a4128' stroke-width='.5' fill='none' opacity='.6'/></svg>") center/100% 100% no-repeat}
.h{font:22px/1 var(--display);color:var(--rubric);letter-spacing:.02em}
.h2{font:15px/1 var(--display);color:var(--ink-soft);letter-spacing:.08em}
.meta{font:italic 14px var(--fell);color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.seal{position:absolute;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#f0d8b0;font:20px var(--display);
  background:radial-gradient(circle at 38% 34%,#c8483a,#8a1c12 55%,#5a0e08);box-shadow:inset 0 -3px 6px rgba(0,0,0,.45),inset 0 2px 3px rgba(255,200,170,.35),0 3px 6px rgba(0,0,0,.5);
  clip-path:polygon(50% 0,62% 4%,74% 2%,82% 11%,94% 16%,95% 29%,100% 40%,96% 52%,100% 64%,93% 74%,90% 87%,78% 92%,68% 100%,55% 96%,44% 100%,33% 94%,20% 96%,12% 86%,4% 77%,5% 64%,0 52%,4% 40%,2% 27%,10% 17%,20% 10%,32% 3%)}

/* hub sheet and tabs */
.sheet{left:52px;top:62px;width:1176px;height:620px;padding:22px 34px 0}
.tabs{position:absolute;left:84px;top:18px;display:flex;gap:6px;z-index:1}
.tab{position:relative;isolation:isolate;padding:9px 18px 14px;font:17px/1 var(--display);color:var(--ink-soft);display:flex;gap:8px;align-items:center}
.tab::before{content:"";position:absolute;inset:0 0 -6px;z-index:-1;border-radius:6px 6px 0 0;background:linear-gradient(#c7a86c,#b18f55);filter:url(#deckle-s) drop-shadow(0 -2px 3px rgba(0,0,0,.4))}
.tab.on{color:var(--rubric);top:-4px;z-index:3}
.tab.on::before{background:linear-gradient(#ead9ae,#e6d3a6);inset:0 0 -14px}
.tab .ico{font-size:19px}
.close{right:-14px;top:-14px}
.vitals{position:absolute;left:34px;right:34px;bottom:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;font:15px var(--body)}
.vital{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.vital b{font:15px var(--display);font-weight:400}
.ibar{height:10px;border:1px solid var(--ink-soft);border-radius:1px;background:rgba(80,50,20,.12);position:relative;overflow:hidden}
.ibar i{position:absolute;left:0;top:0;bottom:0;opacity:.85}
.ibar i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 3px,rgba(255,240,210,.18) 3px 4px)}

/* lists */
.cols{display:grid;grid-template-columns:30px 1fr 160px 54px 64px;gap:0 10px;align-items:center}
.lh{font:13px var(--display);letter-spacing:.1em;color:var(--ink-faint);padding:0 10px 4px}
.row{padding:6px 10px;font-size:17px;border-bottom:1px solid rgba(90,65,40,.18)}
.row svg.ico{width:24px;height:24px;color:var(--ink-soft)}
.row.sel{background:linear-gradient(90deg,rgba(122,31,16,.14),rgba(122,31,16,.04));box-shadow:inset 3px 0 var(--rubric)}
.row.sel .n{color:var(--rubric)}
.r{text-align:right}
.qty{font:italic 14px var(--fell);color:var(--ink-faint);margin-left:6px}
.subtabs{display:flex;gap:22px;font:16px var(--display);color:var(--ink-faint);margin:2px 0 8px 10px}
.subtabs .on{color:var(--ink);border-bottom:2px solid var(--rubric)}

/* paper-doll */
.doll{display:grid;grid-template-columns:repeat(3,66px);grid-auto-rows:60px;gap:6px;justify-content:center}
.slot{border:1.5px solid var(--ink-soft);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:10px var(--display);letter-spacing:0;white-space:nowrap;color:var(--ink-faint);background:rgba(120,80,30,.07);box-shadow:inset 0 0 0 3px rgba(224,201,148,.8),inset 0 0 0 4px rgba(90,65,40,.35)}
.slot svg.ico{width:28px;height:28px;color:var(--ink-faint);opacity:.55}
.slot.full .ico{color:var(--ink);opacity:1}
.slot.full{color:var(--ink-soft)}
.gap{visibility:hidden}

/* ───────── HUD (metal) ───────── */
.plate{position:absolute;background:linear-gradient(#2c261c,#15110b);border:1px solid var(--bronze-lo);box-shadow:inset 0 0 0 1px rgba(216,180,106,.35),inset 0 1px 0 rgba(255,230,170,.25),0 3px 10px rgba(0,0,0,.6);border-radius:6px;z-index:3}
.roundel{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:36px;color:#e6cf9a;
  background:radial-gradient(circle at 50% 40%,#3a3124,#15110b 70%);border:3px solid var(--bronze);box-shadow:inset 0 0 0 1px var(--bronze-lo),inset 0 2px 6px rgba(0,0,0,.8),0 0 0 1px #0a0806,0 2px 6px rgba(0,0,0,.6)}
.roundel.dim{color:#6a5a40}
.hbar{position:relative;height:10px;border-radius:5px;background:#0b0906;box-shadow:inset 0 1px 2px #000,0 0 0 1px var(--bronze-lo),0 0 0 2px rgba(216,180,106,.25);overflow:hidden}
.hbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.hbar i::after{content:"";position:absolute;left:2px;right:2px;top:1px;height:3px;border-radius:2px;background:rgba(255,255,255,.28)}
.hp i{background:linear-gradient(var(--hp-hi),var(--hp))} .mp i{background:linear-gradient(var(--mp-hi),var(--mp))} .st i{background:linear-gradient(var(--st-hi),var(--st))}
.hudtxt{font:13px var(--body);color:#e6d4a8;text-shadow:0 1px 2px #000,0 0 6px #000}
.compass{position:absolute;height:34px;width:380px;border-radius:17px;overflow:hidden;background:linear-gradient(#1f1a12,#0d0a07);box-shadow:inset 0 1px 4px #000,0 0 0 2px var(--bronze-lo),0 0 0 3px var(--bronze),0 0 0 4px #0a0806,0 3px 10px rgba(0,0,0,.6);z-index:3}
.compass .strip{position:absolute;inset:0;display:flex;align-items:center;font:15px var(--display);color:#d8c290}
.compass .strip span{position:absolute;transform:translateX(-50%)}
.compass .tick{width:1px;height:8px;background:#8a7450;top:13px}
.compass .n{color:#e8b050;font-size:19px}
.compass::after{content:"";position:absolute;left:50%;top:0;width:0;height:0;border:6px solid transparent;border-top-color:var(--bronze-hi);transform:translateX(-50%)}
.mini{position:absolute;width:150px;height:150px;border-radius:50%;background:url(../ui/mini-crop.png) center/115%;filter:sepia(.55) saturate(.8) contrast(1.05);box-shadow:inset 0 0 18px rgba(40,20,5,.7);z-index:3}
.miniring{position:absolute;width:162px;height:162px;border-radius:50%;box-shadow:0 0 0 5px var(--bronze),0 0 0 6px #0a0806,inset 0 0 0 1px var(--bronze-lo),0 4px 12px rgba(0,0,0,.6);z-index:4}
.miniring b{position:absolute;left:50%;top:-15px;transform:translateX(-50%);font:14px var(--display);color:#f0d8a0;background:radial-gradient(#3a3124,#15110b);border:2px solid var(--bronze);width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.ribbon{position:absolute;padding:6px 34px 7px;font:22px var(--display);color:var(--ink);z-index:3}
.xh{position:absolute;left:640px;top:360px;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:rgba(255,245,220,.85);box-shadow:0 0 0 1px rgba(0,0,0,.6);z-index:3}
.prompt{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;font:17px var(--body);color:#f0e2c0;text-shadow:0 1px 3px #000,0 0 8px #000;z-index:3}
.key{font:14px var(--display);width:26px;height:26px;display:grid;place-items:center;border-radius:4px;color:#2e1c0c;background:linear-gradient(#ecdcb2,#c9ab6e);box-shadow:0 0 0 1px #5a4018,0 2px 3px rgba(0,0,0,.6);text-shadow:none}
.cbar{position:absolute;right:14px;bottom:8px;font:13px var(--body);color:rgba(240,226,192,.85);text-shadow:0 1px 2px #000,0 0 5px #000;z-index:3}
.dp{position:absolute;right:22px;bottom:92px;display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:4px;z-index:3}
.dp div{border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(58,49,36,.85),rgba(21,17,11,.85));border:2px solid rgba(160,122,56,.8);color:#d8c290;display:grid;place-items:center;font-size:14px}

/* dialogue */
.dlg{left:260px;top:372px;width:760px;height:320px;padding:26px 40px 18px 40px}
.dlg .who{display:flex;gap:16px;align-items:center}
.dlg .line{font:20px/1.45 var(--body);margin:4px 0 10px;color:var(--ink)}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:2px 34px}
.topic{font:18px/1.2 var(--body);padding:6px 4px;display:flex;gap:10px;border-bottom:1px dotted rgba(90,65,40,.35)}
.topic i{font:italic 15px var(--fell);color:var(--ink-faint);width:14px;text-align:right}
.topic.new{color:var(--rubric)}
.topic.new::after{content:"❧";margin-left:auto;color:var(--gilt);font-size:15px}
.topic.old{color:var(--ink-faint)}
.foot{position:absolute;left:40px;right:40px;bottom:14px;font:italic 13px var(--fell);color:var(--ink-faint);display:flex;justify-content:space-between}

/* magic */
.school{font:14px var(--display);letter-spacing:.1em;color:var(--rubric);margin:10px 0 2px;display:flex;align-items:center;gap:8px}
.school .ico{font-size:18px}
.spell{display:grid;grid-template-columns:190px 1fr 70px;gap:10px;align-items:baseline;padding:4px 8px;font-size:16px;border-bottom:1px solid rgba(90,65,40,.14)}
.spell .nm{font:18px var(--body);font-weight:500}
.spell .gl{font:italic 13px var(--fell);color:var(--ink-faint);margin-left:6px}
.spell.lock{color:var(--ink-faint)} .spell.lock .nm{font-weight:400}
.spell.sel{background:linear-gradient(90deg,rgba(122,31,16,.14),rgba(122,31,16,.03));box-shadow:inset 3px 0 var(--rubric)}
.spell.sel .nm{color:var(--rubric)}

/* attributes */
.attr{display:grid;grid-template-columns:28px 150px 40px 1fr;gap:10px;align-items:center;padding:5px 0;font-size:18px;border-bottom:1px solid rgba(90,65,40,.14)}
.attr .v{font:22px var(--display);text-align:right;color:var(--ink)}
.pips{display:flex;gap:4px}
.pips span{width:13px;height:13px;border:1.2px solid var(--ink-soft);transform:rotate(45deg) scale(.8)}
.pips span.f{background:var(--ink-soft)}
.dv{display:flex;justify-content:space-between;font-size:17px;padding:4px 0;border-bottom:1px dotted rgba(90,65,40,.3)}

/* style sheet */
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;font:12px var(--body);color:var(--ink-soft);width:72px;text-align:center}
.sw i{width:56px;height:30px;border-radius:3px;box-shadow:0 0 0 1px rgba(46,28,12,.5)}
.iconset{display:grid;grid-template-columns:repeat(9,1fr);gap:8px 6px;font-size:30px;color:var(--ink)}
.iconset div{display:flex;flex-direction:column;align-items:center;gap:4px}
.iconset small{font:11px var(--body);color:var(--ink-faint)}
.btn{display:inline-block;font:16px var(--display);padding:7px 18px;border:1.5px solid var(--ink-soft);border-radius:2px;color:var(--ink);background:rgba(120,80,30,.08);box-shadow:inset 0 0 0 2px rgba(224,201,148,.8),inset 0 0 0 3px rgba(90,65,40,.3)}
.btn.hot{color:var(--rubric);border-color:var(--rubric);background:rgba(122,31,16,.1)}
.btn.off{color:var(--ink-faint);border-color:var(--ink-faint);opacity:.7}

:root{--leaf:
    radial-gradient(ellipse at 50% 45%,rgba(255,250,230,.30) 0,transparent 55%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='520' height='520'><filter id='s'><feTurbulence type='fractalNoise' baseFrequency='.011' numOctaves='3' seed='9' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .28  0 0 0 0 .08  0 0 0 -1.6 .75'/></filter><rect width='100%' height='100%' filter='url(%23s)'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .2  0 0 0 0 .06  0 0 0 .2 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>"),
    linear-gradient(170deg,var(--paper-hi),var(--paper) 55%,var(--paper-lo))}

/* the open book (A): a leather board, a block of pages, two leaves, a gutter */
.tome{position:absolute;left:96px;top:30px;width:1088px;height:612px;border-radius:12px;z-index:2;
  background:radial-gradient(ellipse at 50% 40%,#5a3418,#3a1f0c 60%,#24120a);box-shadow:0 18px 40px rgba(0,0,0,.7),inset 0 0 0 3px rgba(160,110,50,.35),inset 0 0 0 5px #24120a,inset 0 0 0 6px rgba(160,110,50,.25)}
.tome .block{position:absolute;left:14px;right:14px;top:12px;bottom:12px;border-radius:3px;
  box-shadow:-1px 1px 0 #cbb07a,-2px 2px 0 #8a6a3a,-3px 3px 0 #d6bd88,-4px 4px 0 #8a6a3a,-5px 5px 0 #cbb07a,1px 1px 0 #cbb07a,2px 2px 0 #8a6a3a,3px 3px 0 #d6bd88,4px 4px 0 #8a6a3a,5px 5px 0 #cbb07a}
.leaf{position:absolute;top:12px;bottom:12px;width:530px;background:var(--leaf);color:var(--ink);padding:44px 56px 40px;overflow:hidden;font:18.5px/1.6 var(--body)}
.leaf.l{left:14px;border-radius:3px 0 0 3px;padding-right:62px}
.leaf.r{right:14px;border-radius:0 3px 3px 0;padding-left:62px}
.leaf.l::after,.leaf.r::after{content:"";position:absolute;top:0;bottom:0;width:70px;pointer-events:none}
.leaf.l::after{right:0;background:linear-gradient(90deg,transparent,rgba(110,70,25,.12) 55%,rgba(60,35,10,.42))}
.leaf.r::after{left:0;background:linear-gradient(270deg,transparent,rgba(110,70,25,.12) 55%,rgba(60,35,10,.42))}
.leaf.l::before,.leaf.r::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 62%,rgba(110,60,15,.18) 100%)}
.leaf .run{position:absolute;top:18px;left:0;right:0;text-align:center;font:12.5px var(--display);letter-spacing:.16em;color:var(--ink-faint)}
.leaf .fol{position:absolute;bottom:16px;left:0;right:0;text-align:center;font:italic 15px var(--fell);color:var(--ink-faint)}
.leaf p{margin:0 0 .7em;text-align:justify;hyphens:auto;text-indent:1.2em}
.leaf p.first{text-indent:0}
.leaf p.sig{text-align:right;font:italic 18px var(--fell);color:var(--ink-soft);text-indent:0;margin-top:1em}
.leaf .dc{float:left;font:74px/.82 var(--display);color:var(--rubric);margin:6px 8px 0 -2px;padding:4px 6px 2px 4px;background:radial-gradient(circle at 50% 50%,rgba(154,112,32,.18),transparent 70%)}
.leaf .ttl{text-align:center;margin:70px 0 0}
.leaf .ttl .t{font:34px/1.15 var(--display);color:var(--rubric);letter-spacing:.02em}
.leaf .ttl .orn{font:22px var(--fell);color:var(--gilt);margin:14px 0}
.leaf .ttl .col{font:italic 18px/1.55 var(--fell);color:var(--ink-soft);text-align:center;text-indent:0;padding:0 8px}
.leaf .end{text-align:center;font:22px var(--fell);color:var(--gilt);margin-top:8px}
.leaf.hand{font:italic 20px/1.55 var(--fell)}
.leaf.hand p{text-indent:0;text-align:left}
.leaf.hand p.sal{font-size:21px;margin-bottom:.8em}
.margin{position:absolute;left:56px;right:62px;bottom:52px;text-align:center;font:italic 16px var(--fell);color:var(--rubric);border-top:1px solid rgba(122,31,16,.3);padding-top:8px}
.margin b{font:16px var(--display);font-weight:400}
.ribbon2{position:absolute;left:50%;top:-6px;width:18px;height:628px;margin-left:30px;z-index:4;background:linear-gradient(90deg,#5a0e08,#9a2a1c 45%,#6a140c);clip-path:polygon(0 0,100% 0,100% 100%,50% 97.6%,0 100%);box-shadow:0 2px 4px rgba(0,0,0,.4);opacity:.95}
.turn{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:34px;align-items:center;z-index:3}
.turn span{display:flex;gap:9px;align-items:center}
.screen{background-size:cover;background-position:center;background-image:url(backdrop-street.png)}
.screen.menu::before{backdrop-filter:blur(2px) brightness(.45) sepia(.3)}
.tome{top:62px}
.tome .leaf{font:16px/1.38 var(--fell);padding:44px 50px 46px 54px}
.tome .leaf.l{padding-right:60px}
.tome .leaf.r{padding-left:62px;text-align:left} /* the kit's .r right-aligns a row's last cell */
/* the four chapters, ribbons at the fore-edge */
.chap2{position:absolute;right:-30px;top:44px;display:flex;flex-direction:column;gap:8px;z-index:1}
.chap2 span{width:32px;height:112px;border-radius:0 6px 6px 0;display:grid;place-items:center;writing-mode:vertical-rl;font:15px var(--display);letter-spacing:.12em;color:#e6cf9a;background:linear-gradient(90deg,#3e2210,#6a3c18);box-shadow:2px 2px 4px rgba(0,0,0,.5)}
.chap2 span.on{background:linear-gradient(90deg,#6a170c,#a83a24);color:#f8e8c8;width:40px}
/* the chronicle */
.dh{margin:2px 0 6px}
.dh .d{font:19px/1.1 var(--display);color:var(--rubric);letter-spacing:.02em}
.dh .y{font:italic 13.5px var(--fell);color:var(--ink-faint)}
.dh.cont .d::after{content:" (continued)";font:italic 13px var(--fell);color:var(--ink-faint);letter-spacing:0}
.je{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:2px 0 4px;align-items:baseline}
.je .tm{font:12px var(--display);letter-spacing:.04em;color:var(--ink-faint);text-align:right;white-space:nowrap}
.je .tx{color:var(--ink)}
.je.q .tx{font-style:italic}
.je .qt{font:14.5px var(--display);font-style:normal;color:var(--rubric);letter-spacing:.03em;margin-right:4px}
.je.note .tx{color:#22304e;font-style:italic;font-size:16.5px}
.je.note .tm{color:#4a5878}
.je.note .tm::before{content:"✎ ";font-family:var(--body)}
.nm{border-bottom:1px dotted rgba(122,31,16,.75);color:inherit}
.gap1{height:10px}
.write{display:grid;grid-template-columns:62px 1fr;gap:10px;margin-top:10px;align-items:end}
.write .tm{text-align:right;color:#4a5878;font:12px var(--display)}
.write .ln{border-bottom:1.2px solid rgba(34,48,78,.55);font:italic 16px var(--fell);color:rgba(34,48,78,.5);padding:0 0 2px;position:relative}
.write .ln::after{content:"";position:absolute;right:0;bottom:-20px;font:12px var(--body)}
.write small{grid-column:2;font:italic 12.5px var(--fell);color:var(--ink-faint)}
.caret{display:inline-block;width:1.5px;height:17px;background:#22304e;vertical-align:-3px;margin-right:4px}
/* quests */
.lh2{font:13px var(--display);letter-spacing:.12em;color:var(--ink-faint);margin:10px 0 2px;border-bottom:1px solid rgba(90,65,40,.25);padding-bottom:2px}
.qi{display:grid;grid-template-columns:20px 1fr auto;gap:8px;padding:5px 6px 5px 4px;align-items:baseline;border-bottom:1px solid rgba(90,65,40,.12)}
.qi .mk{font:15px var(--body);color:var(--ink-soft);text-align:center}
.qi .t{font:17px/1.2 var(--fell);color:var(--ink)}
.qi .g{display:block;font:italic 13px var(--fell);color:var(--ink-faint)}
.qi .w{font:12px var(--display);color:var(--ink-faint);white-space:nowrap}
.qi .w.due{color:var(--rubric)}
.qi.done .t{color:var(--ink-soft)}
.qi.done .mk{color:var(--gilt)}
.qi.on{background:linear-gradient(90deg,rgba(122,31,16,.14),rgba(122,31,16,.03));box-shadow:inset 3px 0 var(--rubric)}
.qi.on .t{color:var(--rubric)}
.qh{font:27px/1.15 var(--display);color:var(--rubric);margin:6px 0 2px}
.qs{font:italic 14.5px var(--fell);color:var(--ink-soft);margin-bottom:8px}
.stamp{position:absolute;right:58px;top:96px;transform:rotate(-9deg);font:20px var(--display);letter-spacing:.2em;color:rgba(122,31,16,.8);border:2px solid rgba(122,31,16,.7);border-radius:4px;padding:2px 10px 0;opacity:.85}
/* told */
.srch{display:flex;gap:8px;align-items:center;border-bottom:1.2px solid var(--ink-soft);padding:0 0 3px;margin:2px 0 8px;font:italic 15px var(--fell);color:var(--ink-faint)}
.srch svg.ico{width:16px;height:16px;color:var(--ink-soft)}
.ti{display:grid;grid-template-columns:18px 1fr auto;gap:8px;padding:4px 6px 4px 4px;align-items:baseline;border-bottom:1px solid rgba(90,65,40,.12)}
.ti .mk{font:13px var(--display);color:var(--ink-faint);text-align:center}
.ti .t{font:17px/1.2 var(--fell)}
.ti .t i{font-size:14px;color:var(--ink-faint)}
.ti .n{font:12px var(--display);color:var(--ink-faint)}
.ti.on{background:linear-gradient(90deg,rgba(122,31,16,.14),rgba(122,31,16,.03));box-shadow:inset 3px 0 var(--rubric)}
.ti.on .t{color:var(--rubric)}
.ta{margin:0 0 8px}
.ta .k{display:flex;justify-content:space-between;gap:10px;font:13px var(--display);letter-spacing:.06em;color:var(--ink-soft);border-bottom:1px solid rgba(90,65,40,.15);padding-bottom:1px;margin-bottom:2px}
.ta .k small{font:italic 12.5px var(--fell);letter-spacing:0;color:var(--ink-faint);white-space:nowrap}
.ta .ans{font:16.5px/1.38 var(--body);color:var(--ink)}
.ta .ans::before{content:"“"} .ta .ans::after{content:"”"}
/* due */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid rgba(90,65,40,.35);border-top:1px solid rgba(90,65,40,.35);margin:6px 0 4px}
.cal > div{border-right:1px solid rgba(90,65,40,.35);border-bottom:1px solid rgba(90,65,40,.35);height:52px;padding:2px 4px;position:relative;font:15px var(--fell)}
.cal > div.hd{height:auto;font:10.5px var(--display);letter-spacing:.04em;color:var(--ink-soft);text-align:center;padding:3px 0;background:rgba(120,80,30,.08)}
.cal > div.past{color:var(--ink-faint);background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(90,65,40,.07) 6px 7px)}
.cal > div.today{box-shadow:inset 0 0 0 2px var(--rubric);color:var(--rubric)}
.cal .dot{position:absolute;left:5px;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--ink-soft)}
.cal .m{position:absolute;right:3px;bottom:2px;font:15px var(--body);color:var(--rubric)}
.cal .m.f{color:var(--gilt)}
.calk{display:flex;flex-wrap:wrap;gap:4px 14px;font:italic 13px var(--fell);color:var(--ink-faint);margin:4px 0 8px}
.calk b{font-style:normal;font-weight:400;color:var(--rubric);font-family:var(--body)}
.fe{display:grid;grid-template-columns:22px 1fr auto;gap:6px;font:15px/1.3 var(--fell);padding:2px 0}
.fe .w{font:12px var(--display);color:var(--ink-faint)}
.fe.next .t{color:var(--rubric)}
.du{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:6px 0 8px;border-bottom:1px solid rgba(90,65,40,.15)}
.du .w{font:14px var(--display);color:var(--rubric);text-align:right;line-height:1.25}
.du .w small{display:block;font:italic 12px var(--fell);color:var(--ink-faint)}
.du .t{font:17px/1.35 var(--fell)}
.du .t small{display:block;font:italic 13.5px var(--fell);color:var(--ink-faint)}
.lede2{font:italic 15px var(--fell);color:var(--ink-soft);margin:0 0 8px}
.turn{bottom:12px}
/* C: one sheet */
.sheet .cc{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;height:500px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent)}
.sheet .je{font:16px/1.38 var(--body)}
.sheet .wbox{border:1px solid rgba(90,65,40,.4);border-radius:3px;padding:6px 10px;font:italic 15px var(--fell);color:var(--ink-faint);margin:0 0 10px;background:rgba(255,248,225,.25)}
/* comparisons */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:1280px;padding:18px 16px 18px;background:#141008;position:relative}
.screen.cmp{height:auto}
.pair figure{margin:0}
.pair img{width:616px;display:block;border:1px solid #3a3022}
.pair figcaption{font:17px var(--display);color:#e0c994;margin-bottom:8px;letter-spacing:.04em}
.pair figcaption small{font:13px var(--body);color:#a89878;letter-spacing:0;margin-left:8px}
#measure{position:absolute;left:-3000px;top:0}
</style>
</head>

(async()=>{

const ico=(id,c='ico')=>`<svg class="${c}"><use href="#${id}"/></svg>`;

// ── the lines, one per event. Where a quest writes its own words, the bare log line of the same minute that repeats its

const qLines=RAW.filter(e=>e.q);
const GIVER={};RAW.forEach(e=>{if(!e.q){const m=e.text.match(/^(.+?) — (.+)$/);if(m&&qLines.some(q=>q.qt===m[1]))GIVER[m[1]]=m[2];}});

  return !qLines.some(q=>Math.abs(q.t-e.t)<=1&&q.qt&&e.text.includes(q.qt));});

  const re=new RegExp('(^|[^\\p{L}])('+NAMES.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\p{L}])','gu');
  let out='',at=0;t.replace(re,(m,pre,name,off)=>{const i=off+pre.length;out+=esc(t.slice(at,i))+`<span class="nm">${esc(name)}</span>`;at=i+name.length;return m;});
  return out+esc(t.slice(at));}

const yearLine=`in the ${DATA.cal.year}th year of ${DATA.cal.era}`;

// ── flow: blocks into leaves of the book's size; a block that would cross the foot starts the next leaf
function flow(blocks,opts={}){
  const M=$('#measure');M.innerHTML=`<div class="tome" style="position:relative;left:0;top:0"><div class="leaf l" id="ml"></div></div>`;
  const leaf=$('#ml');const leaves=[];let cur=[];
  const inner=()=>leaf.clientHeight-46-(opts.reserve||0);
  for(const b of blocks){leaf.insertAdjacentHTML('beforeend',b.html);
    let over=leaf.scrollHeight>leaf.clientHeight||[...leaf.children].some(c=>c.getBoundingClientRect().bottom>leaf.getBoundingClientRect().bottom-46);
    if(over&&cur.length){leaves.push(cur);cur=[];leaf.innerHTML=(b.cont?b.cont():'' )+b.html;if(b.cont)cur.push(b.cont());}
    cur.push(b.html);}
  if(cur.length)leaves.push(cur);M.innerHTML='';return leaves.map(x=>x.join(''));

   <div class="turn hudtxt"><span><span class="key">A</span><span class="key">D</span> turn a leaf</span><span><span class="key">1</span>–<span class="key">4</span> a chapter</span><span><span class="key" style="width:auto;padding:0 6px">Esc</span> close</span></div>`;}

// ── I. the chronicle, oldest first, the book open at its last spread
function chronicleBlocks(){
  const days=new Map();L.forEach(e=>{if(!days.has(e.day))days.set(e.day,[]);days.get(e.day).push(e);});
  const out=[];
  [...days.keys()].sort((a,b)=>a-b).forEach((k,di)=>{const es=days.get(k);const dl=es[0].date.replace(/, in the .*$/,'');
    const head=(cont)=>`<div class="dh${cont?' cont':''}"><div class="d">${esc(dl)}</div>${cont?'':`<div class="y">${esc(yearLine)}</div>`}</div>`;

    const line=e=>`<div class="je${e.q?' q':''}${e.note?' note':''}"><span class="tm">${esc(e.time)}</span><span class="tx">${e.q?`<span class="qt">${esc(e.qt)}</span>`:''}${linked(e.text)}</span></div>`;
    out.push({html:head(false)+line(es[0])});   // a day's head never sits alone at the foot of a leaf

  out.push({html:`<div class="write"><span class="tm">9:36 pm</span><span class="ln"><span class="caret"></span>a line of your own</span><small>Enter writes it under today, with the hour. Up to 500 letters.</small></div>`});

// page 1 is a recto: the first spread is the endpaper and leaf 1, and the book opens at the spread holding the last leaf
const P=['',...CHRON];if(P.length%2)P.push('');const nS=P.length/2;
const nC=CHRON.length;const last=[P[P.length-2],P[P.length-1]];
const lastDay=L[L.length-1].date.replace(/, in the .*$/,'').toUpperCase();

const dueOf=t=>DATA.D.find(d=>t&&d.text.startsWith(t));
function qRow(id,on){const ls=qLines.filter(e=>e.q===id),t=ls[0].qt,s=qstate(id),du=dueOf(t),g=GIVER[t];
  return `<div class="qi ${s==='done'?'done':''} ${on?'on':''}"><span class="mk">${s==='done'?'✓':'○'}</span><span class="t">${esc(t)}${g?`<span class="g">for ${esc(g)}</span>`:''}</span>${du?`<span class="w due">by ${esc(du.day.replace(/^\w+, the /,'').replace(' of Reaping',''))}</span>`:`<span class="w">${esc(dshort(ls[ls.length-1].short).replace(' Reaping',''))}</span>`}</div>`;}
const SELQ=qids.find(id=>qLines.find(e=>e.q===id).qt==='First Blood')||qids[0];
const qLeft=`<div class="h">Quests</div><div class="rule"></div><div class="lh2">IN HAND</div>${qids.filter(id=>qstate(id)==='hand').map(id=>qRow(id,id===SELQ)).join('')}
  <div class="lh2">DONE</div>${qids.filter(id=>qstate(id)==='done').map(id=>qRow(id,id===SELQ)).join('')}`;
function qPage(id){const ls=qLines.filter(e=>e.q===id),t=ls[0].qt,s=qstate(id),g=GIVER[t];
  return `${s==='done'?'<div class="stamp">DONE</div>':''}<div class="qh">${esc(t)}</div><div class="qs">${g?'for '+esc(g)+' · ':''}taken ${esc(dshort(ls[0].short))}${s==='done'?' · done '+esc(dshort(ls[ls.length-1].short)):''}</div><div class="rule"></div>`+
   ls.map(e=>`<div class="je q"><span class="tm">${esc(dshort(e.short).replace(' Reaping',''))}<br>${esc(e.time)}</span><span class="tx">${linked(e.text)}</span></div>`).join('');}
screen('a-quests','A — II. Quests <small>the ones in hand first, a dated one with its day in rubric; the open quest\'s own words in order on the right</small>','menu',tome(1,qLeft,qPage(SELQ),'QUESTS',esc(qLines.find(e=>e.q===SELQ).qt.toUpperCase()),9));

// ── III. told. A: one page a person or a place. A person's own answers file under their name; what a place is, under the
// place; an answer that opens or closes a quest (I'm looking for work, It's done) is the quest's, and a sale's yes is the
// chronicle's (Rented the second door…), not a topic.
const T=DATA.T.slice().sort((a,b)=>a.t-b.t);
const QUESTTALK=/^(I.m looking for work\.|It.s done\.)$|\d+ gold\.?$/;   // quest talk, and a sale's yes (Yes. 11 gold.)
const trade=s=>{const e=T.find(x=>x.s===s&&/I.m an? [a-z]+/.test(x.r));return e?e.r.match(/I.m an? ([a-z]+)/)[1]:'';};
const pages=new Map();
T.forEach(e=>{if(QUESTTALK.test(e.l))return;let key,kind,sub;
  if(/^What is this place\?$/.test(e.l)){key=e.r.split(/\.\s/)[0].replace(/\.$/,'');kind='place';sub=`told by ${e.s}`;}
  else{key=e.s;kind='person';sub=trade(e.s);}
  if(!pages.has(key))pages.set(key,{key,kind,sub,town:e.w,first:e.short,items:[]});pages.get(key).items.push(e);});
const SELP='Ruairí';
const pRows=[...pages.values()];
const tLeftA=`<div class="h">Told</div><div class="rule"></div><div class="srch">${ico('i-quill')}search what you were told</div>
  <div class="lh2">DUNMORE · PEOPLE</div>${pRows.filter(p=>p.kind==='person').sort((a,b)=>a.key.localeCompare(b.key)).map(p=>`<div class="ti ${p.key===SELP?'on':''}"><span class="mk">${ico('i-person')}</span><span class="t">${esc(p.key)}${p.sub?` <i>${esc(p.sub)}</i>`:''}</span><span class="n">${p.items.length}</span></div>`).join('')}
  <div class="lh2">DUNMORE · PLACES</div>${pRows.filter(p=>p.kind==='place').map(p=>`<div class="ti"><span class="mk">${ico('i-map')}</span><span class="t">${esc(p.key)} <i>${esc(p.sub)}</i></span><span class="n">${p.items.length}</span></div>`).join('')}`;
function personPage(k){const p=pages.get(k);
  return `<div class="qh">${esc(p.key)}</div><div class="qs">${p.sub?esc(p.sub)+' · ':''}${esc(p.town)} · first met ${esc(dshort(p.first))}</div><div class="rule"></div>`+
   p.items.map(e=>`<div class="ta"><div class="k"><span>${esc(e.l.toUpperCase())}</span><small>${esc(e.short.replace(' Reaping',''))}</small></div><div class="ans">${esc(e.r)}</div></div>`).join('');}
screen('a-told','A — III. Told, by who and where <small>a page a person and a page a place; quest talk stays on the quest\'s page</small>','menu',tome(2,tLeftA,personPage(SELP),'TOLD',SELP.toUpperCase()+' OF DUNMORE',13));

// B: today's filing, by the question asked
const byQ=new Map();T.forEach(e=>{if(!byQ.has(e.l))byQ.set(e.l,[]);byQ.get(e.l).push(e);});
const SELQ2='Who are you?';
const tLeftB=`<div class="h">Told</div><div class="rule"></div><div class="srch">${ico('i-quill')}search what you were told</div><div class="lh2">BY THE QUESTION ASKED</div>`+
  [...byQ.keys()].sort((a,b)=>a.localeCompare(b)).map(l=>`<div class="ti ${l===SELQ2?'on':''}"><span class="mk">${ico('i-speech')}</span><span class="t">${esc(l)}</span><span class="n">${byQ.get(l).length}</span></div>`).join('');
const tRightB=flow([{html:`<div class="qh">${esc(SELQ2)}</div><div class="qs">asked of ${byQ.get(SELQ2).length} people in Dunmore</div><div class="rule"></div>`},
  ...byQ.get(SELQ2).map(e=>({html:`<div class="ta"><div class="k"><span>${esc(e.s.toUpperCase())}</span><small>${esc(e.short.replace(' Reaping',''))}</small></div><div class="ans">${esc(e.r)}</div></div>`}))])[0];
screen('b-told','B — III. Told, by the question asked (as built) <small>the same book; the topics filed under their labels, as journalTold keys them today</small>','menu',tome(2,tLeftB,tRightB,'TOLD','WHO ARE YOU?',13));

// ── IV. due: the month, and what it owes you
const C=DATA.cal;const DAYS=C.days.map(d=>d.name);
const dom=s=>{const m=s.match(/the (\d+)\w\w of/);return m?+m[1]:0;};
const marks={};DATA.D.forEach(d=>{const n=dom(d.day);(marks[n]=marks[n]||[]).push(d);});
const wrote=new Set(L.map(e=>e.day+1));
let grid=DAYS.map(d=>`<div class="hd">${d.replace(/day$/,'').toUpperCase()}</div>`).join('');
for(let n=1;n<=28;n++){const m=marks[n]||[];grid+=`<div class="${n<C.dom?'past':''} ${n===C.dom?'today':''}">${n}${wrote.has(n)?'<span class="dot"></span>':''}${m.map(d=>`<span class="m ${d.feast?'f':''}">${d.feast?'✦':d.icon==='🛏'?'⌂':'◆'}</span>`).join('')}</div>`;}
const feasts=C.feasts.map(f=>{const next=DATA.D.find(d=>d.feast&&d.text.startsWith(f.name));return `<div class="fe ${next?'next':''}"><span style="color:var(--gilt)">✦</span><span class="t">${esc(f.name)}</span><span class="w">${f.dom} ${esc(C.months[f.month]).toUpperCase()}</span></div>`;}).join('');
const dueLeft=`<div class="h">${esc(C.month)}</div><div class="qs" style="margin:2px 0 0">an ${esc(C.season)} month · ${esc(yearLine)}</div><div class="rule"></div>
  <div class="cal">${grid}</div><div class="calk"><span><b>●</b> a day written in</span><span><b>◆</b> a date owed</span><span><b>⌂</b> the room</span><span><b style="color:var(--gilt)">✦</b> a feast</span></div>
  <div class="lh2">THE YEAR'S FEASTS</div>${feasts}`;
const when=dd=>dd<=0?'today':dd===1?'tomorrow':`in ${dd} days`;
const dueRight=`<div class="qh">Due</div><div class="qs">Today is ${esc(DATA.todayDay)}</div><div class="rule"></div>`+
  DATA.D.map(d=>{const m=d.text.match(/^(.+?) — (.+)$/);return `<div class="du"><span class="w">${when(d.dd)}<small>${esc(d.day.replace(/, the /,' ').replace(/ of Reaping/,''))}</small></span><span class="t">${m?`<span class="qt" style="font:14.5px var(--display);color:var(--rubric)">${esc(m[1])}</span><small>${esc(m[2])}</small>`:esc(d.text)}</span></div>`;}).join('');
screen('a-due','A — IV. Due <small>the month as four weeks of seven named days (a weekday keeps its dates), and what the calendar owes you</small>','menu',tome(3,dueLeft,dueRight,'DUE',esc(C.month.toUpperCase()),17));

// ── C: one sheet in the hub, the chronicle newest first, two columns
const tabs=`<div class="tabs"><div class="tab">${ico('i-pack')}Inventory</div><div class="tab">${ico('i-star')}Magic</div><div class="tab">${ico('i-scales')}Attributes</div><div class="tab">${ico('i-quill')}Quests</div><div class="tab on">${ico('i-book')}Journal</div><div class="tab">${ico('i-person')}Character</div><div class="tab">${ico('i-map')}Map</div></div>`;
const days2=new Map();L.forEach(e=>{if(!days2.has(e.day))days2.set(e.day,[]);days2.get(e.day).push(e);});
const colHtml=[...days2.keys()].sort((a,b)=>b-a).map(k=>{const es=days2.get(k);return `<div class="dh"><div class="d">${esc(es[0].date.replace(/, in the .*$/,''))}</div></div>`+es.map(e=>`<div class="je${e.q?' q':''}${e.note?' note':''}"><span class="tm">${esc(e.time)}</span><span class="tx">${e.q?`<span class="qt">${esc(e.qt)}</span>`:''}${linked(e.text)}</span></div>`).join('')+'<div class="gap1"></div>';}).join('');
screen('c-sheet','C — One sheet in the hub <small>the Journal tab on the kit\'s sheet: the four views as sub-tabs, two columns, newest day first</small>','menu',
  `${tabs}<div class="parch sheet"><div class="seal close">✕</div><div class="subtabs"><span class="on">Chronicle</span><span>Quests</span><span>Told</span><span>Due</span></div><div class="rule"></div>
   <div class="wbox">✎ a line of your own — Enter writes it</div><div class="cc" style="column-count:2;column-gap:40px;display:block">${colHtml}</div></div>`);

// ── comparisons
screen('cmp-chronicle','Today beside A — the chronicle','cmp',`<div class="pair"><figure><figcaption>Today <small>By day, on auto/systems</small></figcaption><img src="current-day.png"></figure><figure><figcaption>A, the open book</figcaption><img id="cc-a" src=""></figure></div>`);
screen('cmp-told','Today beside A — what you were told','cmp',`<div class="pair"><figure><figcaption>Today <small>Topics, filed by the question</small></figcaption><img src="current-topics.png"></figure><figure><figcaption>A, a page a person</figcaption><img id="ct-a" src=""></figure></div>`);
window.SCREENS=screens;
})();
</script>
</body>
