<!doctype html><html><head><meta charset="utf-8"><title>Creature prototype: wolves</title>
<style>html,body{margin:0;background:#8fa3b0;overflow:hidden}canvas{display:block}#t{position:absolute;left:0;right:0;font:15px Georgia,serif;color:#fff;text-shadow:0 1px 2px #000;display:flex}#t div{flex:1;text-align:center;padding-top:10px}</style>
<script src="../../../tests/vendor/three.min.js"></script>
<script src="sk.js"></script><script src="wolf.src.js"></script></head><body><div id="t"></div>
<script>
// views: #lineup (old against new, three-quarter), #family (the four wolf kinds), #poses (stand, trot, lunge, side on), #lod
const view=(location.hash||'#lineup').slice(1),W=1280,H=640;
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(W,H);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x9fb4c2);S.fog=new THREE.Fog(0x9fb4c2,8,20);
S.add(new THREE.HemisphereLight(0xdfe8f0,0x5a5040,.75));
const sun=new THREE.DirectionalLight(0xfff0d8,1.05);sun.position.set(3,5,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4});sun.shadow.bias=-.0005;S.add(sun);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshLambertMaterial({color:0x6a7a48}));gr.rotation.x=-Math.PI/2;gr.receiveShadow=true;S.add(gr);
const cam=new THREE.PerspectiveCamera(30,W/H,.05,50);const labels=[];const info={};
const put=(o,x,z,ry)=>{o.position.set(x,0,z);o.rotation.y=ry||0;S.add(o);return o;};
if(view==='lineup'){const k=WOLF_KINDS.Wolf;const o=oldWolf(0x706058,0xddaa44,k.scale);put(o.root,-.55,0,.7);const w=buildWolf('Wolf');wolfPose(w,'stand');put(w.root,.55,0,.7);
  info.oldTris=o.tris;info.newTris=w.tris;labels.push('Today: box wolf ('+o.tris+' triangles, 17 meshes)','Proposed: one skinned mesh ('+w.tris+' triangles, 22 bones)');
  cam.position.set(1.1,1.0,2.6);cam.lookAt(0,.25,0);}
if(view==='family'){const names=Object.keys(WOLF_KINDS);names.forEach((n,i)=>{const w=buildWolf(n);wolfPose(w,'stand');put(w.root,-1.5+i,0,.55);info[n]=w.tris;labels.push(n);});
  cam.position.set(.6,1.15,3.9);cam.lookAt(0,.28,0);}
if(view==='poses'){[['stand',0],['trot',0],['trot',.25],['trot',.5],['lunge',0]].forEach(([p,t],i)=>{const w=buildWolf('Wolf');wolfPose(w,p,t);put(w.root,-1.6+i*.8,0,Math.PI/2);labels.push(p+(p==='trot'?' '+t:''));});
  cam.position.set(0,.55,4.2);cam.lookAt(0,.28,0);}
if(view==='lod'){[1,.5].forEach((q,i)=>{const w=buildWolf('Dire Wolf',q);wolfPose(w,'stand');put(w.root,-.55+i*1.1,0,.7);info['q'+q]=w.tris;labels.push((q<1?'distant copy, half segments':'full detail')+' ('+w.tris+' triangles)');});
  cam.position.set(1.1,1.0,2.7);cam.lookAt(0,.3,0);}
document.getElementById('t').innerHTML=labels.map(l=>'<div>'+l+'</div>').join('');
R.render(S,cam);window.INFO=info;window.READY=true;
</script></body></html>
