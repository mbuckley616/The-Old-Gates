, mature (grey hair, weathered). Five body silhouettes, slim to stocky. A hair-and-beard strip (tied back, braided, short). The hero kit as in OG-005 shown in three ruined-city scenes.", "notes": "Elf, dwarf and half-elf are offered as races; the canon's choice is the four peoples (§2.2), and the Old Blood option is missing. A clearer UI layout than OG-005; both are earlier thinking that the creator should replace with the four peoples. Note §2.2: an Old Blood player's look should be described inconsistently by NPCs.", "drive": "https://drive.google.com/file/d/1yQAWnIp9nGHEXhL59XegH_Z27J4KUZke/view", "thumb": "thumbs/OG-050.jpg"}, {"id": "OG-051", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "NPC sheet E7: diverse roots, shared paths (five named travellers)", "island": "all", "tags": "npcs;named-characters;companions;aurennais;markmen;gatelanders;old-blood;props", "ideas": "Five strong NPC looks, each with portrait, turnaround, still life and scene. Zahra al-Mahdi (Aurennais navigator and gate cartographer): dark brown skin, long curly locs, gold hoop earrings and coin necklace, a navy-and-cream coat, a brass compass and charts. Tavio Rusen (Markman monster hunter and guide): scarred, braided, in furs, with a grey wolf at his side and a horned skull among his trophies. Sister Elidan (Gatelander healer and relic keeper): cream and crimson robes, a gentle older face, candles and a reliquary. Khemrik Voss (Old Blood memory keeper): grey skin with gold marks on the face, white hair, a gold circlet, reaching to a glowing blue sigil wheel on a wall; 'You see ruins. I see unfinished sentences.' Marco di Serra (Aurennais merchant patron): dark beard, a velvet coat, a goblet, ships behind.", "notes": "Fits the direction: warm, painterly, a pleasant world of people. Zahra and Marco fit decision 4 (Arabic and Italian names suit the new fusion; candidates). Khemrik conflicts: he 'interprets' the gates, which the Withdrawal forbids (§3.1, Old Blood may touch but not read), and he has white hair (canon: black). The forbidden reader is close to Varek's own sin, so he could be written as one of the 'awake' (§10a); a candidate, and a question for Michael. Tavio's wolf companion implies an animal-companion system the game does not have.", "drive": "https://drive.google.com/file/d/1tH1cZxrSraAvCV7oR6R0b49WvFOv0GyO/view", "thumb": "thumbs/OG-051.jpg"}, {"id": "OG-052", "cat": "01_Characters_Peoples_NPCs", "rec": "MAYBE", "title": "Armour tiers: ten tiers in three lines (second pass)", "island": "none", "tags": "armour;tiers;heavy;light;robe;progression;headgear", "ideas": "As OG-019, with bolder headgear at the top tiers: horned and finned helms for Mithril and Obsidian, a flame crest for Draconic, great curved horns for Demonic, a crescent-and-halo crown for Cosmic; antlered and haloed hoods on the high robes. The light line is masked and hooded from the second tier, which reads as 'rogue'.", "notes": "Second pass of OG-019. The masks hide the faces in the light and robe rows, and the high tiers lean into dark-lord spikes; OG-019 is the one to keep. Useful for top-tier helm silhouettes.", "drive": "https://drive.google.com/file/d/1rjNTRCOpHukvOKn3sVlV82Az_TFTvy1G/view", "thumb": "thumbs/OG-052.jpg"}, {"id": "OG-053", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Character sheet: Aldwyn, Royal Herald of Ironhaven", "island": "gatelands", "tags": "aldwyn;herald;named-character;costume;props;wrist-sigil;turnaround", "ideas": "Three outfits: the formal herald's robe (crimson, with gold embroidery and a gold wheel-and-compass device on the shoulder), the travelling scholar's (charcoal coat, hood, satchel, belt of instruments), the private study's (cream undertunic, red over-robe, a book). Greying dark wavy hair, a short beard, a lined, thoughtful face; expressions: neutral, thoughtful, concerned, a quiet smile. A herald's brooch (the wheel device), a leather satchel, a sigil tattooed on the inside of his wrist. His things: a tooled journal with the wheel on its cover, rolled maps of the gates, a brass astrolabe, a wax seal (canon: he hands the player a Royal Mage Corps wax seal, Q6). Scenes: at court before a crowned king, in the field sketching a ruin.", "notes": "Crimson and gold matches the Crown (§1.5). He is drawn as a vigorous man of fifty; the canon has him 150+ years in Ironhaven, 'old, physically fragile, and afraid to die', so he should read older and frailer. The wrist sigil 'shared with Varek' would make Aldwyn Old Blood or a reader of the script; the canon does not say, and it fits his 'institution that no longer exists' and the Ald- naming link: a candidate, and a question for Michael. The 'with Varek' panel uses OG-013's off-canon Varek. The quote is invented.", "drive": "https://drive.google.com/file/d/1VCOZTdekNnEL_3zR49W5B-2fVp04OdwA/view", "thumb": "thumbs/OG-053.jpg"}, {"id": "OG-054", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "NPC sheet E11: the unexplained (five strange figures)", "island": "all", "tags": "npcs;strange;wanderers;construct;tree-spirit;merchant;companion;meta;awake", "ideas": "Five strange-but-friendly figures, Morrowind-style. The Clockwork Pilgrim: a brass-faced construct in a wide straw hat and patched robes with a staff and pack, a chronicler who turns up at important moments ('I walk the same roads as you, but not the same time'). The Rooted One: an old talking tree by a forgotten shrine, bluebirds on its branches. The Veiled Merchant: a cream veil over a gold mask, a stall of impossible goods, who 'knows more about the player than they should'. The Gateborn Companion: a calm, frilled, dragon-like creature in red and blue that bonds with a traveller. The Painted Woman: appears in paintings, murals and crowds across the islands with 'different face, same eyes'.", "notes": "Answers §10a's 'strange, not stock' directly, and the world gap it names. The Painted Woman echoes the inconsistent descriptions of an Old Blood player (§2.2) and the Veiled Merchant who knows the player suits 'the awake' (§10a): both candidates. The Gateborn Companion conflicts with §5 (gate-born dragons are antibodies that do not speak or bond) and would need a companion system; a question for Michael. The Clockwork Pilgrim implies constructs, which the canon has not placed. The picture is warm and inviting, the register the 12 Oct style call asks for.", "drive": "https://drive.google.com/file/d/1x_fzmhhFD0IZLA-beBpkSHHsQ55AagVb/view", "thumb": "thumbs/OG-054.jpg"}, {"id": "OG-055", "cat": "01_Characters_Peoples_NPCs", "rec": "NO", "title": "Sheet A: the four peoples, overview (first pass)", "island": "all", "tags": "peoples;overview;emblems;off-canon", "ideas": "An emblem per people at the top of each column: a gold compass star (Gatelanders), a green arrowhead-and-leaf (Markmen), a lilac four-pointed star (Aurennais), a red sigil star (Old Blood). Otherwise nothing the people pages lack.", "notes": "Off-canon for three of four peoples: the Markmen as green-hooded forest scouts and archers (canon: tall, pale, ash-blond, furs, the cold north), the Aurennais as fair, blond, noble scholars in blue (against decision 4), the Old Blood as 'a warrior people' with a big dark-skinned man in furs (canon: short, slight, grey-pale, scattered). The footnote 'Elves and Dwarves are not part of the current canon' is right. Superseded by the people pages OG-048, OG-002, OG-044 and OG-008.", "drive": "https://drive.google.com/file/d/1cC0OEJga3h-Um82NuKQ_xClDJ-8m75xX/view", "thumb": "thumbs/OG-055.jpg"}, {"id": "OG-056", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Sheet: the four peoples, Aurennais page", "island": "aurenne", "tags": "peoples;aurennais;costume;faces;age-range;palette;market;port", "ideas": "Eight everyday Aurennais in pairs (merchant, farmer, traveller, craftsperson, male and female): cream linen under-tunics, a long patterned sash wrapped over one shoulder, wide sash belts in rust red and indigo, head-wraps and hooded shawls, leather sandals with ankle straps. Skin from tan to deep brown, curly, wavy and braided hair, gold hoop earrings and coin necklaces. Clothing panels: shoulder-draped shawls in olive, red and indigo with block-printed borders. Details: a big gold medallion pendant, bead strings, indigo resist-dyed cloth, a tooled leather belt with hanging coins, a satchel. Palette: saffron, ochre, brick red, indigo, olive, sand. Environment: a palm-lined quay with awnings and a lateen-rigged boat, cream plaster town climbing a hill.", "notes": "Matches decision 4 (Mediterranean / North African mix, darker skin, a healthy range) far better than canon's olive-to-brown Norman register; the people-table row should be updated to match. The female craftsperson's bare-midriff gold top reads as costume rather than a working woman; drop it. The board's skyline is Italianate; the Egyptian and Arabic notes of decision 4 are thin here (no domes, no geometric tile).", "drive": "https://drive.google.com/file/d/19IOsa_LS1eqNEOACD_Ud9rKYh3U9TYFk/view", "thumb": "thumbs/OG-056.jpg"}, {"id": "OG-057", "cat": "01_Characters_Peoples_NPCs", "rec": "MAYBE", "title": "Character sheet E1: five named NPCs (Bram, Edna, Corwin, Niamh, Áine)", "island": "gatelands", "tags": "named-npcs;act-i;ashenmoor;carraig-mor;inis-rua;props;portraits", "ideas": "Bram: broad, grey-bearded smith in a leather apron, arms folded at the anvil; props family hammer, tongs, an unfinished gate-iron fitting. Edna: white-haired woman in her sixties in layered red and indigo shawls with a walking stick, herbs drying overhead; props herbal satchel, mortar, dried gatebloom. Corwin: lean, grinning merchant in a blue-and-gold coat, boots up on a crate at the quay; props ledger, maps, foreign coins, a mystery vial. Niamh: plain woman in her forties, long braid, fur-collared grey cloak, staff, the sea cave behind her; props watch token, spyglass, tide chart. Áine: woman in her seventies, braid, woven red-and-blue shawl, two hands on a stick, standing stones behind; props family amulet, woven shawl, carved bone keepsake. Three expression heads each.", "notes": "Earlier pass of OG-069 (same five, same sheet number), which adds turnarounds; keep this one for its prop captions and secrets (Bram turned down a lord's offer in Ironhaven; Edna keeps a relic from a gate; Corwin smuggles; Niamh sees a pattern in travellers; Áine knows more about the Old Blood than she admits). Ages and character notes follow the canon closely (Bram's grandfather's forge, Edna's three gates, Corwin's evasions). Conflict: Niamh and Áine are labelled Markmen, but Carraig Mór and Inis Rua are Irish-coded Gatelands places and their names are Gatelander; treat both as Gatelanders. Corwin labelled Aurennais: canon is silent on his people, so this is a candidate (his name is not Aurennais in register; ask Michael). 'Gatebloom' as a herb name is new; candidate.", "drive": "https://drive.google.com/file/d/1Ll5haWqYaiPLOv8OEK7hKgzylOVyAyLA/view", "thumb": "thumbs/OG-057.jpg"}, {"id": "OG-058", "cat": "02_Creatures_Fauna_Bestiary", "rec": "MAYBE", "title": "Board 15: ports, roads & infrastructure (second pass), with mounts and beasts of burden", "island": "all", "tags": "ports;roads;bridges;ferries;mountain-pass;waystations;mills;lighthouse;watchtower;milestone;mounts;horses;mule;ox;carriages;carts", "ideas": "Three port kinds: Gatelands river port with ferry crossing, Mark fjord port built into cliffs, Aurennais coastal fishing harbour; a domed Aurennais capital port with red-sailed ships. Waystations: inn, stables, coach house, windmill, watermill, lighthouse, watchtower, carved roadstone/milestone (a knotwork-carved stone at the roadside). Mountain pass with timber trestle roads and guard posts in the Mark. Mounts, one per island: Gatelands Horse (grey, versatile), Mark Steed (dark, shaggy-fetlocked, hardy), Aurennais Courser (chestnut, fast and elegant); Draft Horse; Pack Mule; Mountain Ox (yak-like, used in the Mark for logging and highland transport). Vehicles: traveller's cart, covered wagon, merchant carriage, noble coach, military wagon.", "notes": "Filed under creatures but it is board 15; OG-046 (the refined pass, in 03_World_Architecture_Transport) supersedes it and OG-007 is the first pass. Its distinct value here is the mount line-up: one horse breed per island, and the ox as the Mark's beast of burden. \"Solaris Harbor, Aurenneis capital port\" is the generator's name (and spelling). Horses today exist only on coaches; riding is not built.", "drive": "https://drive.google.com/file/d/1tGJLfJ7ipurGXOtFoGyFVYq6eVKkEl_8/view", "thumb": "thumbs/OG-058.jpg"}, {"id": "OG-059", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Sheet: the four peoples, Gatelanders page", "island": "gatelands", "tags": "peoples;gatelanders;costume;crown-guard;faces;palette;materials", "ideas": "Eight everyday Gatelanders: villager with a pitchfork, tradesperson in a long leather apron, traveller/ranger with bow and short cloak, Crown guards in a red-and-gold tabard with a gold sun-cross, kettle helm and spear. Wiry, freckled, red to dark-brown hair, weathered cheeks. Kit: short red shoulder capes held by round brass cloak pins, many belt pouches, laced boots and leg wraps, embroidered hems, headscarves on women, a basket. Material swatches: red wool, brown leather, moss green, sea blue, linen, iron. Palette: earth, stone, red clay, deep green, sea blue, with Crown red and gold for guards and officials.", "notes": "Fits canon §2 (fair to ruddy, freckled, dark or red hair, wiry). Crown red-and-gold matches canon §1.5. The skyline is a grey ashlar town with a bridge; fine. Whole board leans red; in game the countryside folk should carry more of the green, undyed and blue than shown. Pairs with OG-056.", "drive": "https://drive.google.com/file/d/1gJAE8ISVvd57lZMKxEZQjXRUgveyjM2z/view", "thumb": "thumbs/OG-059.jpg"}, {"id": "OG-060", "cat": "03_World_Architecture_Transport", "rec": "MAYBE", "title": "Key frame 5 variant: the gate, low sun", "island": "gatelands", "tags": "key-frame-5;old-gate", "ideas": "Concentric-ring gate in warmer light, standing stone in the foreground.", "notes": "Variant of OG-037.", "drive": "https://drive.google.com/file/d/1zUaFFtaH4Meqz2Lf5gDeimEl6pC3QGvu/view", "thumb": "thumbs/OG-060.jpg"}, {"id": "OG-061", "cat": "03_World_Architecture_Transport", "rec": "KEEP", "title": "Board 13: Aurenne, settlements and life", "island": "aurenne", "tags": "aurenne;settlements;architecture;ports;daily-life;materials;oasis", "ideas": "Terraced domed harbour capital with aqueducts; settlement kinds: coastal town, cliff village, oasis settlement, desert outpost, hillside town (olives, vineyards), island monastery-port. Daily life: spice markets, shaded garden courtyards with fountains, camel caravans. Style: domes and arches, blue glazed tilework, carved stone, lattice screens, courtyards, columns and arcades, banners by house and guild. Buildings: townhouse, merchant house, courtyard home, temple, palace. Materials: limestone, glazed tile, cypress and cedar, linen, bronze and brass, pottery and glass, spices and dyes.", "notes": "Names (Solaris, Talassa, Zahir, Qamar, Al-Nuri, Siraa) follow a North African register; the canon gives Aurenne Norman-French names. \"Royal courts and palaces\" conflicts with the Compact (merchant houses under the Church). Look fits the canon: cream plaster, tiled roofs, arcades, domes, warehouses on every quay.", "drive": "https://drive.google.com/file/d/1Nr0lYVsb9iEMM01rGQFkgWUVFt7ek28v/view", "thumb": "thumbs/OG-061.jpg"}, {"id": "OG-062", "cat": "02_Creatures_Fauna_Bestiary", "rec": "MAYBE", "title": "Bestiary: game monsters grouped by the six old dungeon themes, each with a hall vignette", "island": "none", "tags": "bestiary;gate-monsters;variants;mimic;kobold;slime;golem;cave-troll;skeleton;gargoyle;old-themes", "ideas": "Details not on the other bestiaries: the Mimic shown closed as an ordinary iron-bound chest beside its open form (the tell must be small); the Kobold Thief as a rat-faced, hunched, cloaked creature rather than a small goblin, which separates it from the Goblin at a glance; the Slime splitting into small slimes; a deep Cave Troll with violet fungus growing from its back; a deep Golem of dark stone with blue crystal growths; a deep Slime drawn as a tall jellyfish bell with trailing threads; the ruins Golem built half into a standing wall; a goblin chief with a crested skull helm. Each row ends on a small vignette of a lone figure in that gate's hall.", "notes": "Organised by the old six themes, which §9a replaced with the schools; OG-018 (by school) and OG-073 (by condition) supersede it as layouts. Keep for the individual designs above. A rat-faced kobold departs from the game's current kobold; Michael's call.", "drive": "https://drive.google.com/file/d/1BPeSDXvz5Eh83r_7ia-5M_O751cezqnn/view", "thumb": "thumbs/OG-062.jpg"}, {"id": "OG-063", "cat": "07_Combat_Keyframes", "rec": "MAYBE", "title": "Combat key frame: sword and spell against a skeleton (pass with crossed blades, tighter)", "island": "none", "tags": "combat;key-frame;parry;bind;spell;skeleton;gate-interior;sigils", "ideas": "As OG-045, framed tighter: an X of blades at the centre with a burst of sparks, the spell held in the off hand at the frame edge, a second skeleton advancing with a round shield, ring-and-line glyphs on the piers.", "notes": "Pass of OG-011; near duplicate of OG-045 (slightly better spacing).", "drive": "https://drive.google.com/file/d/1IFvEv0k-_Div8WZ60peTw9km01Rgsqt_/view", "thumb": "thumbs/OG-063.jpg"}, {"id": "OG-064", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Sheet E10: guildmasters and power brokers", "island": "all", "tags": "named-npcs;guilds;mages-guild;fighters-guild;merchant-house;healers;props", "ideas": "Five guild heads, each with turnaround, props and a scene. Lady Corvina Draeth, Aurennais merchant prince: dark skin, cream head-wrap and robe with gold embroidery, gold cuffs; scales, ledgers, seals. Master Haldrin, Gatelander grand artisan: white-bearded, leather and brass, tools and plans. High Archmage Selene: dark hair, midnight-blue robe with gold stars, a floating sigil ring of light over her hand. Ser Jorren Vale, Fighters' Guild: red cape and surcoat over plate, a guild banner with a gold sword; bounty notices. Matriarch Ysara, healers' circle: old woman in a green floral wrap, herbs and remedies, a deer beside her. Each has a hook line (Corvina 'can open doors anywhere for a price'; Jorren 'contracts and protection or a bounty on your head').", "notes": "Names, titles and the healers' circle are the generator's; proposals. Canon puts the Mages' academy in Aurenne, so its head being 'mixed (Markman heritage)' is possible but should be checked; the Fighters' Guild is half Markish in canon, so a Gatelander knight at its head is a choice to make. 'Master of Coin' and 'merchant prince' fit the Compact's houses (canon §1.3). A cross-island healers' circle answerable to no nation fills a gap; candidate. Corvina's look is a strong Aurennais elite under decision 4.", "drive": "https://drive.google.com/file/d/10DIZAWxuBmrfXczhUHDeXt4Ls-OmPfxa/view", "thumb": "thumbs/OG-064.jpg"}, {"id": "OG-065", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Sheet E3: five new faces (townsfolk)", "island": "all", "tags": "named-npcs;townsfolk;old-blood;stablemaster;cartographer;tinker;midwife;veteran;props", "ideas": "Fen Oisín, Gatelander stablemaster: round-faced, cheerful, leather vest, with a bay horse; saddlebags, horseshoes, a lantern. Bronwen, Markman fisher and cartographer: grey-haired woman in a net-draped shawl, charts and a spyglass. Perrin, tinker and scrapsmith: wild hair, round spectacles, brass gears and clockwork birds on his bench. Síle, Old Blood midwife and storykeeper: grey-pale skin, white braided hair, sigil tattoos across face and hands, plum robe, a carved knotwork staff; herbs, a red book, a mortar. Garrick, disabled veteran and gatewarden: scarred, bearded, fur-collared, seated in a wheeled chair on a headland wall with a black wolfhound.", "notes": "Síle is a good Old Blood elder (grey-pale, tattooed); canon puts the tattoos at the wrists, and here they cover face and hands: decide whether the elders wear more. Her white hair is age, not a break with the black-hair rule. Perrin is labelled Aurennais but drawn fair; under decision 4 recolour him. Garrick holds a long gun like a musket: canon has no firearms; give him a crossbow. Bronwen's name is Welsh-register for a Markman; the Mark's names are Anglo (canon §2).", "drive": "https://drive.google.com/file/d/1gwHqEhlw0qnzei8lOrNcbIkzbk0HHQAF/view", "thumb": "thumbs/OG-065.jpg"}, {"id": "OG-066", "cat": "01_Characters_Peoples_NPCs", "rec": "MAYBE", "title": "Sheet: the four peoples, Old Blood page (pass with embedded sigils)", "island": "all", "tags": "peoples;old-blood;costume;faces;eyes;sigils;palette", "ideas": "Sigils drawn as raised, pale lines under the skin of the wrist, the back of the hand and the shoulder blade, branching like veins, rather than ink. Clothing: dark, asymmetric layers over cream undyed linen with a scattered dot embroidery, a single shoulder wrap, a round stone-and-iron amulet on the belt, belts with small hanging charms. Muted palette of bone white, ash, slate, oxblood and a dusk violet. An eye strip (pale grey, silver, ice blue) as a reference for the Cold's greying eyes.", "notes": "Conflicts with canon §2–3 on the body: drawn tall, lean and long-limbed, most with white or silver hair and some violet or black eyes, with 'subtle non-human features', i.e. elvish. Canon is short, slight, grey-pale, black hair, sigils at the wrist; and they are scattered through the three peoples, not 'isolated clans' in the highlands with gothic castles. Keep only the skin, the embedded-sigil treatment (which reads well at game scale and could carry the Cold) and the clothes. Whether the marks are tattoos or under the skin is a question for Michael. Second Old Blood pass alongside OG-067; neither is right.", "drive": "https://drive.google.com/file/d/1usLniUoQSank_hnKpq4M8G5gCtI0NTRl/view", "thumb": "thumbs/OG-066.jpg"}, {"id": "OG-067", "cat": "01_Characters_Peoples_NPCs", "rec": "MAYBE", "title": "Sheet: the four peoples, Old Blood page (pass with tattoos and furs)", "island": "all", "tags": "peoples;old-blood;costume;faces;age-range;stone-circles;palette", "ideas": "Eight Old Blood at work (hunter, herdsman, stoneworker, healer, scholar, clan elder): layered dark wool over undyed linen printed with small scattered marks, fur collars, a round brooch pinning a shoulder cape, belts of pouches and charms, carved bone and stone pendants. Face tattoos as thin lines at the temple and brow. Environment panel: people gathered at a ring of tall standing stones and a ruined tower by a lake, a fire in the middle; a good picture of where the Old Blood keep their tongue.", "notes": "Conflicts with canon §2–3: tall builds, blond and grey hair, blue and green eyes, isolated highland clans. Canon is short, slight, grey-pale, black hair, scattered among the islands and married into them. The black-haired, braided woman (top-right face, 'herdswoman') is the nearest to canon. Earlier or sister pass of OG-066; a corrected Old Blood page is still owed.", "drive": "https://drive.google.com/file/d/1u3L1S-ljRdyUtfpqMztsc9V-is33FJRN/view", "thumb": "thumbs/OG-067.jpg"}, {"id": "OG-068", "cat": "03_World_Architecture_Transport", "rec": "MAYBE", "title": "Sheet 11: the Gatelands (first pass)", "island": "gatelands", "tags": "gatelands;settlements;buildings;motifs;materials;interiors;rural-life", "ideas": "Settlement kinds: small village, market town, river settlement (mills), coastal town, fortified keep, ancient Weaver ruins reclaimed by nature. Typical buildings: cottage, farmhouse, tavern, blacksmith, alchemy shop, trader, temple, guildhall, watchtower. Motifs: rounded arches, knotwork carving, crown banners, nature motifs. Materials: limestone, thatch, slate, timber, wattle and daub, ironwork lanterns. Harbour life, market square, rural life with sheep and cattle.", "notes": "Superseded by OG-070. Calls the Gatelands \"the northern island\"; canon has it south.", "drive": "https://drive.google.com/file/d/1roLZcYtSAeRziQR_cIP66ONQoQyNv6At/view", "thumb": "thumbs/OG-068.jpg"}, {"id": "OG-069", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Character sheet E1 (refined): Bram, Edna, Corwin, Niamh, Áine with turnarounds", "island": "gatelands", "tags": "named-npcs;act-i;ashenmoor;carraig-mor;inis-rua;turnarounds;props;portraits", "ideas": "The same five as OG-057 with front, side and back turnarounds, prop tables and a scene each. Bram: barrel-chested, short dark beard, rolled sleeves, leather apron, arms folded; props hammers, tongs, anvil. Edna: white hair in a bun, a clay pipe, dark green shawl over layers, a stick; satchel, mortar, a hammer, a little bottle. Corwin: dark curls, grin, red-and-gold coat over a waistcoat, tankard in hand; coin purse, compass, strongbox. Niamh: dark wind-blown hair, black hooded cloak with a round brooch, a lantern at the cave mouth; horn, lantern, tide map. Áine: long white braid, deep red wrap with a woven border, two hands on a carved stick; woven blanket, a ringed stone disc, a cup, marigolds. Lines: Bram 'A good tool outlives its maker'; Niamh 'I don't stop what comes through. I remember it.'", "notes": "Supersedes OG-057 for the models (turnarounds); OG-057 keeps its prop captions and secrets. Áine is a Gatelander here (correct). Niamh is still labelled Markman: she is Gatelander (Inis Rua, Irish-coded). Corwin's people is given as 'Aurenne': canon is silent; a candidate for Michael. Bram is drawn younger and dark-bearded where OG-057 has him grey; canon has him at the forge thirty years, so grey fits better. Niamh 'watches the Gate at Inis Rua' fits canon (the Mouth).", "drive": "https://drive.google.com/file/d/14tkDEfbJeqgUQ_NLxQduXgmjtQlR60LN/view", "thumb": "thumbs/OG-069.jpg"}, {"id": "OG-070", "cat": "03_World_Architecture_Transport", "rec": "KEEP", "title": "Board 11: the Gatelands, settlements and life (refined)", "island": "gatelands", "tags": "gatelands;capital;settlements;architecture;motifs;materials", "ideas": "Capital on seven hills where a river meets the sea: harbour, market district, great cathedral, royal keep. Village: whitewashed thatch, field walls, village green. River town with mills; coastal town with a small fort; hill town reusing ancient Weaver stonework. Irish-inspired details: thatched whitewashed cottage, field walls, rounded arches, high crosses with knotwork, slate roofs in towns, harp trade signs, banners (tree, wave, crown). Buildings: cottage, townhouse, merchant house with shop, warehouse. Materials: limestone, granite, thatch, oak/ash/birch, slate, pottery, wool and linen, ironwork, wood carving.", "notes": "Calls the capital \"Crownhaven\"; canon seats the Crown at Coeur de Vie, in pale stone and terracotta.", "drive": "https://drive.google.com/file/d/1uZjGEHCxtu4nwsRmW3dUthq5geubzA5d/view", "thumb": "thumbs/OG-070.jpg"}, {"id": "OG-071", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Sheet E4: five unusual souls", "island": "all", "tags": "named-npcs;strange;old-blood;fool;beastkeeper;collector;ferryman;props", "ideas": "Tomcán, fool and oracle: patchwork jester's coat and hood with bells, a raven on his shoulder, a mask among his props; turns up where he shouldn't and 'speaks to your shadow'. Nell, beastkeeper: curly-haired woman with a huge, gentle tusked beast like a walrus-beaver; she heals what others fear. Elias, collector of forgotten things: goggles, a brass armillary sphere, a coat hung with trinkets and a pack piled high. Branwen, the Rooted One: an Old Blood hermit overgrown with moss, bark and ivy, green-grey skin, a bird on her shoulder, living at the foot of a great tree; feathers, mushrooms and herbs. Orvin, tide poet and ferryman: weathered, pipe, broad hat, a lantern and a heron at his boat.", "notes": "Strong on the 'strange, not stock' line of canon §10a. Branwen's rooted, half-plant Old Blood is a fresh idea, but canon's Cold turns readers grey and cold, not green; decide whether she is a reader gone strange another way, or a Gaoth/Cloch oddity. Elias is labelled Aurennais but drawn pale; recolour under decision 4. Nell's beast is unnamed; a candidate creature. Orvin as a Markman ferryman between islands fits the sea as a road.", "drive": "https://drive.google.com/file/d/1sAWGD7OxBns4OZTWj4WuUNLn7swsp0J6/view", "thumb": "thumbs/OG-071.jpg"}, {"id": "OG-072", "cat": "05_Ships_Maritime", "rec": "KEEP", "title": "Board J2: player ships and progression", "island": "all", "tags": "player-ship;progression;hull-styles;rigs;customisation;cutaway;deck-plans;below-deck;upgrades", "ideas": "Player ship ladder with level bands: fishing boat (starter, 8 to 12 m, crew 1 to 4), coastal sloop (early), merchant cog (mid), brigantine (late), frigate (end, 35 m and up, crew 30 to 60). Hull style by island: Gatelands rounded, sturdy, elegant timberwork; Mark clinker-built and reinforced; Aurenne sleek, lateen-rigged, ornate. Sail options: square, fore-and-aft, lateen, mixed rig. Customisation: hull shape and paint, figureheads, banners and heraldry, wear and repairs, mast and sail sets with regional patterns and furled or reefed states; armaments; functional upgrades (helm, anchor, larger hold, crew quarters, crafting stations). A cutaway of a mid-game cog labelled by deck: upper deck helm, navigation table, crew stations, cannons optional; main deck cargo and companionway; below deck personal room, storage and crafting, bed. Below-deck variants by play style: explorer (simple), trader (storage), adventurer (crafting), captain (luxury). Deck layouts for sloop, cog, brigantine.", "notes": "The progression board; pairs with OG-027 (interiors). 'Cannons (optional)' on the upper deck agrees with Michael's note better than OG-017; the frigate is the natural home for them. The rig and wear options line up with sailing.md's rig bar and the sail tiers already in the game (shipTopSpeed). Class ladder differs from the game's five: a decision.", "drive": "https://drive.google.com/file/d/1-Xrkm1QPlKIpoS2_zR6cwPCaNIbMSNFD/view", "thumb": "thumbs/OG-072.jpg"}, {"id": "OG-073", "cat": "02_Creatures_Fauna_Bestiary", "rec": "KEEP", "title": "Bestiary: gate failure variants, one monster per school at steady, failing and catastrophic", "island": "none", "tags": "bestiary;gate-monsters;gate-condition;steady;failing;catastrophic;antibodies;schools;fire-elemental;slime;golem;wraith;skeleton;gargoyle", "ideas": "Gate condition drawn as three states of one monster: steady (\"familiar forms, coherent\"), failing (\"distorted anatomy, signs of the gate\"), catastrophic (\"unbound, otherworldly\"). Tine: Fire Elemental grows a stone skeleton inside its flame, then becomes a towering fire titan. Uisce: Slime multiplies into a cresting wave of jelly, then a vast spectral water mass. Cloch: Golem doubles into a pair, then an exploded golem with floating plates and blue light in its cracks. Scáth: Wraith spreads more rags and limbs, then a many-armed violet shade. Solas: Skeleton grows extra arms and spines, then a many-armed skeleton with a light halo. Gaoth: Gargoyle grows bigger wings and more limbs, then a storm-wrapped winged thing. The failing column is the useful one: the same model with extra limbs and broken anatomy, which a build can make from one rig.", "notes": "Draws Part I and §9a's \"condition sets the strangeness\". Canon makes the catastrophic case a dragon (§5), one per failure; this sheet proposes a catastrophic form of every monster, which would be a boss tier under the dragon. Decision for Michael. The catastrophic forms glow all over, against the monster rule (familiar silhouette, built wrong, glow only at seams); the failing forms follow it better. The top strip shows the gate itself darkening red then violet; the gate is drawn as a gothic arch, not concentric rings.", "drive": "https://drive.google.com/file/d/1k9sH54ggtAPnIPWiRKJE_jXdCJFskBKm/view", "thumb": "thumbs/OG-073.jpg"}, {"id": "OG-074", "cat": "01_Characters_Peoples_NPCs", "rec": "NO", "title": "Overview: the four peoples, one pair each", "island": "all", "tags": "peoples;overview;gatelanders;markmen;aurennais;old-blood", "ideas": "Only the Aurennais pair is worth a look: blue, white and gold formal dress with a round gold sun-compass brooch, matching the Compact's blue-and-white.", "notes": "An early overview that misses the canon on three of four peoples: Gatelanders and Markmen are near-identical leather-and-green rangers (Markmen should be tall, broad, pale, ash-blond); Aurennais are 'lighter skin tones', against decision 4; Old Blood are 'strong, sturdy', fur-clad, braided and blond. The note 'Elves and dwarves are not part of the current canon' is right. Superseded by the per-people pages (OG-056, OG-059 and the others).", "drive": "https://drive.google.com/file/d/1w7mKXDoIPjflNrzAYC4Da8A5M3Xj4alo/view", "thumb": "thumbs/OG-074.jpg"}, {"id": "OG-075", "cat": "06_Weapons_Magic_Equipment", "rec": "MAYBE", "title": "Board K2: legendary and unique weapons", "island": "all", "tags": "weapons;legendary;relics;quest-rewards;gate-relics;cursed", "ideas": "Five legendary weapons per island in its style (Gatelands: a longsword of the first king, a lightning war axe, a forest wardens' spear, a mace with ever-burning embers, a ranger's longbow; Mark: a great axe, an ice-glacier two-hander, a whaling harpoon that pulls foes, a chain flail, a ritual spear; Aurenne: a duellist's rapier, a meteor-steel scimitar, a composite bow, a tide-blessed crescent blade, a dancer's war fan). Gate relics from before the islands: a greatsword engraved with gate runes, a dagger that drinks sound, a hammer of a vanished mountain-shaping people, a spear said to have opened the first gate, a staff with a ruined civilisation set in it. Where legendaries are found: in ruins, in royal houses, in shipwrecks, behind trials. Each legendary given a distinct silhouette, rich material and a visible magic effect.", "notes": "Details only. Names, owners and stat lines (life steal, bonus vs humans, sanity drain) are invented and MMO-flavoured. 'The Black Compass' is a flintlock pistol: guns in hand are not in the canon or the brief and are a decision for Michael. 'Saint Brigid's Flame' uses a real saint's name. 'Bloodwake ... united the raider clans' puts a king-figure on the Mark. The gate relics touch the Makers and the gates' origin, which canon controls. The cursed row (The Hunger, The Bone Tide) is dark imagery outside the gates.", "drive": "https://drive.google.com/file/d/1TAu7USAdxlzk1iy85brBA9qWHiT6BuCI/view", "thumb": "thumbs/OG-075.jpg"}, {"id": "OG-076", "cat": "07_Combat_Keyframes", "rec": "MAYBE", "title": "Combat key frame: sword and spell against a skeleton (pass with shield on the back)", "island": "none", "tags": "combat;key-frame;parry;spell;skeleton;gate-interior;sigils", "ideas": "As OG-011, darker: the player carries a round shield slung on the back while casting into the skeleton's chest; the ring-and-cross glyph repeated down the hall as a lit sigil door at the far end.", "notes": "Pass of OG-011. The lit ring-and-cross door at the end of the hall is a good sigil-door idea.", "drive": "https://drive.google.com/file/d/1LX-GmP-Eq2Rn_qRIEjtXKA-_Cf08ZtOG/view", "thumb": "thumbs/OG-076.jpg"}, {"id": "OG-077", "cat": "03_World_Architecture_Transport", "rec": "KEEP", "title": "Key frame 2: the Gatelands, with a hare post-rider", "island": "gatelands", "tags": "key-frame-2;landscape;weaver-ruins;creative-licence;fauna;lighthouse", "ideas": "The final key frame 2: a huge Weaver ruin (pillars and arch) on the skyline as the landmark, river town with bridge and church, lighthouse on the coast, sheep in walled fields, autumn trees, and a post rider on a horse-sized hare: the brief's creative-licence seed, made ordinary.", "notes": "Best image of the batch for the brief's tone.", "drive": "https://drive.google.com/file/d/14svktzGxbfUmD11Vj32MWexnpp9Xhw-6/view", "thumb": "thumbs/OG-077.jpg"}, {"id": "OG-078", "cat": "03_World_Architecture_Transport", "rec": "MAYBE", "title": "Key frame 5 variant: the gate, lakeside", "island": "gatelands", "tags": "key-frame-5;old-gate", "ideas": "Concentric-ring gate above a lake, closer framing.", "notes": "Variant of OG-037.", "drive": "https://drive.google.com/file/d/17jtnhqYvNLOVQsbN1AqCZ_6GjQ-td4WK/view", "thumb": "thumbs/OG-078.jpg"}, {"id": "OG-079", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Sheet H1: five legendary figures", "island": "all", "tags": "named-npcs;legends;smuggler;gatewalker;champion;bard;abbot;props", "ideas": "The Salt King, smuggler and folk hero: long dark hair, red and blue sea coat, gold chains, a lantern on a night quay; feeds starving villages and runs blockades. Sister Cairde, the Gatewalker: hooded cream robe spattered with red, satchel and candles; has been through more gates than anyone and came back changed; her scene has her at a lit ring-gate. Red Finn, the cursed champion: red-bearded, bare-chested and tattooed, fur over one shoulder, a greatsword; undefeated in the arenas, changed after a massacre on the Blackshore isle. The Hollow Bard: gold half-mask, feathered hat, a lute; trades stories for stories. The Wretched Abbot: shaven, gaunt, a thorn circlet, white and gold vestments with chains; led an order that tried to preserve the gates and broke something.", "notes": "Names, the Blackshore isle and the arenas are the generator's; proposals. The Salt King fits canon's piracy as the Mark's undeclared war and the Compact's tithe-ships as prey. The Wretched Abbot echoes the Church of the Weaver blessing the dead into the gates without knowing the price (canon §3.1); a candidate for an awake character. Red Finn is labelled Markman with red hair: Markmen are ash-blond in canon. Sister Cairde is labelled Aurennais but drawn fair with an Irish name; recolour under decision 4 or make her a Gatelander. Her scene's ring-gate is a useful nod to the V1 rings.", "drive": "https://drive.google.com/file/d/1UScS6lCE3CdfivFjipRNv2xxvyJx2T29/view", "thumb": "thumbs/OG-079.jpg"}, {"id": "OG-080", "cat": "01_Characters_Peoples_NPCs", "rec": "MAYBE", "title": "Sheet E1 (alternate): five new faces, townsfolk", "island": "all", "tags": "named-npcs;townsfolk;ferryman;apothecary;priest;arena;mapmaker;props", "ideas": "Tomas, ferrymaster and boatwright: big, red-bearded, laughing, tankard in hand, rope and a lantern; rowing boat, oars, lantern among his props. A forager-apothecary: dark curls under a red headscarf, green shawl, an armful of wildflowers; basket, bottles, mortar, scissors. Father Eamon, itinerant priest: grey beard, red-and-cream vestments, a tall brass crook topped with a ring; a book with a cross-and-circle cover, a censer. Jora, arena trainer: dark-skinned woman with long locs pulled back, sleeveless leather and arm wraps; staves, a round shield, training gear. Rivel, mapmaker and chronicler: young, round spectacles, scarf, ink-stained, with rolled charts and an astrolabe.", "notes": "Earlier pass of OG-089 (same five), which dresses Jora as a Markman. Keep this one for Jora as a dark-skinned, locs-wearing trainer, a good Aurennais or port-town look. The forager is named Sera, which canon already gives to Ashenmoor's guard; rename. 'Sheet E1' repeats the label of OG-057/OG-069, a generator slip. Jora is labelled 'The Mark' and drawn dark-skinned: Markmen are tall, pale, ash-blond, though canon §1.5 allows a mixed crowd in a port; make her Aurennais or note her as a port-born mix. Rivel and the forager are labelled Aurenne but drawn fair; recolour under decision 4. Arenas are not in canon; a candidate (it also appears in OG-079). The priest's crook and ring icon could carry the Church of the Weaver; ask which church he serves.", "drive": "https://drive.google.com/file/d/1HR4NdxrWvG85d7wiintmcNPSEqCSl5EW/view", "thumb": "thumbs/OG-080.jpg"}, {"id": "OG-081", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Sheet E13: children and young people", "island": "all", "tags": "named-npcs;children;street-kids;old-blood;apprentice;noble;props", "ideas": "Lirien of Saltsong, harbour urchin: dark-skinned Aurennais girl with braided hair, red scarf, gold earrings, spyglass and shells; knows every smugglers' landing. Tomas Ironvein, would-be knight: freckled red-haired Gatelander boy with a wooden practice sword and a too-big helmet. Naya of the Embers, gifted apprentice: Old Blood girl with sigil marks on her face, sigil rings of light spinning over her hands, at the Mages' Guild. Bellen and Kiri, sibling scavengers: two grinning boys and a scruffy dog, a bag of salvage. Sera Valeth, the reluctant heir: noble girl in a cream and blue gown with gold embroidery who slips out to see the city. Each with turnarounds and props at child scale.", "notes": "Fills a real gap: the towns have few children (only Finn in Ashenmoor). Naya is Old Blood with white hair and pale violet light; canon gives black hair. Her 'sensitivity to Gate-born magic' fits canon §3.3 (warm stones felt at a distance) and the Withdrawal's ban on reading; a candidate for a quest about a child who reads. Sera Valeth collides with canon's Sera; rename. 'House Valeth' as a Gatelands noble house is a candidate; check against the Crown's lords.", "drive": "https://drive.google.com/file/d/1keL8ReI1Z926Lyf6FJBrw-mRqTjC3fKL/view", "thumb": "thumbs/OG-081.jpg"}, {"id": "OG-082", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Sheet E2: five new faces, townsfolk", "island": "all", "tags": "named-npcs;townsfolk;innkeeper;gravekeeper;shipwright;priest;herbalist;props", "ideas": "Mairead, innkeeper and storyteller: stout, laughing, red-cheeked, shawl and apron, a pewter tankard; runs the Salt and Lantern. Darragh, gravekeeper and stonemason: hooded, white-bearded, a carved cross-stone behind him, chisels and a lantern; reads old carvings. Iliana, shipwright and salvager: strong, tattooed forearms, red headscarf, adze and plane, a hull on the stocks behind her. Brother Caelen, sceptic priest: young, dark-haired, black hooded habit over white, a book and chalice; 'Faith isn't certainty.' Lyra, herbalist and hunter: red-haired woman in a green hooded cloak with a bow, a basket of purple flowers, a deer in her scene.", "notes": "The Salt and Lantern is placed 'at the Ashenmoor pier'; Ashenmoor in canon is a farming village, not a port, so move it (Salthaven fits the name). Iliana works 'the Ironhaven docks': check that Ironhaven has a harbour. Darragh (Irish name) and Lyra are labelled Markmen; canon's Markish names are Anglo and their look ash-blond. Brother Caelen is labelled Aurenne and drawn fair; recolour under decision 4. A gravekeeper who reads carvings is a natural lead to the Clearing (canon §3.1).", "drive": "https://drive.google.com/file/d/191M4CtrkC9VAO64IXXrcS360CZqhoqA3/view", "thumb": "thumbs/OG-082.jpg"}, {"id": "OG-083", "cat": "01_Characters_Peoples_NPCs", "rec": "MAYBE", "title": "Sheet E9: rival adventurers and guilds", "island": "all", "tags": "named-npcs;adventurers;rivals;old-blood;knight;explorer;companion-animal;props", "ideas": "Koran Stonehand, mountain guide and gate-clearer: bearded, fur and heavy leather in snow, a pick, a mountain banner. Lyn Étrël, explorer and antiquities broker: dark-skinned Aurennais woman with locs, cream and blue explorer's coat, rolled maps and an orrery. A Gatelander scout with a big grey wolf companion. Sir Alaric Drake, fallen knight: blond, red cloak and surcoat with a gold lion, a great helm. Zurik the Seventh, Old Blood seeker: cracked grey stone-like skin, white hair, black robe with gold stars, a brass armillary. Rival adventurers with hooks (a high-risk expedition, a guide for hire, a rival for glory) is a good idea for gate-clearers in the world.", "notes": "Names the scout 'Varek' (Varek & Moss): the villain's name is reserved, so this must be renamed. Zurik's cracked, statue-like skin and white hair push the Old Blood toward non-human; canon is grey-pale, black-haired, human. Koran is labelled Markman and drawn dark-skinned and short-haired; Markmen are pale and ash-blond. Lyn Étrël is a strong Aurennais under decision 4, though the diaeresis name has the dropped Norman-French ring. Rival adventurers fill a gap (the salvage economy of canon §1.1); candidate.", "drive": "https://drive.google.com/file/d/1-A_KTcMH9gvgL771JQeLoSrL-WtONmll/view", "thumb": "thumbs/OG-083.jpg"}, {"id": "OG-084", "cat": "02_Creatures_Fauna_Bestiary", "rec": "KEEP", "title": "Field guide: fauna of the three islands, 45 island species, common species, and marine life", "island": "all", "tags": "fauna;wildlife;field-guide;marine;sea-life;whale;dolphin;octopus;eel;jellyfish;ray;leviathan;fish;birds;common-species", "ideas": "The one-page roster across all three islands and the sea. Markish Highlands: Stone Goat, Snow Hare, Ironwolf, Crag Bear, Sky Eagle, Peak Ibex, Frost Lynx, Mountain Ptarmigan, Glacial Marmot, Ridge Stag, Alpine Salamander, Stonecrawler, Highcliff Falcon, Blizzard Fox, Rock Trout. Central Gatelands: Gatefen Boar, Redspine Fox, Eldertree Deer, River Otter, Great Heron, Woodland Badger, Greenward Stoat, Hollowcat, Barred Owl, Thicket Boar, Grove Turkey, Tree Runner (a small songbird), Marsh Frog, Painted Turtle, Common Carp. Aurennais Coast: Saltskim Seal, Sand Gazelle, Dune Cat, Cliffhawk, Coastal Ibex, Sea Goat, Sunshell Tortoise, Marsh Heron, Oasis Hare, Striped Hyena, Sand Skink, Carmine Kingfisher, Coastal Crab, Duneswift, Reef Lizard. All islands: wolf, red fox, brown hare, raven, crow, wild boar, deer, badger, otter, trout: the shared base set that can be built once and recoloured. Marine life: harbour seal, grey dolphin, Storm Whale, sailfin ray, Drifter Jelly (glowing), giant octopus, tidecrab, reef moray, Lantern Fish (glowing, deep), Gate Eel (dark, with a glowing line along its length), coastal tuna, swordfish, shellfish, sea turtle, coral stalk. Gate Leviathan: a colossal whale-shaped thing seen past a sunken wreck, glowing seams down its body, \"said to follow the currents between worlds\" (a rare sea encounter or sighting).", "notes": "Overview companion to the island sheets OG-009, OG-031, OG-030 (which carry the detail and more of the strange names); this one adds the marine life the game is thin on (it has fish, gulls, dolphins, whales and sharks) and the shared common set. The Gate Leviathan and Gate Eel fit the antibody canon only if they come from a gate in the sea (the Mouth, the Vault of the Tide): a sea gate's antibodies, glowing at the seams. \"Between worlds\" is the generator's phrase and not canon. Some species repeat across islands with new names (ibex, goat, stag, falcon); pick one name per animal.", "drive": "https://drive.google.com/file/d/1NfllvjNz4FgPwcnZN48O-M3LISswa5cj/view", "thumb": "thumbs/OG-084.jpg"}, {"id": "OG-085", "cat": "01_Characters_Peoples_NPCs", "rec": "MAYBE", "title": "Bestiary: familiar, corrupted and gate beings (first pass)", "island": "all", "tags": "bestiary;creatures;corrupted;gate-beings;silhouettes;antibodies", "ideas": "Three rows. Familiar: wolf, bear, stag, boar, a raptor bird, giant spider, scorpion, troll, goblin with spear, skeleton with round shield, wraith. Corrupted: the same animals with glowing seams, crystal growths and violet light (corrupted wolf, bear, deer, rot boar, shadow raptor, blood scorpion, fallen troll, goblin shaman, bone wraith). Gate beings: the Gate Warden (a tall armoured figure with a halo-ring), Realm Hound, Void Serpent, the Watcher (a floating eye in a cage of tendrils), Ashen Colossus, the Hollow (a thin figure in a halo), Dread Matron, Obelisk Guardian (crystal plates), the Maw (a ringed toothed worm). A strip of element orbs (violet, green, blue, orange) as variants.", "notes": "Earlier pass of OG-088, which is clearer. Every corrupted creature is the same violet glow; canon §9a has each gate's antibodies take its school's shape, so the glow should follow the school (Tine ember, Uisce frost, Cloch crystal and stone, and so on). Glowing seams match the Faolchú of a sudden failure (canon, Act I). The hero gate at the top is a tall pointed arch, not the concentric rings of decision 2. Belongs to the creatures folder in spirit.", "drive": "https://drive.google.com/file/d/1TqMPeoNMetm_IRLl6AvW8wMy7FR9hmfX/view", "thumb": "thumbs/OG-085.jpg"}, {"id": "OG-086", "cat": "01_Characters_Peoples_NPCs", "rec": "NO", "title": "Character study: Varek (dark-lord pass)", "island": "none", "tags": "varek;villain;turnaround;sigils;props", "ideas": "Little to take. The props only: a stack of worn notebooks with a sigil on the cover, loose pages of hand-drawn sigil diagrams, a brass armillary instrument, a metal stylus. The 'hand and sigils' detail (fine marks across the back of the hand) could serve the Old Blood wrist script.", "notes": "Contradicts the canon on almost every line. Varek is short, slight, grey-pale, black-haired, grey-eyed, in plain dark charcoal clothes, and never a dark lord; here he is tall, gaunt, bald, with a scarred scalp, in a tattered floating robe, levitating before a glowing portal, with Vader, Voldemort, Dagoth Ur and Thanos as the stated mood. That is the reading canon §10a rules out ('faces, town layouts and Varek stay familiar'). The portal behind him is a pointed arch, not the V1 rings. The same figure reappears in OG-092's 'With Varek' panel. A new Varek sheet is owed.", "drive": "https://drive.google.com/file/d/1RcNrfv2Hx_e6RvGHH9Xy8FQsO1PhOjCU/view", "thumb": "thumbs/OG-086.jpg"}, {"id": "OG-087", "cat": "01_Characters_Peoples_NPCs", "rec": "MAYBE", "title": "Sheet: the four peoples, Gatelanders page (first pass)", "island": "gatelands", "tags": "peoples;gatelanders;costume;faces;palette;adventurer", "ideas": "Six Gatelanders (adventurer/ranger, soldier/guard, craftsman/tradesperson, male and female) in brown leather and a deep blue wool. Head variations with headbands and braids. Details: a round blue shield painted with a gold tree, a blue hood with a gold-stitched border, buckled boots, belts of pouches. Culture panel: a river town of grey stone and timber with boats at a quay.", "notes": "Earlier pass of OG-059, which is closer to the canon (freckled, wiry, Crown red-and-gold on the guards). Here the guards wear blue rather than the Crown's crimson and gold (canon §1.5), and 'strong, sturdy build' is against canon's wiry Gatelanders. The tree emblem recurs on OG-095; it has no place in canon yet.", "drive": "https://drive.google.com/file/d/13mYX1-M2dWThfa1E8BkCNEyDOxTY-s5J/view", "thumb": "thumbs/OG-087.jpg"}, {"id": "OG-088", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Bestiary: creatures of the Gatelands (familiar, corrupted, gate-born)", "island": "gatelands", "tags": "bestiary;creatures;corrupted;gate-born;silhouettes;antibodies;schools", "ideas": "Seven per row, each with a head study and a silhouette. Familiar: wolf, boar, red deer, grizzly, giant eagle, a mossy river troll, giant spider. Corrupted, each a clear shape change rather than a recolour: corrupted wolf with glowing seams, blight boar with crystal spikes in its hide, stag of shadows whose antlers breathe a mist, frost wraith bear of blue ice, dusk eagle with draining violet feathers, stone troll fused with rock, void spider. Gate-born: gate worm (a ringed toothed maw), sky leviathan (a winged ribbed skeleton-fish), shattered colossus (floating stone fragments held as a body), the Hollow (a thin figure under a halo-ring), Bridgeshaper (a tangle of limbs that bends distance), the Echo (a cloud of eyes and voices), the Ascended (a radiant crystal figure).", "notes": "Supersedes OG-085. The corrupted row maps well onto canon §9a's schools: frost bear for Uisce, crystal boar and stone troll for Cloch, stag of shadows for Scáth, dusk eagle and sky leviathan for Gaoth; propose tagging each with its school. 'Corrupted by Gate energy' should read as the gate's antibodies (Part I, the central mystery). 'Feeds on mana' and the Ascended as 'the original inhabitants' contradict the canon (the Weavers made the gates; there is no mana); drop those lines. The silhouettes are directly useful for the creature kit (34-creatures.js).", "drive": "https://drive.google.com/file/d/1ibevc_SuFz3yuB-x2VTbeZi2CUavYfHU/view", "thumb": "thumbs/OG-088.jpg"}, {"id": "OG-089", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Sheet E1 (refined alternate): five new faces, townsfolk", "island": "all", "tags": "named-npcs;townsfolk;ferryman;apothecary;priest;arena;mapmaker;props", "ideas": "The same five as OG-080 with a cleaner hand. Tomas, laughing red-bearded ferrymaster with a tankard, boat, oars and lantern. A forager-apothecary in a red headscarf and green shawl with wildflowers. Father Eamon, grey-bearded itinerant priest in red and cream with a tall brass ringed crook, a book and censer. Jora, now a Markman arena trainer in a big fur mantle, braided hair, a round red shield with a white cross-ring, training staves; 'runs the training grounds in a Markish coastal town'. Rivel, bespectacled young mapmaker in a cream coat with rolled charts and an astrolabe.", "notes": "Supersedes OG-080 (Jora is now dressed and placed as a Markman, closer to canon). Still owed: the forager is named Sera, which canon gives Ashenmoor's guard; Rivel and the forager are labelled Aurenne but drawn fair (decision 4); Jora's dark braided hair against canon's ash-blond Markmen. Training grounds or arenas in the Mark fit its duels and mercenary trade (canon §1.2); candidate.", "drive": "https://drive.google.com/file/d/1229dTERf7nTVu6y6ovr499B_EBWqTNU-/view", "thumb": "thumbs/OG-089.jpg"}, {"id": "OG-090", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Sheet E12: families, feuds and dynasties", "island": "all", "tags": "factions;noble-houses;clans;old-blood;smugglers;aurennais;markmen;props", "ideas": "House Velasco, Aurennais nobility: a dark-skinned woman in white with gold and teal embroidery, gold jewellery, a domed city with palms behind; family turnaround of all ages; ledgers, an astrolabe, a blue house banner. The Ironmere Clan, Markish: red-bearded men in heavy furs, an axe, a blue banner, a fire on a rocky shore; holds passes, mines and shipyards, with a blood feud with a neighbouring clan. The Caelmont House, Gatelander landed family: plate under a blue cloak with a gold lion, a plumed helm, a sealed letter; keeps roads and harvests for the Crown. The Sorrowvale Lines, Old Blood heritage 'scattered among the islands': pale, white-haired, dark robes; keep artefacts and fragments. The Redmarsh Syndicate: smugglers in red sashes and headscarves among ships and lanterns.", "notes": "Fills a gap: the canon has nations but few named families. Velasco's look and city fit decision 4 well (domes, palms, darker skin). The Sorrowvale Old Blood are again white-haired (canon: black hair) but correctly scattered among the islands. Ironmere's feud fits the Mark (duels, no king), but a 'truce with the Crown' needs checking against the cold peace of canon §1.4. Caelmont wears blue and a gold lion; the Crown's colours are crimson and gold. All names are proposals; a Spanish-register Velasco suits the dropped Norman naming.", "drive": "https://drive.google.com/file/d/13doch_WE3lWcpUF5AAVIP0MsryM6ZD88/view", "thumb": "thumbs/OG-090.jpg"}, {"id": "OG-091", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Sheet E8: faith, cults and prophets", "island": "all", "tags": "named-npcs;faith;church;cults;inquisitor;oracle;old-blood;props", "ideas": "Mother Amani, the Lantern of Ash: dark-skinned Aurennais priestess in a white head-cloth and white, blue and gold robes, a tall staff topped with a caged lantern; tends the sick and reads the gates as passage and renewal. Brother Alain, the Iron Sermon: hooded inquisitor in white with a red cross, who hunts unlicensed gate exploration. Shevra the Drowned, tide oracle: wild braids, salt-crusted robes hung with shells, a staff of driftwood, bones and a lantern; reads storms for fishers and smugglers. Father Calix, the Smiling Lamb: a radiant, open-armed cult leader with a sunburst halo, masks among his props; preaches the gates as transcendence through sacrifice. The Veiled Child: a slight grey figure under a white veil, tending abandoned shrines at the gate sites.", "notes": "The Church of the Weaver is Aurennais in canon and calls gate salvage sacrilege (canon §1.3); Brother Alain's hunt for 'unauthorized exploration' fits it, but he is labelled Gatelander: make him Aurennais or a Gatelander convert. A Markish shaman sits against the Mark's scorn of priests (canon §1.2): a tide-reader rather than a priest would fit. Father Calix's sacrifice cult edges into the grim; keep him as one of the awake or a villain, never the surface tone. The Veiled Child is Old Blood with white hair and glowing eyes; canon is black-haired and human. Mother Amani is the strongest Aurennais priest look so far.", "drive": "https://drive.google.com/file/d/1tjxMPXH7_F2WR95wSraqXq-4o6nwL1jU/view", "thumb": "thumbs/OG-091.jpg"}, {"id": "OG-092", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Character study: Aldwyn, Royal Herald of Ironhaven", "island": "gatelands", "tags": "aldwyn;named-npcs;act-i;ironhaven;turnaround;clothing-layers;props", "ideas": "A lean man of middle years, long dark hair going grey, short beard, tired eyes. Long dark layered robe and scarf over a belted tunic, a satchel, a ring-clasp at the chest, a book always under his arm. Clothing layers as three states: base (shirt and trousers), travel (hooded robe), herald formal (with a long embroidered stole). Four expressions: neutral, thoughtful, concerned, quiet smile. Props: a leather journal with a sigil on the cover, rolled maps of the gates, brass measuring instruments, a hand-drawn map. Line: 'Some things are older than kingdoms. Our work is to remember them.'", "notes": "Good fit for canon's scholar-mage hiding as a herald. Two flags. A wrist sigil is drawn and captioned 'shared with Varek'; wrist script is the Old Blood mark (canon §2), so this would make Aldwyn Old Blood or a reader who took the mark; that is a story decision for Michael, not a costume note. His 'herald formal' dress has no Crown crimson and gold; a public herald should wear the Crown's colours over the scholar's robe. The 'With Varek' panel uses the dark-lord Varek of OG-086; ignore it.", "drive": "https://drive.google.com/file/d/18e0Jq5KULnuM_RWWwd0HoaaTt8n4vSWY/view", "thumb": "thumbs/OG-092.jpg"}, {"id": "OG-093", "cat": "05_Ships_Maritime", "rec": "KEEP", "title": "Board J5: maritime professions and factions", "island": "all", "tags": "sailors;crew;factions;port-life;professions;costume;maritime-gear;morale", "ideas": "Sailors in each island's dress: Gatelands green coats and tricorn officers; Mark furs, leather and fur-trimmed raiders; Aurenne blue and white, sashes, turbans and headwraps (the Mediterranean and North African register). Hireable crew roles with portraits: captain, first mate, navigator, boatswain, gunner, carpenter (repairs), cook (food and morale), medic, naturalist, mage (arcane support), quartermaster. Crew morale from food, pay, safe voyages, victories, comfortable quarters, leadership, success. Port trades: shipwrights, dock workers, tavern keepers (rumours, crew, contracts), quartermasters, brokers, bounty hunters, ship chandlers, black market. Gear: cutlasses, boarding axes, harpoons, spears, navigation tools, telescope (high tier), charts, rope and rigging, sailcloth; light artillery marked high tier. A busy port market scene.", "notes": "Artillery and the telescope marked high tier agrees with Michael's cannon note. Factions conflict with canon: 'Gatelands Merchants' League' (merchant houses are Aurenne's Compact), 'Mark War Fleets: clans and jarls' (the Captains' League, no king), 'Aurenne Imperial Fleet' (no empire). 'Aurenne Trade Consortium' is the Compact by another name: lean in. Salvagers and Wreckers fit the Gatelands' salvage economy; Explorers' and Navigators' Guilds fill a gap. The skull-and-crossbones pirate flag needs a world-own mark. The carpenter crew role fits sailing.md's Joinery repairs.", "drive": "https://drive.google.com/file/d/1yCt-SqsB-mM1dyrAPjNxxqRhz3F3A6B7/view", "thumb": "thumbs/OG-093.jpg"}, {"id": "OG-094", "cat": "06_Weapons_Magic_Equipment", "rec": "MAYBE", "title": "Board K3: magical implements by school", "island": "all", "tags": "magic;schools;staffs;wands;tomes;foci;implements;school-icons;culture", "ideas": "One school per column with an emblem, a colour and four implements: Uisce blue with a crescent moon (tidecaller staff, moonpearl wand, stormglass orb, tome); Cloch brown with a mountain (stoneheart maul, runebound staff, geomancer's foci cubes, tome); Scáth purple with an eye (nightweave staff, veil dagger, umbral lens orb, tome); Solas gold with a sun (sunspire staff, dawnshard wand, beacon sigil, tome); Gaoth grey with a spiral (skyrunner staff, zephyr wand, gale ring, tome). Implement types: staffs, wands, tomes, orbs and foci, ritual pieces (astrolabe, chalice, hourglass), off-hand hybrids (rings, gauntlets, lantern). Notable objects: a gate compass that reveals gates, a quill that replays memories, a chalice that makes water, a stormwhistle used by Aurenne navigators to call wind, a black mirror, a self-writing book. Cultural styles: Gatelands wood, bone and leather; Mark stone, iron and weathered; Aurenne fine metal and carving. Magic in daily life: healing, navigating by stars, lighting homes and ports.", "notes": "Tine is drawn as life and nature (green leaf, druids, healers): wrong. Tine is fire; this board's Solas takes 'fire' too. Its Tine column (rootwarden staff, briar wand, hearthbloom) cannot be used, and the six-school icon set needs Tine redone as fire before it is kept. The game has only the wooden staff; wands, foci and tomes are new item lines for Michael. The stormwhistle ties Gaoth to sailing. 'The Weaver's Loom' as an ancient device touches the Church of the Weaver's canon.", "drive": "https://drive.google.com/file/d/1k_PI94aVRLAYdxJnkshbBr41AyGk9obj/view", "thumb": "thumbs/OG-094.jpg"}, {"id": "OG-095", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Character proportions: hybrid (the adventurer)", "island": "none", "tags": "proportions;player;adventurer;turnaround;silhouettes;scale", "ideas": "A proportion target for people: heroic-hybrid, about 1.80 m, slightly longer legs and broader shoulders than naturalistic, so silhouettes read at distance and in close combat. The adventurer: brown scale-and-leather armour, a deep teal hooded half-cape, belts of pouches, a sword on the back and a round shield, laced greaves. Silhouette variants with shield, two-handed and cloaked. An in-game scale figure beside the render.", "notes": "'Hybrid' implies there were naturalistic and stylised options in other images; which proportions the people rig (32-people.js, 17 bones) follows is a decision for Michael. Applies to the peoples' differences too: canon's short, slight Old Blood and tall, broad Markmen need room either side of 1.80 m. The gold tree emblem on cloak and shield (also OG-087) has no canon meaning yet.", "drive": "https://drive.google.com/file/d/1wAhIzsiiNORNIyukfZX2R9jTt-56W53i/view", "thumb": "thumbs/OG-095.jpg"}, {"id": "OG-096", "cat": "03_World_Architecture_Transport", "rec": "KEEP", "title": "Visual style exploration: four directions", "island": "all", "tags": "style;palette;architecture;characters;creatures;subtext", "ideas": "Four style directions: A luminous and painterly, B atmospheric and epic, C seasonal and textured, D mystical and unsettling. Architecture: familiar human buildings against the alien geometry of the Weavers. Creatures: \"familiar anatomy with a single impossible element\". Vignettes that carry the subtext: a Weaver gate \"ancient, purposeful and slightly wrong\"; \"A watchful moment: not every monster is hunting\"; \"A quiet detail: the carving of an adventurer, the carvers turned away\". Keywords: stylised 3D (not low-poly), readable silhouettes, rich natural colour, simple intentional geometry, atmospheric lighting, subtle unease.", "notes": "Raises a decision: which of A to D is the game's base look.", "drive": "https://drive.google.com/file/d/1ECCwioEM1SnncVuDBfuA_xzMMIF_FPV3/view", "thumb": "thumbs/OG-096.jpg"}]</script>
<script>
(function(){
const ITEMS=JSON.parse(document.getElementById('data').textContent);
const CATS={"01_Characters_Peoples_NPCs":"Characters","02_Creatures_Fauna_Bestiary":"Creatures","03_World_Architecture_Transport":"World","04_Flora_Alchemy_Survival":"Flora","05_Ships_Maritime":"Ships","06_Weapons_Magic_Equipment":"Weapons","07_Combat_Keyframes":"Combat","99_Other_Reference":"Other"};
const reviews={}; let db=null, canWrite=false, cat='all', st='all';
const $=id=>document.getElementById(id);
function statusOf(it){return (reviews[it.id]&&reviews[it.id].status)||'UNREVIEWED'}
function tally(){const c={KEEP:0,MAYBE:0,NO:0,UNREVIEWED:0};ITEMS.forEach(it=>c[statusOf(it)]++);
  $('tally').innerHTML='';[['u','UNREVIEWED','to review'],['k','KEEP','keep'],['m','MAYBE','maybe'],['n','NO','no']].forEach(([cls,k,l])=>{const d=document.createElement('div');d.className=cls;d.innerHTML='<b></b> <span></span>';d.querySelector('b').textContent=c[k];d.querySelector('span').textContent=l;$('tally').appendChild(d)});return c}
function chips(el,opts,cur,set){el.innerHTML='';opts.forEach(([v,l])=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.setAttribute('aria-pressed',String(v===cur));b.onclick=()=>{set(v);render()};el.appendChild(b)})}
const cards={};
function build(){ITEMS.forEach(it=>{const c=document.createElement('article');c.className='card';c.id='c-'+it.id;
  c.innerHTML=`<img class="thumb" loading="lazy" alt=""><div class="body"><div class="meta"><span class="id"></span><span class="rec"></span><span class="chip isl"></span><span class="chip cat"></span></div><p class="title"></p><div class="verdict"><button type="button" data-v="KEEP">Keep</button><button type="button" data-v="MAYBE">Maybe</button><button type="button" data-v="NO">No</button></div><details><summary>What's in it</summary><h4>Ideas to keep</h4><p class="ideas"></p><h4>Notes</h4><p class="notes"></p><h4>Tags</h4><p class="tags"></p><p><a class="orig" target="_blank" rel="noopener">Open the original in Drive</a></p></details><label class="note" for="n-${it.id}">Your note</label><textarea id="n-${it.id}" rows="1" placeholder="Optional: what to take, what to change"></textarea><div class="saved" aria-live="polite"></div></div>`;
  const img=c.querySelector('img');img.src=it.thumb;img.alt=it.id+': '+it.title;
  c.querySelector('.id').textContent=it.id;const r=c.querySelector('.rec');r.textContent='Claude: '+it.rec.toLowerCase();r.classList.add(it.rec);
  c.querySelector('.isl').textContent=it.island||'—';c.querySelector('.cat').textContent=CATS[it.cat]||it.cat;
  c.querySelector('.title').textContent=it.title;c.querySelector('.ideas').textContent=it.ideas||'—';c.querySelector('.notes').textContent=it.notes||'—';c.querySelector('.tags').textContent=(it.tags||'').split(';').join(' · ');
  c.querySelector('.orig').href=it.drive;
  c.querySelectorAll('.verdict button').forEach(b=>b.onclick=()=>save(it.id,{status:b.dataset.v}));
  const ta=c.querySelector('textarea');ta.addEventListener('change',()=>save(it.id,{note:ta.value.trim()}));
  cards[it.id]=c;$('grid').appendChild(c)})}
function paint(it){const c=cards[it.id],s=statusOf(it);c.dataset.status=s;
  c.querySelectorAll('.verdict button').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.v===s));b.disabled=!canWrite});
  const ta=c.querySelector('textarea');ta.disabled=!canWrite;const n=(reviews[it.id]&&reviews[it.id].note)||'';if(document.activeElement!==ta&&ta.value!==n)ta.value=n}
function render(){const c=tally();
  chips($('fCat'),[['all','All folders'],...Object.entries(CATS).filter(([k])=>ITEMS.some(i=>i.cat===k))],cat,v=>cat=v);
  chips($('fState'),[['all','Any state'],['UNREVIEWED','To review'],['KEEP','Keep'],['MAYBE','Maybe'],['NO','No']],st,v=>st=v);
  let shown=0;ITEMS.forEach(it=>{paint(it);const vis=(cat==='all'||it.cat===cat)&&(st==='all'||statusOf(it)===st);cards[it.id].hidden=!vis;if(vis)shown++});
  $('empty').hidden=shown>0;$('acceptBtn').hidden=!canWrite||c.UNREVIEWED===0}
async function save(id,patch){if(!db||!canWrite)return;const cur=Object.assign({status:'UNREVIEWED',note:''},reviews[id]||{});const next=Object.assign(cur,patch,{at:new Date().toISOString()});
  const msg=cards[id].querySelector('.saved');reviews[id]=next;render();msg.textContent='Saving…';
  try{await db.collection('reviews').doc(id).set(next);msg.textContent='Saved'}catch(e){msg.textContent=e&&e.code==='invalid_argument'?'You can view these reviews but not change them.':'Not saved. Try again in a moment.'}}
$('acceptBtn').onclick=()=>{const n=ITEMS.filter(it=>statusOf(it)==='UNREVIEWED').length;$('acceptMsg').textContent=`Set ${n} unreviewed image${n===1?'':'s'} to Claude's suggestion? You can change any of them afterwards.`;$('acceptConfirm').hidden=false;$('acceptBtn').hidden=true};
$('acceptNo').onclick=()=>{$('acceptConfirm').hidden=true;render()};
$('acceptYes').onclick=async()=>{$('acceptConfirm').hidden=true;for(const it of ITEMS.filter(it=>statusOf(it)==='UNREVIEWED')){await save(it.id,{status:it.rec})}render()};
build();render();
(async()=>{try{db=await (window.claude&&window.claude.use?window.claude.use('db'):null)}catch(e){db=null}
  if(!db){$('status').textContent='Reviews can only be saved when you open this page signed in to Claude. You can still browse the images.';return}
  let user=null;try{user=await window.claude.use('user')}catch(e){}
  const w=user?await user.can('data.write'):null;canWrite=w!==false;
  $('status').textContent=canWrite?'Marks save as you make them. Claude reads them from here.':'You can browse these reviews, but only the owner can change them.';
  db.collection('reviews').onSnapshot(s=>{s.docs.forEach(d=>{if(d.exists)reviews[d.id]=d.data()});render()},e=>{$('status').textContent='The saved reviews could not be loaded. Reload the page to try again.'});
  render()})();
})();
</script>
