<style>
/* Layout: a working ledger — a parchment header with the tally, a filter bar, then a wrapping grid of image cards with their verdict buttons. */
:root{
  --paper:#efe6d2; --card:#f8f2e4; --ink:#2b241b; --muted:#6d6252; --rule:#d6c9ad;
  --rubric:#8a1a1a; --keep:#2f6b3a; --maybe:#a8721a; --no:#7a6a5a;
  --keep-bg:#dcebd6; --maybe-bg:#f3e2bd; --no-bg:#e4ddd2;

  --body:"Alegreya Sans", "Gill Sans", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1b1a17; --card:#24221e; --ink:#ece3cf; --muted:#a99c84; --rule:#3a362e;
  --rubric:#d0574f; --keep:#7cc28a; --maybe:#e0aa4a; --no:#a89a88;
  --keep-bg:#22362a; --maybe-bg:#3a2f1a; --no-bg:#302c27; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1b1a17; --card:#24221e; --ink:#ece3cf; --muted:#a99c84; --rule:#3a362e;

body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:18px}
header{display:grid;gap:8px;border-bottom:1px solid var(--rule);padding-bottom:14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,40px);margin:0;letter-spacing:.01em;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:68ch}
.tally{display:flex;flex-wrap:wrap;gap:8px 18px;font-variant-numeric:tabular-nums;align-items:baseline}
.tally b{font-size:22px;font-weight:700}
.tally .k b{color:var(--keep)} .tally .m b{color:var(--maybe)} .tally .n b{color:var(--no)} .tally .u b{color:var(--rubric)}
.tally span{color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{font:inherit;font-size:14px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary{border-color:var(--rubric);color:var(--rubric)}
button:focus-visible,a:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--rubric);outline-offset:2px}
.note{font-size:14px;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.card[data-status="KEEP"]{box-shadow:inset 0 3px 0 var(--keep)}
.card[data-status="MAYBE"]{box-shadow:inset 0 3px 0 var(--maybe)}
.card[data-status="NO"]{box-shadow:inset 0 3px 0 var(--no)} .card[data-status="NO"] img{opacity:.55}
.thumb{display:block;aspect-ratio:3/2;width:100%;max-width:100%;object-fit:cover;background:var(--rule)}
.body{padding:10px 12px 12px;display:grid;gap:8px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.id{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.03em}
.chip{border:1px solid var(--rule);border-radius:999px;padding:0 8px;color:var(--muted);text-transform:capitalize}

.rec.KEEP{background:var(--keep-bg);color:var(--keep)} .rec.MAYBE{background:var(--maybe-bg);color:var(--maybe)} .rec.NO{background:var(--no-bg);color:var(--no)}
.title{margin:0;font-weight:500;line-height:1.3}
.verdict{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.verdict button{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:4px;padding:6px 0;cursor:pointer}
.verdict button[data-v="KEEP"][aria-pressed="true"]{background:var(--keep-bg);border-color:var(--keep);color:var(--keep)}
.verdict button[data-v="MAYBE"][aria-pressed="true"]{background:var(--maybe-bg);border-color:var(--maybe);color:var(--maybe)}
.verdict button[data-v="NO"][aria-pressed="true"]{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.verdict button:disabled{cursor:not-allowed;opacity:.6}
details{font-size:14px} summary{cursor:pointer;color:var(--rubric)}
details p{margin:6px 0 0;overflow-wrap:anywhere} details h4{margin:10px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
details a{color:var(--rubric)}
textarea{font:inherit;font-size:14px;width:100%;box-sizing:border-box;min-height:2.4em;resize:vertical;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink);padding:6px 8px}
.saved{font-size:12px;color:var(--muted);min-height:1em}
.empty{color:var(--muted);padding:24px 0}
@media (prefers-reduced-motion:no-preference){.card{transition:box-shadow .2s}}

<script id="data" type="application/json">[{"id": "OG-001", "cat": "01_Characters_Peoples_NPCs", "rec": "MAYBE", "title": "NPC gallery: 40 named characters across the islands", "island": "all", "tags": "npcs;portraits;named-characters;ashenmoor;ironhaven;mysterious-figures;body-variety", "ideas": "A face for most of Act I: Bram as a broad, bearded smith with folded arms and a leather apron; Edna as a white-haired old healer in a rough shawl; Corwin as a grinning, curly-haired travelling merchant with a pack; Aldwyn as a grey-bearded herald in a crimson robe with gold trim. Five 'mysterious figures' as hooks: the Veiled (a black face-veil, pale eyes), the Collector (wide-brimmed hat, face in shadow), the Mariner (old, grey-bearded, a knit cap), the Herald (a gold sun-rayed mask), the Child (a pale girl who stares). Margin types worth having in towns: smuggler, salvager, exile with scalp tattoos, a white-haired 'gate seer' with facial marks, a fisher boy. An extras strip that asks for children, the elderly, the disabled (an eyepatch, scars), large and small builds.", "notes": "Invented: an 'Otherkin and strangers' row with an elf envoy, a dwarven smith and a pointed-eared gate scholar; the canon has four human peoples and no elves or dwarves. Aurenne is captioned 'forests, farms and quiet towns' and drawn as green woodland with Gaelic names (Maeve, Sorcha, Cael); against decision 4 (warm, Mediterranean / North African, darker-skinned). Ironhaven is given a section of its own as if it were a region. Names re-used with new jobs: Mira (canon apothecary) as a salvager, Niamh as 'Keeper of the Mouth' (fills a gap; candidate). The palette is dark and grim throughout, darker than the 12 Oct style call. Useful as a face reference per NPC; the people pages (OG-048, OG-002, OG-044) are the better source for costume, and OG-053 supersedes its Aldwyn.", "drive": "https://drive.google.com/file/d/1-9sijCp9_6BDzom1F1-JWpDcNrEJDlum/view", "thumb": "thumbs/OG-001.jpg"}, {"id": "OG-002", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Sheet: the four peoples, Markmen page", "island": "mark", "tags": "markmen;peoples;costume;furs;palette;materials;hold-guard;silhouettes", "ideas": "Tall, broad, fair to ash-blond Markmen with braids (women) and short beards (men): matches the canon body. Costume: heavy fur collars and mantles over layered wool, a broad leather belt hung with pouches, crossed shoulder straps, laced leather boots with fur cuffs. Women in long dark dresses with a woven red-and-black hem band and a leather apron. A guard in a nasal helm with a round iron-bossed shield and a fur mantle. Details: iron, bronze and bone brooches, carved axe heads, boot wraps. Palette: brown leather, charcoal wool, slate grey, a muted rust red. Fabrics: wool, fur, leather, linen, iron, wood. A timber village of dark-shingle halls on a river under snowy peaks, a forge-lit workshop interior. Five age stages, young adult to elder.", "notes": "Fits the canon closely (§1.2, §2). 'Hold guard' is the generator's word; the canon has Captains and Reeves, and the Mark's colours are black-and-iron (the guard here wears brown, which is fine for a townsman). The darkest of the people sheets in tone, but it is the cold island, so the mood suits it.", "drive": "https://drive.google.com/file/d/1Fngnr3M2iJY-BGMoEqq7q77NHqVqzO8l/view", "thumb": "thumbs/OG-002.jpg"}, {"id": "OG-003", "cat": "02_Creatures_Fauna_Bestiary", "rec": "MAYBE", "title": "Bestiary: base designs of the 12 gate monsters, with variants by the six old dungeon themes", "island": "none", "tags": "bestiary;gate-monsters;skeleton;phantom;wraith;mimic;goblin;kobold;slime;cave-troll;shieldbearer;fire-elemental;golem;gargoyle;variants", "ideas": "One base silhouette for each of the twelve gate monsters the game already has (Skeleton with round shield and sword; Phantom as pale trailing shroud; Wraith as dark hooded rags; Mimic as iron-banded chest with tongue; Goblin and Kobold Thief, lean, spear and knife; Slime as holed translucent jelly; Cave Troll hunched and mossy; Shieldbearer goblin behind a tall plank shield; Fire Elemental as a flame figure; Golem as blocky masonry with one blue rune at the chest; Gargoyle winged and crouched). Each has a one-line read (e.g. Slime \"shaped by their environment\", Gargoyle \"still bound to their charge\"). The variant grid shows the method that matters: one model per monster, recoloured and re-lit per gate (glow, palette, a material swap), not a new model.", "notes": "Its variant rows are the six themes inherited from Dungeon of Shadows (undead, goblin, elemental, deep, haunted, ruins), which §9a replaced with the six schools; OG-018 is the same bestiary redone by school and supersedes it. The banner shows the gate as a tall glowing gothic arch, not the concentric stone rings Michael chose (12 Oct). Dark, which is right for gates.", "drive": "https://drive.google.com/file/d/1eocn40H6oEHzl1gHA6gm-7E26VtMAUVF/view", "thumb": "thumbs/OG-003.jpg"}, {"id": "OG-004", "cat": "05_Ships_Maritime", "rec": "KEEP", "title": "Board J1: ships of the three islands (fuller pass)", "island": "all", "tags": "ships;ship-classes;silhouettes;below-deck;player-base;deck-plans;size-comparison;heraldry", "ideas": "Five hulls per island, smallest to largest. Gatelands: fishing boat, coastal trader, merchant cog, galleon warship, explorer; clinker hulls, green sails with the harp, square rig. Mark: fishing longboat, trading longship, raiding longship (red-and-black striped sail), heavy trader, drakkar warship; dragon prows, oars, dark sails. Aurenne: fishing skiff, lateen dhow, trading brig, galley with oars and sails, flagship; white and blue sails with a gold sun-star, painted hulls. A below-deck cabin per island in that island's dress (Gatelands timber and wool, Mark furs and lantern light, Aurenne rugs, tiles and blue cloth), each with bed, storage chest, barrels, map table and crafting stations. Three-deck plan: lower deck the player base, main deck cargo and crew, upper deck sails and helm. A size-comparison strip in metres, and one distinct silhouette per island so a ship's origin reads at a glance.", "notes": "The best ship-line board; OG-021 is the other pass of J1 (MAYBE). Its 'Armaments: cannon, ballistae, fire pots' row puts guns on ordinary hulls, against Michael's note (cannons on high-tier ships only). The game's classes are sloop, cutter, caravel, cog, galleon; the board adds fishing boat, dhow, longships, brig, galley and flagship: which become player or NPC classes is a decision for Michael. 'Crown jewel of Aurenne's fleet' is the generator's: Aurenne has no crown (the Compact). Lion banner on the Gatelands warship and the wolf on the Mark's crest are invented heraldry; the harp and the sun-star fill a gap.", "drive": "https://drive.google.com/file/d/1X_EXTQRs3eNFhC56_NK7gEAfIqZTtdmP/view", "thumb": "thumbs/OG-004.jpg"}, {"id": "OG-005", "cat": "01_Characters_Peoples_NPCs", "rec": "MAYBE", "title": "Character creation: variations of the default hero", "island": "none", "tags": "character-creator;player;hero-outfit;ui;skin-tones;body-types;hair", "ideas": "A creator laid out as: five full-body previews in the same kit, a face-and-hair grid, then rows for gender, body type (lean, balanced, strong), skin tone (five swatches pale to dark brown), hair style, hair colour, and facial features (shape, scars). The default kit: dark leather-and-scale armour, a teal-blue hood and ragged half-cape, a teal tabard with a gold tree emblem, crossed belts, a round shield and a sword on the back. The in-game preview shows the hero in third person before glowing gold sigil pillars in a ruin.", "notes": "Elf and dwarf options are not in the canon; the canon's choice is one of four peoples (Gatelander, Markman, Aurennais, Old Blood), and Old Blood is missing here. The gold tree on the tabard reads as a Weaver or Gatelands emblem; nothing in the canon names it (candidate, if wanted). The same kit is the subject of OG-012's proportion study.", "drive": "https://drive.google.com/file/d/1-xKeCVQ1K0Fqu66FOpxnyKUeiHgD08V8/view", "thumb": "thumbs/OG-005.jpg"}, {"id": "OG-006", "cat": "07_Combat_Keyframes", "rec": "KEEP", "title": "Sheet E6: the underworld (five character sheets)", "island": "all", "tags": "characters;npcs;underworld;crime;fence;smuggler;assassin;highwayman;turnarounds;props", "ideas": "Five underworld NPCs, each with a hero portrait, three expressions, a four-view turnaround, a prop spread, a scene and a card (people, occupation, alignment, personality, hook). An information broker in red velvet with rings and a goblet (Gatelander). A smuggler and river runner, braided, with ropes, spyglass and charts (Markish). A hooded contract killer with a long knife and a mask. A cheerful, round, goggled fence at a counter of stolen goods and gate relics, who knows more about relics than she says (Gatelander): the warm, funny note the tone asks for. A highwayman who was a pilgrim, tattooed, with a staff and a holy book, who gives to the poor (Aurennais, a former cleric). Hooks that cut both ways: the killer may be hunting your target or hired to stop you.", "notes": "Misfiled: a character sheet, not a combat key frame; it belongs with the E-series character sheets. Fills a gap for the crime system (fences, smugglers, the black market in OG-093). The night candlelight is the sheet's mood, not a world palette. Brother Jasko's book and staff carry a Christian cross: the Church of the Weaver needs its own sign. Names are proposals.", "drive": "https://drive.google.com/file/d/1rRIWpitmrlqkmQkJC2oDi_5iSPg2CV0u/view", "thumb": "thumbs/OG-006.jpg"}, {"id": "OG-007", "cat": "03_World_Architecture_Transport", "rec": "MAYBE", "title": "Board 15: ports, roads & infrastructure (first pass)", "island": "all", "tags": "ports;harbours;bridges;roads;mills;beasts-of-burden;carts;roadside;materials", "ideas": "Harbour kinds: commercial port, fishing harbour, shipyard, naval docks, lighthouse, canal port. Bridge kinds: stone, wooden, suspension, arched viaduct. Road kinds: paved royal road, trade route, mountain pass, forest trail, desert caravan route. Rural works: watermill, windmill, farmstead, storage silo. Roadside: signpost, milestone, market stalls, river ferry, toll gate, coastal defences, trade caravan, cargo lift, road-repair crew. Beasts: horse, draft horse, mule, ox, yak, camel, dromedary, llama, pack boar (the Mark), war elephant, water buffalo; carts to ornate caravans.", "notes": "Superseded in part by OG-046. Capital names (Crownholm, Skardrun, Solaris) are the generator's, not canon.", "drive": "https://drive.google.com/file/d/1pyEpmtwe52rgvWCke4UPq-Bexuvm2Moc/view", "thumb": "thumbs/OG-007.jpg"}, {"id": "OG-008", "cat": "01_Characters_Peoples_NPCs", "rec": "MAYBE", "title": "Sheet: the four peoples, Old Blood page", "island": "all", "tags": "old-blood;peoples;sigil-tattoos;costume;jewellery;palette;highlands;ruins", "ideas": "The wrist-and-body markings panel: thin, ruled sigil script running up the inner forearm, circles crossed by lines at the wrist and on the back of the hand, the marks continuing to the knuckles. Bone and stone pendants, carved rings, layered belts hung with charms. Archaic layered clothes: cream linen under dark wool wraps with geometric woven borders, frayed and patched hems, a shawl pinned with a round brooch. Scalp and temple tattoos on one young man. An elder with a tall carved staff. Highland valleys of tall broken stone towers, a ruined viaduct and mist: a strong 'Old Blood place' picture.", "notes": "Contradicts the canon body: the sheet says 'tall, lean, long-limbed' and draws many of them blond or white-haired; the canon has them short, slight, grey-pale, with black hair (§2, §3.1). It also gives them highland homes and 'isolated clans'; the canon scatters them through the three peoples with no land of their own (strongest inland, §3.1, so the highland valleys are half right). Keep the markings, jewellery and textiles; redraw the bodies. The canon look (grey-pale, black-haired, slight) still needs a picture. The better of the two Old Blood pages (OG-020 is worse).", "drive": "https://drive.google.com/file/d/1PF0f3osWygZBzinUfct9IRau9MjpHufv/view", "thumb": "thumbs/OG-008.jpg"}, {"id": "OG-009", "cat": "02_Creatures_Fauna_Bestiary", "rec": "KEEP", "title": "Sheet G1-A: Gatelands fauna, 15 species and five habitats", "island": "gatelands", "tags": "fauna;wildlife;field-guide;peaceful;deer;boar;fox;otter;heron;badger;wildcat;stoat;hawk;frog;pike;lizard;snake;beetle;habitats", "ideas": "Fifteen ordinary animals, mostly peaceful, all at home in an Irish countryside. Elderstag (woodlands, common; huge antlers, wary, seen near old groves and ruins). Gatefen Boar (forests, common; aggressive, roots up old ruins and \"exposes forgotten paths\", a hook for finds). Redspine Fox (farmlands, common; follows settlements, eats crop scraps). River Otter (rivers and lakes, common). Great Heron (wetlands, common). Woodland Badger (forests, common; nocturnal, burrow networks). Hollowcat (forests, uncommon; tufted-eared wildcat of remote woods). Greenward Stoat (rivers and fields; near stone walls). Crag Hawk (cliffs and woods; nests on ruined towers). Marsh Frog (wetlands; its calls mark spring). River Pike (deep rivers and lakes; a fishing target). Stonecrawler (fields and ruins, uncommon; black-and-blue lizard that lives in dry-stone walls). Grove Turkey (forests, uncommon; displays in spring). Mire Snake (wetlands, uncommon; non-venomous banded water snake). Lantern Beetle (forests, rare; glows near old trees and ruins, \"a reaction to residual magic\": a night light and a likely alchemy ingredient). Habitat strip: woodlands, rivers and wetlands, ruins and old roads, farmlands with hedgerows, moors and hills with heather and raptors.", "notes": "Fills the biggest gap in the game: no peaceful land wildlife at all today (only hostile Wolf, Boar, Spider, Cave Bear). The Boar exists as a hostile; here it is aggressive but a normal animal. Names are the generator's proposals; candidates where they fill the gap. The Grove Turkey is a New World bird and out of register for an Irish island (a capercaillie or black grouse would fit). Sister sheets OG-031 (the Mark) and OG-030 (Aurenne).", "drive": "https://drive.google.com/file/d/188c_yVxzXoq0cyLnYGtJ9ADKugjXDf1h/view", "thumb": "thumbs/OG-009.jpg"}, {"id": "OG-010", "cat": "01_Characters_Peoples_NPCs", "rec": "MAYBE", "title": "People sheet: Gatelanders (frontier warden, commoner, gate militia)", "island": "gatelands", "tags": "gatelanders;peoples;costume;militia;heraldry;palette;landscape", "ideas": "Three Gatelander roles as male/female pairs: frontier warden (fur collar, blue scarf, bow and sword), commoner (linen shirt, waistcoat, an apron dress with a basket on the back), gate militia (blue tabard over leather, a plumed hat). Red hair, freckles and braids are common, which suits the Irish register. Clothing variations: everyday, travel, work, rugged, formal (a long blue cloak). A family token: a small compass-rose pendant on a cord. Regional strips: fields, rivers and farmland, woodland, hill country, and a walled town on a river.", "notes": "Heraldry conflicts: the banner is a gold compass-rose on blue, but Crown colours are crimson-and-gold (§1.5). Wide-brimmed and plumed hats give a cavalier, frontier look away from the Irish-register countryside. 'The Gatefields' and 'frontier' are the generator's words. The 'gate militia' (local levies who guard a gate) is not in the canon and fills a gap; candidate. Superseded by OG-048 (and its first pass OG-038), which keep the Crown's crimson and gold.", "drive": "https://drive.google.com/file/d/1CjiSvGR7XWGWtA4yB1QdeajIF46Sm2YL/view", "thumb": "thumbs/OG-010.jpg"}, {"id": "OG-011", "cat": "07_Combat_Keyframes", "rec": "KEEP", "title": "Combat key frame: sword and spell against a skeleton in a gate hall (clearest pass)", "island": "none", "tags": "combat;key-frame;parry;spell;skeleton;shieldbearer;gate-interior;sigils;third-person", "ideas": "Over-the-shoulder third-person framing. A skeleton in a rusted helm and torn tabard brings its sword down; sparks at the bind show the parry at the moment of contact, while the player's off hand drives a crackling blue spell into its chest at arm's length: steel and magic in one beat. The skeleton carries a big round shield; a second skeleton runs in from the depth, so the fight reads as one-on-one with pressure behind. The hall: tall stone piers cut with amber glowing script (chevrons, a ring crossed by a line), braziers, a wet floor that doubles the light, a lit doorway at the end of the axis.", "notes": "The warmest and most readable of four passes of this frame (OG-045, OG-063, OG-076 are MAYBE). Skeletons put this in a Solas gate (canon 9a: when one fails the dead walk); the ember-lit script is Tine's in the table, so the hall's school is ambiguous. The blue lightning matches no school (Uisce or Gaoth?): a decision when the spell look is set. The ring glyphs echo the concentric-ring gate exterior. Dark imagery is right here, inside a gate.", "drive": "https://drive.google.com/file/d/1tNQ8aoFV_pDZ_RfsS5MgZHfFB6AcWJOl/view", "thumb": "thumbs/OG-011.jpg"}, {"id": "OG-012", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Proportion study, Sheet B: naturalistic, subtly exaggerated, stylised", "island": "none", "tags": "proportions;player;style;hero-outfit;silhouette;decision", "ideas": "One hero drawn three ways: A naturalistic (about 1.75 m, real anatomy), B subtly exaggerated (about 1.8 m, broader shoulders, longer legs, a shorter torso; marked as recommended), C stylised (about 1.85 m, larger head and hands, narrower waist, sharper features). Detail crops of the kit: the gold tree on a teal tabard, a crossed belt with an iron buckle, a plated boot.", "notes": "Raises a decision for Michael: which proportion the people builder targets (B is the sheet's own pick and suits 'stylised but readable'). The footer reads 'The Weaver's Path', the generator's title; the canon title is The Old Gates (§0).", "drive": "https://drive.google.com/file/d/1vlEML9VZQSKPPEz65ySwYLTiJkQN4KfA/view", "thumb": "thumbs/OG-012.jpg"}, {"id": "OG-013", "cat": "01_Characters_Peoples_NPCs", "rec": "NO", "title": "Character sheet: Varek", "island": "none", "tags": "varek;villain;sigil-tattoos;props;the-list", "ideas": "Small things only: sigil script tattooed on the inside of his wrist, hidden under the sleeve; he carries a long handwritten list and treats it with care (the canon's list, Part I); a desk of worn notes, maps and a brass instrument for the 'items and documents' of his lodging; the gesture notes ('speaks with patience, certainty and a hint of contempt'; 'rarely uses overt magic, and then subtly').", "notes": "Against the canon on almost every point. Varek is drawn tall, gaunt and bald, levitating in tattered black robes like a wraith, a dark lord in a cathedral; the canon has him short and slight, black-haired, grey-eyed, in plain dark charcoal clothes, and 'never a dark lord'. The quote 'The world didn't end. It opened.' is invented. The inspiration panel shows recognisable film and comic villains, which must not be used. A new Varek sheet should start from the canon description. OG-053's 'with Varek' panel repeats this look.", "drive": "https://drive.google.com/file/d/1yUpKwulidQVc9ydJHOobWq1BHaR2KQ2g/view", "thumb": "thumbs/OG-013.jpg"}, {"id": "OG-014", "cat": "03_World_Architecture_Transport", "rec": "KEEP", "title": "Key frame 2 board: the Gatelands, hero view", "island": "gatelands", "tags": "key-frame-2;landscape;palette;town-life;seasons;landmarks;wildlife", "ideas": "Hero view from the road: river valley, stone bridge, whitewashed thatch village, castle on a crag as a scale landmark. Seasonal variation (autumn mist). Town life with markets and banners. Details: wildflowers (foxglove), dry-stone walls and hedges, coastal cliffs and sea stacks, a stag in the fields, a carved standing stone. Palette swatches: sky, grass, earth/stone, buildings, cloth and banners, subtle magic violet. Key elements: Weaver arch, cottage, banner, horse, signpost. Its notes match the brief: readable silhouettes, simple shapes for procedural generation, colour and light over texture.", "notes": "The strongest single target for the home island.", "drive": "https://drive.google.com/file/d/1ybIMGCVDvtk2pTnvvXLnhsdtbejb_zto/view", "thumb": "thumbs/OG-014.jpg"}, {"id": "OG-015", "cat": "04_Flora_Alchemy_Survival", "rec": "MAYBE", "title": "Sheet H3: natural resources and crafting by island, gathering, nodes, tools and workstations", "island": "all", "tags": "resources;timber;stone;ore;minerals;mining;woodcutting;quarrying;gathering;tools;workstations;crafting;survival", "ideas": "Timber by island: Gatelands oak, ash (bows and tools), birch, willow (baskets, ropes, boat parts); the Mark pine, spruce, larch, dwarf pine (rare, strongest); Aurenne olive, cypress (ships), tamarisk (fuel, charcoal), palm (thatch, rope). Stone: limestone, slate, clay (Cré Dearg), granite; granite, marble, shale, glacial stone (holds cold, for preservation); sandstone, golden marble, salt, desert clay. Metals: iron, copper, tin, river stone; iron, silver, lead, frost crystal (enchanting); copper, iron, gold, sunstone (a warm crystal). The rules that matter: resource nodes in the world, a felled tree that regrows, an ore vein with limited respawn, clay deposits, salt formations on coast and desert; gathering by woodcutting, mining, quarrying and coastal gathering (salt, driftwood, shells); skill raises yield. Tools: woodcutter's axe, pickaxe, mining hammer, gathering knife (plants and fungi), shovel (clay), fishing net, dive knife (underwater gathering of kelp, shells, pearlweed), waterskin. Processing chains: logs to planks, ore to ingots, clay to bricks and pottery, stone to cut stone, salt to preserved goods, sand to glass. Workstations: campfire (cooking, water purification), drying rack, grindstone, crafting bench, smelter, alchemy table, kiln, tanning rack.", "notes": "Overlaps OG-035 (H4), which repeats its resources and adds crops and animal products; keep this one for the world-node rules (regrowing trees, limited ore veins) and the dive knife. Mining and woodcutting are not built; these are the planned survival skills. Cré Dearg is a herb in the game and clay here; the two fit if the herb is a pinch of the clay.", "drive": "https://drive.google.com/file/d/1f2EDkieVH6egNrvb0we7trrrjuSyvYSb/view", "thumb": "thumbs/OG-015.jpg"}, {"id": "OG-016", "cat": "05_Ships_Maritime", "rec": "KEEP", "title": "Sheet G1-E/F: aquatic bestiary", "island": "all", "tags": "creatures;sea-life;bestiary;fish;whales;deep-sea;habitats;underwater-ruins", "ideas": "Twenty sea creatures in three bands, each with habitat, rarity, a silhouette beside a human for scale and a skeleton sketch. Coastal: tidecrab (shell colour varies by island), reef moray, starweed ray, kelpstrider (leafy seahorse), stonefish, lantern jelly (blooms on warm nights and draws fish and birds), pierwinkle. Open ocean: coastal tuna, stormswift (rides the bow wave), skyskimmer (flying fish), tempest whale, sailfin ray, drifter squid, reef shark. Deep and legendary: blackcurrent eel (glows), abyssal angler, gate eel (drawn to the gates), crimson leviathan, maw turtle (carries an ecosystem on its back), the Gate Leviathan (said to move between the islands as the gates change). A habitat strip: tide pools, kelp forests, coastal reefs, open ocean, deep channels, abyssal plains, underwater ruins.", "notes": "A creature sheet filed with the ships. Fills a gap beside the game's fish, whales and sea-floor herbs. The gate eel and the Gate Leviathan could be read as the gates' antibodies at sea (canon: monsters are the world's immune response); the maw turtle and lantern jelly fit 'strange, not stock'. Names are proposals.", "drive": "https://drive.google.com/file/d/1iuNw9DmhAMm17DyHcv85Ef3t6GYfPm3j/view", "thumb": "thumbs/OG-016.jpg"}, {"id": "OG-017", "cat": "05_Ships_Maritime", "rec": "KEEP", "title": "Board J3: naval combat and seafaring", "island": "all", "tags": "naval-combat;boarding;ramming;sea-state;weather;hazards;coastal-defences;ship-ui;damage-states;exploration", "ideas": "Ship-to-ship moments: broadside, boarding action (grapple and fight on the enemy deck), ramming with a reinforced prow, fleet battle. Shot types: chain shot (masts), explosive shot (fire), grapeshot (crew), grappling hooks (boarding), ballast shot (rudder); a ballista as the non-gun option. Sea conditions calm, moderate, rough, storm, with waves that change speed and handling, and fog and ice seas (the Mark) as hazards. Coastal defences: harbour guns, watchtowers, fortified harbours with booms and chains, submerged stakes, naval patrols. Ship UI: hull, sails, crew and cannon bars; weapon arcs (bow, port and starboard broadside, stern); crew morale bar; four damage states (intact, light, heavy, sinking) as hull and rig wear. Exploration: unmapped coasts, hidden harbours under sea arches, atolls, ruins at sea, dynamic encounters (distress calls, merchant traffic). By culture: the Gatelands disciplined and royal, the Mark boarding, Aurenne fast ships and precise ranged fire.", "notes": "The sea states match sailing.md's 0 to 3 and the status bars match its hull and rig bars. Cannons are shown as standard on every ship, against Michael's note (cannons only on high-tier, high-quality ships): keep the shot types for those ships and the ballista, fire pots and boarding for the rest. The pirate flag is the Earth skull and crossbones; the Mark's free captains want their own mark.", "drive": "https://drive.google.com/file/d/1wisiN_giOv-HT4y9xvioOexBCy4BCMbk/view", "thumb": "thumbs/OG-017.jpg"}, {"id": "OG-018", "cat": "02_Creatures_Fauna_Bestiary", "rec": "KEEP", "title": "Bestiary by gate: the six schools, each with its hall and its antibodies", "island": "none", "tags": "bestiary;gate-monsters;schools;tine;uisce;cloch;scath;solas;gaoth;occupied;magma-slime;drowned-skeleton;frost-thing;wisp;winged-thing", "ideas": "The §9a table drawn, row by row, with a hall for each school. Tine: forge-hot halls with ember-lit script; Fire Elemental, Magma Slime (orange jelly with dark holes), Golem with lava seams, Cave Troll with glowing cracks. Uisce: sea caves and drowned halls; ice-blue Slime, Drowned Skeleton (weed-hung, in a pair), pale Cave Troll, Mimic, and a Frost Thing (a crystalline ice-shard figure, all spikes). Cloch: half-fallen masonry; mossy Golem, stone Gargoyle, moss-backed Cave Troll. Scáth: violet dark; Phantom, Wraith, Mimic with smoke tendrils. Solas: white light through a ruined hall; Skeleton, white Wraith and Phantom (\"where the dead are burned out of the world; when it fails, the dead walk\"). Gaoth: open shafts to a cloudy sky; Wisp (a glowing jellyfish-like air spirit with trailing threads), wind-swept Gargoyle, and a Winged Thing (a feathered griffin-like beast). Occupied panel: Goblin, Kobold Thief and Shieldbearer as a warren in any quiet gate. New monsters it names: Magma Slime, Drowned Skeleton, Frost Thing, Wisp, Winged Thing.", "notes": "Supersedes OG-003; matches lore_canon §9a exactly, including the occupied state. Gaoth is the empty school in code: Wisp and Winged Thing are candidates to fill it (the open world already has a Shore Wisp). The Frost Thing reads as an elemental, not a familiar silhouette built wrong; it may need a folk shape under the ice to follow the monster rule. Banner gate is again a tall arch, not the concentric rings.", "drive": "https://drive.google.com/file/d/1CpBZ1aZrPi70fWIPmYR8quM83H9MVbTU/view", "thumb": "thumbs/OG-018.jpg"}, {"id": "OG-019", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Armour tiers: ten tiers in three lines (heavy, light, robe), first pass", "island": "none", "tags": "armour;tiers;heavy;light;robe;progression;colour-coding;silhouettes", "ideas": "The whole ladder on one board, ten columns by three rows, one body: the canon's ten tiers in its three lines. Heavy: Wooden as lashed wooden slats and leather; Bronze as a Greek muscle cuirass, red pteruges and a crested helm; Iron as mail and a kettle helm; Steel as full plate with a great helm; then Mithril (blue), Adamant (green), Obsidian (black with violet glow), Draconic (red-orange scale), Demonic (purple, horned), Cosmic (white and ice-blue, glowing, winged crest). Light: a hooded archer's coat with a quiver, from undyed leather to the same tier colours. Robe: belted, barefoot robes from sackcloth and rust wool to embroidered tier-coloured robes. Every tier keeps a round shield (heavy) and a crossed belt, so the tier reads by colour and trim while the silhouette stays the same. Faces are visible in the light and robe rows.", "notes": "Matches the canon's ten tiers and three lines exactly, and the colours match the game's existing tier colours in js/14-items.js (Mithril blue, Adamant green, Obsidian black and violet, Draconic red-orange, Demonic purple, Cosmic ice-blue). Better than OG-052 for the lower tiers and for faces; OG-052 has bolder headgear at the top. The Bronze tier's Greek cuirass suits Aurenne's guards (decision 4).", "drive": "https://drive.google.com/file/d/1My6o5mErSQDWIVmi0BGebqcp5W7JBjZV/view", "thumb": "thumbs/OG-019.jpg"}, {"id": "OG-020", "cat": "01_Characters_Peoples_NPCs", "rec": "NO", "title": "Sheet: the four peoples, Old Blood page (second pass)", "island": "none", "tags": "old-blood;peoples;costume;furs;off-canon", "ideas": "Nothing the Markmen page (OG-002) does not already have. If wanted for the Mark: shaved-side heads with braids and facial tattoos on two warriors; clan-pattern brooches; a feast hall with a central fire.", "notes": "Draws the Old Blood as a tall, broad, fair-to-ruddy Norse warrior people with blond and red hair in furs, which is the Markmen again and the opposite of the canon (short, slight, grey-pale, black hair, scattered among the three peoples, §2 and §3). 'Isolated clans and frontier communities' in 'the northern reaches' also contradicts §3.1. Superseded by OG-008, which at least has the wrist markings.", "drive": "https://drive.google.com/file/d/1IRKyjx2popEVAtGLHBNDDY1rm-JWmBl4/view", "thumb": "thumbs/OG-020.jpg"}, {"id": "OG-021", "cat": "05_Ships_Maritime", "rec": "MAYBE", "title": "Board J1: ships of the three islands (other pass)", "island": "all", "tags": "ships;ship-classes;below-deck;player-base;cutaway;upgrades;heraldry", "ideas": "Gatelands line: fishing boat 8 m, coastal sloop 15 m, merchant cog 25 m, trading carrack 35 m, Crown warship 45 m with green sails and a gold harp. Mark: fishing longboat, raiding longship, trading knarr, war knarr, a 50 m dragon-prowed 'dreadnought'. A large cutaway of the player ship as home at sea: storage chests and barrels, bed and personal quarters, map table and charts, crafting stations, supplies, under lantern light. Interior vignettes: rest and store, plan and explore, craft and repair, stock and supply. Upgrades: cargo hold, crew capacity, sails, defensive armaments, faster hull, luxury cabins, specialised holds (food, timber, trade goods).", "notes": "Earlier or alternative pass of J1; OG-004 is fuller. Its Aurenne line is galleys with bird and dragon prows, which reads Norse, not the Mediterranean and North African fusion; OG-004's dhow and lateen rig are closer. The Mark's white bear crest here and wolf in OG-004 disagree: one emblem is a decision. The cutaway is the best single picture of Michael's below-deck base.", "drive": "https://drive.google.com/file/d/1Xn1ylKFNmDmTBMOgxiV0p6_IoGRjqufv/view", "thumb": "thumbs/OG-021.jpg"}, {"id": "OG-022", "cat": "03_World_Architecture_Transport", "rec": "MAYBE", "title": "Key frame 2 variant: village by the river, Weaver ruin on the hill", "island": "gatelands", "tags": "key-frame-2;landscape;weaver-ruins;village", "ideas": "Weaver ruins (standing pillars and an arch) on a hilltop, visible from the start road as a landmark; river village and bridge below.", "notes": "Earlier pass of OG-077.", "drive": "https://drive.google.com/file/d/188X9xo-DpdfGAYgB4ak-V1ONldiBByc3/view", "thumb": "thumbs/OG-022.jpg"}, {"id": "OG-023", "cat": "04_Flora_Alchemy_Survival", "rec": "KEEP", "title": "Sheet H5: survival, cooking and camp life: food, water, shelter, rest, farming, preservation", "island": "all", "tags": "survival;cooking;food;water-collection;water-purification;containers;shelter;camping;bedrolls;clothing;farming;livestock;preservation;tools", "ideas": "Food from the land: venison, boar, hare, wildfowl, fish, crab, berries, mushrooms, eggs, honey, shellfish, seaweed. Regional dishes: Gatelands hearty (apples and pears, root vegetables, freshwater fish, forest mushrooms, game, barley and wheat); the Mark hardy (smoked meats, mountain fish, turnips and leeks, rye and oats, cheese and butter); Aurenne sun-ripened (olives and oil, grapes and citrus, dates and figs, legumes, spices, roast fish). Cooking stations: campfire, stone hearth (towns), cooking spit, clay oven (common in Aurenne), portable stove. Example meals with buffs: hearty stew (health, warmth), grilled fish (stamina), mushroom risotto (mana regen), spiced lamb (heat resistance, Aurenne), smoked trout (focus), flatbread and olives (long nourishment). Water: rivers and streams, lakes, wells and springs (safe), rainwater (arid regions); containers with uses (waterskin 4, ceramic flask 2, glass bottle 2, canteen 3, water barrel); purification by boiling, charcoal filter, herbs, melting snow and ice in the Mark, distillation through alchemy. Shelter: lean-to, tent, camp with workstations, inns and houses for full rest. Bedrolls: bedroll, wool blanket, fur bedroll (the Mark), travel hammock (forests), camp bed; better beds, stronger rest. Clothing by climate: cold-weather gear (the Mark), light heat-protection with headwear (Aurenne), rain cloak, sturdy boots, backpack for carry weight. Farming at settlements or camps: wheat, barley, vegetables, herbs, fruit trees; chickens, goats and bees. Preservation: drying rack, smoking rack, root cellar, salt curing, storage chest. Tools: cooking pot, skillet, hunting knife, fishing rod, fishing net, sickle, trowel.", "notes": "The clearest picture of the planned survival layer; it answers the reusable water container plan directly (uses per container). Climate gear by island implies a temperature rule (cold in the Mark, heat in Aurenne) not yet decided: raise it with the survival design. Farming at \"custom camps\" implies player building, which is not planned. Chickens, goats and bees are the livestock the world lacks.", "drive": "https://drive.google.com/file/d/176H58Sv6E1K7uw81M5reRIatnMbQ8JXI/view", "thumb": "thumbs/OG-023.jpg"}, {"id": "OG-024", "cat": "03_World_Architecture_Transport", "rec": "MAYBE", "title": "Key frame 5 variant: the gate in the hillside", "island": "gatelands", "tags": "key-frame-5;old-gate;sigils;camp", "ideas": "Concentric stone rings rising out of a hillside around a narrow slit entrance; amber sigil line; adventurers' tents at the foot.", "notes": "Variant of OG-037; choose one gate design.", "drive": "https://drive.google.com/file/d/18kgmweH1Gh5XAj94sUFeHQ9f5XNGwLhv/view", "thumb": "thumbs/OG-024.jpg"}, {"id": "OG-025", "cat": "01_Characters_Peoples_NPCs", "rec": "MAYBE", "title": "Sheet: the four peoples, Markmen page (second pass)", "island": "mark", "tags": "markmen;peoples;costume;furs;palette;harbour;longhall", "ideas": "As OG-002, with: a hold guard carrying a spear as well as a round shield; a snowy timber town on a frozen lake with a pier and a small open boat; a longhall interior with a central fire and a long table. Clothing crops show round iron fur-cloak clasps and woven red-and-blue bands at the cuffs.", "notes": "Near-duplicate of OG-002, which is the one to keep (OG-025 has typos in its captions: 'woodwker', 'woodwoker'). Kept for the harbour and hall pictures.", "drive": "https://drive.google.com/file/d/1LtxcQb8h6ROG5ThUj-y7BAqtfMBZ-9Fx/view", "thumb": "thumbs/OG-025.jpg"}, {"id": "OG-026", "cat": "04_Flora_Alchemy_Survival", "rec": "KEEP", "title": "Sheet H2: rare alchemical specimens, fungi, resins and minerals, equipment and preparations", "island": "all", "tags": "flora;alchemy;rare-herbs;fungi;resins;minerals;alchemy-equipment;recipes;study-and-discovery;harvestable", "ideas": "Rare plants, six per island. Gatelands: Heartroot (luminous root that thrums at night), Whispercap (translucent blue-violet mushrooms in deep forests; release spores when disturbed, \"carry the voices of the wood\"), Gatelotus (white lotus that blooms only near old gate sites, petals refract light: a gate sign and ingredient), Moonfen Orchid (swamps; scent gives vivid dreams), Bloodreed (marsh reeds with viscous red sap for healing draughts), Weaver's Moss (silvery strands on ancient trees, for binding elixirs). The Mark: Icebloom (petals of living ice that never melt), Stormthistle (crackles with static in high winds), Glacier Lily (brief summer bloom, mana), Stonecress, Frostcap (cave mushroom that holds heat), Ironleaf (metallic veins over mineral seams). Aurenne: Amberbloom (resin that hardens like glass), Miragebloom (nectar that distorts sight), Sandlotus (deep roots hold water for years), Spicethorn, Sunitruffle (underground, grows with desert shrubs, for cooking and elixirs), Jade Aloe. Fungi: Shadowcap, Fearnóg, Mist Fern, Embermorel (volcanic, Aurenne), Caverglow (glowing blue cave mushrooms, all islands: a light source underground), Snowshroom (the Mark). Resins and minerals: Cré Dearg (red clay), Gate Resin (amber sap near gate sites that responds to magic), Saltcrystal (coastal caves), Skyshard (crystals on high peaks holding residual lightning), Sunglass (natural glass from extreme heat), Pearlweed. The study loop: each specimen has a known effect and a hidden one, learned by observe, study, experiment, unlock (the game already has knownDesc and hiddenDesc). Equipment: field kit, mortar and pestle, alembic, cauldron, glass vials, drying rack. Two-ingredient recipes: Healing Draught (Firemoss + Thornberry), Frostguard Tonic (Icebloom + Frostcap), Shadow Veil (Shadowcap + Mist Fern), Ironhide Elixir (Ironleaf + Stonecress), Sunfire Draught (Amberbloom + Spicethorn), Clarity Brew (Glacier Lily + Pearlweed), Serpent's Venom (Caor Dubh + Sunitruffle, a weapon coating), Desert Salve (Jade Aloe + Sandlotus).", "notes": "Pairs with OG-039 (the common atlas). Conflicts with the game and with OG-039: Mist Fern is drawn as a blue mushroom (the game's and OG-039's is a fern); Fearnóg as cap mushrooms (the game's is a bracket fungus); Heartroot violet (the game's is amber). Gatelotus, Gate Resin and Lichenbloom (OG-039) give the player plants that mark a gate nearby, a good fit for the antibody canon. \"Weaver's Moss\" uses the Church's god for a plant name, fine in-world. Alchemy brewing is planned, not built; names are proposals.", "drive": "https://drive.google.com/file/d/1CgkHyW0tl51lD3aY4NEVQ3NPS6XpNKIf/view", "thumb": "thumbs/OG-026.jpg"}, {"id": "OG-027", "cat": "05_Ships_Maritime", "rec": "KEEP", "title": "Board J4: ship interiors and life at sea", "island": "all", "tags": "below-deck;player-base;interiors;crafting;alchemy;cooking;crew;personalisation;figureheads;deck-plans", "ideas": "Interior progression by hull: fishing boat (starter: bed, small storage, a cooking spot), coastal sloop (navigation table, basic crafting), merchant cog (several rooms, crafting area, crew quarters), brigantine (captain's quarters, full workshop), frigate (high tier: captain's cabin, armoury, expanded crafting). Rooms: captain's cabin with stern windows, globe and chart table; main deck with grating and barrels; galley with hearth and hanging herbs; crew quarters with hammocks; cargo hold. Player base pieces: bed (rest and save), storage chests, barrels (bulk storage), map table (plan voyages), crafting station, alchemy station (potions), cooking station (food and buffs), personalisation (rugs, banners). Interior dress by island: Gatelands warm timber and wool, Mark rugged and minimal, Aurenne refined. Personalisation: name and figurehead, sails and banners, interior decor, functional upgrades. Crew life: assigned hammocks, eating in the galley, duties, morale.", "notes": "Matches Michael's notes almost line for line (bed, chest and barrels, map, optional crafting, alchemy and cooking), so this is the reference for the below-deck base. The hull ladder (fishing boat, sloop, cog, brigantine, frigate) differs from the game's classes (sloop, cutter, caravel, cog, galleon): a decision. Crew recruitment and morale are new systems, not in sailing.md.", "drive": "https://drive.google.com/file/d/1BOVd15fUIKRFTSlEYRFDLSyVil-jVxcc/view", "thumb": "thumbs/OG-027.jpg"}, {"id": "OG-028", "cat": "06_Weapons_Magic_Equipment", "rec": "KEEP", "title": "Board K1: weapons of the three islands", "island": "all", "tags": "weapons;melee;ranged;shields;culture;engraving;spearheads;arrowheads", "ideas": "Weapons by island. Gatelands: longsword, arming sword, bastard sword, spear, war spear, hatchet, bearded axe, flanged mace, dagger, sickle, billhook, quarterstaff, warhammer, flail, sword and buckler, javelin; longbow and crossbow. Mark: seax, Norse sword, great axe, Dane axe, spear, throwing axe, war cleaver, spiked mace, scramasax, hooked spear, two-handed axe, war pike, chain weapon, harpoon (whaling and sea); hunting bow, throwing spears. Aurenne: scimitar, straight sword, rapier, spear, glaive, crescent blade, mace, dagger, kris, short spear, trident (anti-ship), chakram, cestus, whip, sling; composite bow, light crossbow, special bolts (fire, rope, signal). Shields: Gatelands kite with the harp, heater, round; Mark painted round, kite, targe; Aurenne hoplon with the sun-star, targe, crescent shield. Decoration by island: Celtic knotwork (Gatelands), runic carving (Mark), inlaid filigree (Aurenne). Strips of pommels, blade profiles, spearheads, arrowheads and bolts.", "notes": "Covers every weapon the game has (dagger, sword, longsword, scimitar, mace, flail, war hammer, great axe, bow, staff) and gives each island its own set and decoration, which is the gap. New kinds for Michael to pick from: spear, crossbow, javelin, rapier, harpoon, glaive, sling. Aurenne's war fan, kris and chakram read East and South Asian, not the Mediterranean and North African fusion: swap for falchion, flyssa, nimcha, takouba. The lion on the Gatelands heater is the generator's heraldry.", "drive": "https://drive.google.com/file/d/1MkR4QEaAMCeyHMGNZWzr39AWg0xqtNj4/view", "thumb": "thumbs/OG-028.jpg"}, {"id": "OG-029", "cat": "03_World_Architecture_Transport", "rec": "MAYBE", "title": "Key frame 2 variant: village vista, Weaver ruin on the hill", "island": "gatelands", "tags": "key-frame-2;landscape;weaver-ruins;village", "ideas": "As OG-022, with the banner signpost at the roadside.", "notes": "Earlier pass of OG-077.", "drive": "https://drive.google.com/file/d/14gBEMr0wa_wOaPfW82G37xFnTA1U1yY5/view", "thumb": "thumbs/OG-029.jpg"}, {"id": "OG-030", "cat": "02_Creatures_Fauna_Bestiary", "rec": "KEEP", "title": "Sheet G1-C: Aurennais fauna, 15 species and five habitats", "island": "aurenne", "tags": "fauna;wildlife;field-guide;warm;desert;salt-marsh;gazelle;lynx;ram;monitor;hare;ibis;scorpion;fox;swift;crab;heron;sand-wyrm;moth;vulture;gecko;habitats", "ideas": "Fifteen warm-country animals. Duneskimmer (deserts and dunes, common; gazelle with wide hooves for sand, goes days without water). Sunspire Lynx (rocky hills, rare; caracal-like with long ears and a heat-shedding crest). Terrace Ram (cliffs and highlands; huge spiral horns, fights on terraced cliffs and ruins). Saltspine Monitor (coasts and islands, uncommon; aggressive lizard whose spines excrete salt crust: a hostile). Oasis Hare (deserts and oases; big ears). Scarlet Ibis (coastal wetlands, common; sign of healthy marsh). Dunescorpion (deserts, uncommon; venom causes paralysis and fever, hunts at night: overlaps the existing Sand Scorpion). Mirage Fox (fennec-like, scavenges ruins and caravan routes). Cliffswift (coasts and sea stacks, common; swirling flocks). Amber Shellcrab (tide pools, common; shells prized for local crafts and trade: a harvestable). Cypress Stalker (rivers and marshes, rare; violet heron whose plumage shifts with the light). Sand Wyrm (dunes, rare; massive burrowing predator, rarely seen, known by its tracks and sand funnels: a set-piece hostile). Glasswing Moth (oases and ruins; crystalline wings drawn to moonlight and flowering plants, \"resonate with ambient magic\": a night ingredient). Sunbeak Vulture (deserts and cliffs, common; carrion cleaner). Spined Gekko (ruins, rare; nocturnal, climbs walls). Habitats: turquoise coastal shores, salt marshes and lagoons with flamingos, olive groves and terraced farmland, deserts and dunes with rock arches, cliffs and islets.", "notes": "Fills the fauna gap for Aurenne and fits Michael's Mediterranean / North African reading (olive groves, dunes, salt marsh, terraces). The Sand Wyrm is the island's big strange beast; Dunescorpion would reskin the Sand Scorpion. Names are proposals.", "drive": "https://drive.google.com/file/d/1w-cBPs1IoAVSV1KnexV9r8JhGlOGpo_o/view", "thumb": "thumbs/OG-030.jpg"}, {"id": "OG-031", "cat": "02_Creatures_Fauna_Bestiary", "rec": "KEEP", "title": "Sheet G1-B: the Markish fauna, 15 species and five habitats", "island": "mark", "tags": "fauna;wildlife;field-guide;cold;tundra;goat;bear;lynx;elk;raven;wolf;ram;marmot;falcon;hare;lizard;salmon;grouse;crab;sea-monster;habitats", "ideas": "Fifteen cold-country animals. Icehorn (alpine peaks, uncommon; shaggy mountain goat with huge curled hollow horns that moan in the wind, a sound idea). Frostreach Bear (mountain forests, rare; pale, larger than southern bears, hunts in packs in hard winters: a hostile). Stormlynx (high ridges; snowshoe paws, long ear tufts). Ironpine Elk (forests and valleys, common; dark, sweeping antlers). Skyraven (cliffs and peaks, common; follows travellers and scavenges battlefields). Stonefang Wolf (mountain forests, common; bigger than lowland wolves, packs in winter: a variant of the Snow Wolf). Craghorn Ram (high cliffs; scales near-vertical rock). Glacial Marmot (alpine slopes, common; hibernates). Stormshrike (tundra, uncommon; white falcon that stoops and hangs in the wind). Snowleap Hare (tundra and forests, common; coat changes with the season). Frostspine Lizard (rocky slopes, rare; mineral-hardened scales that store sunlight). Riverjaw Salmon (rivers, common; leaps the falls on its migration: fishing and a set piece). Tundra Grouse (highlands; flushes noisily from the snow). Icecrab (northern coasts, uncommon; armoured crab \"harvested for their meat\", dangerous when cornered). Shatterback (coastal waters, rare; a colossal slow armoured sea beast whose back is mistaken for rocks by sailors: a sea landmark or encounter). Habitats: high peaks, snow forests, rivers and lakes with waterfalls, tundra, northern coasts with sea stacks.", "notes": "Fills the fauna gap for the Mark. Stonefang Wolf and Frostreach Bear overlap the existing Snow Wolf and Cave Bear and could reskin them. Shatterback is the one strange beast: a candidate for the sea (the game has sharks and whales only). Names are proposals.", "drive": "https://drive.google.com/file/d/1CmBmdXzLyqR-48pn6iAH3H1lQEVb-wOk/view", "thumb": "thumbs/OG-031.jpg"}, {"id": "OG-032", "cat": "03_World_Architecture_Transport", "rec": "MAYBE", "title": "Key frame 5 variant: the gate in the hillside, wider", "island": "gatelands", "tags": "key-frame-5;old-gate", "ideas": "Wider framing of the concentric-ring gate; reads well at distance.", "notes": "Variant of OG-037.", "drive": "https://drive.google.com/file/d/1cx4F5BFhbTyLLMzZhQAobtIZu9DVPx8_/view", "thumb": "thumbs/OG-032.jpg"}, {"id": "OG-033", "cat": "03_World_Architecture_Transport", "rec": "MAYBE", "title": "Board 12: the Mark, settlements and life (first pass)", "island": "mark", "tags": "mark;settlements;architecture;harbours;interiors;materials", "ideas": "Settlement kinds: mountain village, cliff village, lakeside settlement, pass hamlet, mining camp, watchtower. Details: turf roofs, stone-and-timber, carved animal gables, big stone chimneys, palisades, standing stones, clan banners. Fjord harbour, shipyard, lighthouse, whaling station, dry docks. Longhouse hall, home and tavern interiors. Materials: furs, wool, bone and antler, glass and crystal.", "notes": "Superseded by OG-034. Politics conflict: a \"Highhouse\" and \"Council of Houses\" ruling from a capital; canon has the Captains' League, no capital.", "drive": "https://drive.google.com/file/d/1KERO1eyFNVtsLCEWCegC39zDP45DZMy3/view", "thumb": "thumbs/OG-033.jpg"}, {"id": "OG-034", "cat": "03_World_Architecture_Transport", "rec": "KEEP", "title": "Board 12: the Mark, settlements and life (refined)", "island": "mark", "tags": "mark;settlements;architecture;harbours;daily-life;materials;aurora", "ideas": "Cliff city on terraces linked by stone bridges and rope walkways; fjord port; mining town with lifts and tunnels; fortress town on a pass; remote settlement under the aurora (whaling, fishing). Settlement kinds as OG-033 plus coastal outpost. Mark style: carved gables and roof finials, stone-and-timber, snow-shedding steep roofs, runic knotwork, banners by house and clan, palisade gates, cliff walkways. Daily life: winter markets, communal feasts, shipbuilding, guided mountain travel. Materials: local stone, timber, iron, furs and wool, bone and antler, crystal.", "notes": "Names (Skardrun, Fjordhold, Ironreach, Stonewatch, Glassfjord) are proposals. \"Highhold / Council of Houses / capital\" conflicts with the Captains' League. The look fits the canon: timber halls, dark shingle, palisades, squat stone garrisons.", "drive": "https://drive.google.com/file/d/1tTQR96BdCew5H0NAHQQOw7lRmO3TvSHF/view", "thumb": "thumbs/OG-034.jpg"}, {"id": "OG-035", "cat": "04_Flora_Alchemy_Survival", "rec": "KEEP", "title": "Sheet H4: survival, crafting and rural life: resources, crops, animal products, water, tools, stations, outputs", "island": "all", "tags": "resources;crops;farming;animal-products;water-collection;crafting;stations;gathering-tools;cooking-ingredients;survival", "ideas": "The fullest resource list, by island. Adds to H3: river stone, silver and saltpeter (gunpowder, late) in the Gatelands; schist, obsidian, glacial ice and Star Metal (very rare, from high peaks) in the Mark; red stone (pigment), obsidian and desert glass in Aurenne. Crops by island: Gatelands wheat, barley, turnip, cabbage, carrot, apple (cider), herbs; the Mark rye, potato, leek, cabbage, onion, coldroot; Aurenne olive, grape, fig, citrus, chickpea, date, lavender, spice herbs. Animal products: meat, fish, eggs, milk, honey, wool, leather, bone. Water: waterskin (4 drinks, reusable), ceramic flask (2), glass bottle (1, for potions), water barrel (ships and homes); collect from rivers, lakes, wells and rain; purify at campfires or with filters; rain catcher. Preserved foods: flour, dried meat, hardtack, cheese, dried fish, spices, pickles, smoked goods. Tools: woodcutter's axe (higher skill fells larger trees), pickaxe in tiers, gathering knife, shovel (buried finds), fishing rod (better rods reach deeper water), sickle, net. Stations: campfire, drying rack, tanning rack, grindstone, smelter, kiln, workbench, alchemy table. Outputs: planks, ingots, bricks, pottery, glass vials, ropes, cloth, arrows, tools, armour, weapons, furniture, ship parts, trade goods.", "notes": "Supersedes OG-015 for the resource and crop lists; OG-023 (H5) carries the cooking and camp side. Matches the planned survival scope (moderate survival, cooking, water collection, reusable containers). Saltpeter \"gunpowder (late)\" implies firearms, which the canon has not admitted: flag before anyone builds on it. Star Metal is a rare-material candidate with no canon yet. Livestock (cows, sheep, goats, chickens, bees) is implied and absent from the game.", "drive": "https://drive.google.com/file/d/1dTaQ1I1ES4ITh2qdh4Ht0RqKGB3V7_96/view", "thumb": "thumbs/OG-035.jpg"}, {"id": "OG-036", "cat": "99_Other_Reference", "rec": "MAYBE", "title": "Reference: screenshot of the game's character creator today", "island": "none", "tags": "reference;screenshot;character-creator;peoples;starting-weapons;ui", "ideas": "Nothing new to take: it records the build as it is. Four peoples (Gatelander, Markman, Aurennais, Old Blood) with one line each; look options (skin, hair colour, 21 hair styles, 16 beards, tunic, breeches, boots); the low-poly person on the left; four starting weapons with damage and a line each (sword, club, dagger, staff).", "notes": "A reference capture of the current UI, not concept art; keep it as the 'before' baseline for the character and UI boards. No canon conflict.", "drive": "https://drive.google.com/file/d/1B0URENYY_90fhJnoFdfSRkVpIaghGOND/view", "thumb": "thumbs/OG-036.jpg"}, {"id": "OG-037", "cat": "03_World_Architecture_Transport", "rec": "KEEP", "title": "Key frame 5 board: the old gate, with four design variations", "island": "gatelands", "tags": "key-frame-5;old-gate;sigils;design-variants;palette", "ideas": "Gate design: concentric stone rings emerging from the hillside and disappearing underground; a narrow, dark slit entrance (\"not a door, a passage\"); simple repeated Weaver sigils lit amber (\"amber light, not magic\"); weathered, lichened stone \"built for a purpose, not for beauty\"; a small encampment at the foot. Four variations: V1 concentric rings, V2 offset rings, V3 broken circle (partly collapsed), V4 single spine. Notes: simple repeatable geometry for procedural generation; the player small against it; subtle amber light, not bright effects.", "notes": "The board names the scene \"The Buried Crown\"; not canon. V3 could be a failing gate, V1 a steady one.", "drive": "https://drive.google.com/file/d/1JQsdu8wtP8ovkILaWYsMcOtqS7CUiofa/view", "thumb": "thumbs/OG-037.jpg"}, {"id": "OG-038", "cat": "01_Characters_Peoples_NPCs", "rec": "MAYBE", "title": "Sheet: the four peoples, Gatelanders page (first pass)", "island": "gatelands", "tags": "gatelanders;peoples;costume;crown-guard;heraldry;palette;market-town", "ideas": "Crown guards in crimson and gold: a red tabard and short cape over brown leather, embroidered with a gold sprig, worn by a man and a woman. A 'Crown authority' panel: the Crown's red and gold worn as a mark of service, over Gatelander dress rather than instead of it. Villagers with red neckerchiefs, a tradesman in a flat cap and leather apron, a woman in a headscarf and green apron dress with a basket. Gold scroll embroidery on red cloth. Palette: crimson, ochre, sage, navy, brown, cream. A market street with stalls and red banners below a castle.", "notes": "Earlier pass of OG-048. Captions still use the generator's 'frontier' framing ('hardened by frontier life', 'the frontier is opportunity'); the canon Gatelands is a settled home island. Its Crown colours match the canon (crimson and gold, §1.5), unlike OG-010.", "drive": "https://drive.google.com/file/d/1ls5RFcuuBL6I0-COJAo5gSJtYMgHXvpP/view", "thumb": "thumbs/OG-038.jpg"}, {"id": "OG-039", "cat": "04_Flora_Alchemy_Survival", "rec": "KEEP", "title": "Sheet H1: botanical atlas, 16 plants per island with effects and habitats", "island": "all", "tags": "flora;herbs;alchemy;botanical-atlas;harvestable;fungi;sea-herbs;effects;habitats;existing-herbs", "ideas": "A look for every herb the game already has, placed by island, with effects that match HERB_DEF (Firemoss +15 health and +10% melee, Silverleaf +30 stamina and faster sprint, Heartroot +60 mana and +10% spell damage). Gatelands: Firemoss (orange-red moss on rock, moor and wastes), Deepmoss, Silverleaf, Briarweed (purple thistle-flower), Graywort, Veilwort (white bell-flowers near houses), Duilleog Ghorm (blue flowers, coast and fen, spells last longer), Goldenrod (roadsides), Thornberry, Caorthann (rowan berries, autumn woods), Caor Dubh (black berries; -10 health, +40% damage, risky), Heartroot, Fearnóg (orange cap mushrooms), Shadowcap (purple mushrooms), Mist Fern, Luibh Uisce (white water-flowers that fully restore mana). The Mark, mostly new: Coldmoss (blue, tundra), Icebloom (cold resistance), Stonecress, Frostcap (violet mushroom, frost resist), Ironleaf (red, +8 defence), Gnarlroot (cliffs; reveals hidden resources on the map), Snowthyme, Stormthistle (blue globe thistle, lightning resist), Glacier Lily (slows time briefly in combat), Rimeberry (cold resist), Shardmoss (crystal moss on cave walls, improves ore yield), Wolfsbane (high forests, rare; -40% beast damage), Pine Resin (amber on bark, for alchemy, arrows and torches), Red Clay / Cré Dearg (riverbeds; regeneration), Lichenbloom (high ruins; detects nearby gates), Skykelp (cold coastal water; longer breath). Aurenne, all new except the sea herbs: Sandlotus (heat resistance), Amberbloom (+15% fire damage), Sagepalm (reduces heat build-up), Sunpetal (+10% crafting quality), Saltthorn (salt flats; poison resist), Drakesage (strengthens poisons), Miragebloom (detects water sources), Spicethorn (chilli; improves food effects), Datefruit, Cyprus Blossom (+20% alchemy potency), Desert Truffle (underground), Jade Aloe (bleeding resist, regeneration), Sunfungus (canyons; day vision), Pearlweed, Sea Lily, Kelp. Each island closes on a habitat strip.", "notes": "The atlas the herb system can follow island by island; it was drawn from the game's own herb list, which is why the existing effects match. It places Wolf's Bane (unplaced in the game) in the Mark and the three sea herbs in Aurenne; Cré Dearg moves to the Mark as red clay. Leaves out Ashwort, Muirfhear and Ferrous Weed. Heartroot is drawn violet with a red heart, the game's is amber. New plants and every new effect (time slowing, gate detection, crafting quality, heat build-up) are proposals; heat and cold resistance imply a temperature rule the game does not have. Aurenne's numbering repeats 12. Companion to OG-026 (rare specimens).", "drive": "https://drive.google.com/file/d/1G33VjYZWgpgy5SQ2oIFrUm1t-OgV9Xt_/view", "thumb": "thumbs/OG-039.jpg"}, {"id": "OG-040", "cat": "02_Creatures_Fauna_Bestiary", "rec": "KEEP", "title": "Sheet G1-D: signature species, five strange beasts per island", "island": "all", "tags": "fauna;wildlife;field-guide;strange-not-stock;signature-species;stag;tortoise;amphibian;fox;bioluminescence;grazer;bird;six-legged;burrower;raptor;lizard", "ideas": "The Morrowind-style strange wildlife, five per island, none of it gate-made. Gatelands: Crownstag (forest monarch, rare; antlers that grow like living branches hung with moss and epiphytes; peaceful, a landmark animal); Mossback (woodlands, uncommon; ancient slow tortoise carrying a living garden of ferns and flowers on its shell, peaceful); Bellthroat (rivers and wetlands; red frog with a huge violet throat sac whose call echoes across valleys at dusk, an ambient sound); Lanternfox (forests, rare; black fox whose fur glows blue and silver at night, used for signalling); Thornrunner (hills and farmland; long-legged quilled omnivore, very fast). The Mark: Shatterhorn (alpine peaks, rare; colossal six-legged shaggy grazer with layered crystalline horns, peaceful giant); Frostmane (snow forests; long-necked maned browser in small herds, llama-like, a candidate pack beast); Glasswing (cliffs and ridges, rare; gliding predator with translucent wings, soars between peaks); Stonejaw (tundra; armoured burrower with a shovel skull that digs through snow and rock for roots); Stormplume (open slopes, rare; towering flightless bird with layered feathers, kicks hard, territorial: a hostile). Aurenne: Redcrest (scrub and cliffs, rare; feathered raptor-like predator that hunts in packs: a hostile); Sunfan (plains and oases, rare; long-legged bird with a radiant fan crest it displays, \"a symbol of beauty in Aurenne\"); Mineprowler (deserts, uncommon; lithe six-legged spiny sand predator with a curled tail and webbed feet: hostile); Sailshell (deserts and dry valleys; huge tortoise with a sail-like heat-shedding shell, migrates between oases, peaceful).", "notes": "The best answer to §10a \"strange, not stock\" for the open world: wonder without menace, mostly peaceful, which the decision of 12 Oct asks for. The Mineprowler's text sits beside an unlabelled blue-and-gold coastal lizard; the six-legged scorpion-tailed beast above it is the one the text describes. Six-legged animals are a design call: are they ordinary in this world, or seams of the binding? Worth raising as a decision. Names are proposals and candidates to fill the fauna gap.", "drive": "https://drive.google.com/file/d/1KlARRCHYQfCs6mgexWBOQC2TdQ2s-TUr/view", "thumb": "thumbs/OG-040.jpg"}, {"id": "OG-041", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Bestiary: classic monsters (skeleton, goblin, cave troll, slime, giant spider)", "island": "none", "tags": "bestiary;skeleton;goblin;cave-troll;slime;giant-spider;dungeon;turnarounds", "ideas": "Five dungeon foes with turnarounds, detail crops and a scene each. Skeleton: a notched sword and a round wooden shield, rags at the hips. Goblin: crouched, long ears, a long spear and a round hide shield, a scrap-leather harness. Cave troll: hunched and huge, its hide grey like stone with moss and lichen growing on it, scraps of armour lashed on, a wide fanged mouth. Slime: translucent pale green, arched like a wave, with holes through it and bones and rubble suspended inside. Giant spider: a pale, bulbous abdomen, thorny dark legs, a cluster of red eyes, egg sacs and thick webbing in a ruined hall.", "notes": "The dark tone is right here: these belong in the gates (decision 1). All five are in §9a: skeleton (Solas, Uisce), cave troll (Tine, Uisce, Cloch), slime (Uisce, and a magma one for Tine); the troll's mossy stone hide suits a Cloch gate. Goblins are not a kind of gate but an occupied state (§9a), so the goblin belongs to a warren in a spent gate. Filed under characters, but it is creature work; check against the creatures folder's bestiary passes.", "drive": "https://drive.google.com/file/d/1hSyeJUO-ugUpn_dZz5hWq1EGIPCwXgTk/view", "thumb": "thumbs/OG-041.jpg"}, {"id": "OG-042", "cat": "01_Characters_Peoples_NPCs", "rec": "MAYBE", "title": "NPC sheet E5: five powers (leaders of the peoples)", "island": "all", "tags": "npcs;leaders;politics;heraldry;props;named-characters", "ideas": "Costume and props for high-status figures. A Gatelander chieftain: grey-bearded, a crimson cloak over a fur collar, a gold round brooch, a sword. A sea captain of the Mark: a woman with dark red curls, a navy coat with a fur collar, a spyglass and charts. An Aurennais magistrate: a dark-haired woman with a gold circlet, an ivory gown with purple and gold trim, a scroll, a domed city behind. An Old Blood elder: grey skin, long white hair, a tall carved staff, bone and stone charms. A foreign governor: a velvet coat with fur, a ledger and a white cat. Each has a turnaround, a still life of their things, and a scene.", "notes": "Politics against the canon (decision 3: the canon wins): Ashenmoor is a village with Elders, not the seat of a 'High Chieftain of the Gatelanders' (the Crown rules from Coeur de Vie); the Mark has no 'Lord Admiral', only the Captains' League; Aurenne is ruled by the Compact under the Church, not a magistrate; the 'Keepers' who 'tend the Gates' contradict the Withdrawal's ban on reading (§3.1); 'Lord Esteban, Governor of the Far Shores' speaks for 'distant mainland powers' that the canon does not have. The banners (a red beast for the Gatelands, a blue wave for the Mark, purple for Aurenne) do not match the canon colours (§1.5). Names are proposals; Sorcha Ní Bhriain would suit a Gatelander, not a Markman.", "drive": "https://drive.google.com/file/d/13y8fhodpCnHXK9kvoFEyMRB64wulAoJL/view", "thumb": "thumbs/OG-042.jpg"}, {"id": "OG-043", "cat": "03_World_Architecture_Transport", "rec": "KEEP", "title": "Board 14: important buildings and interiors, by island", "island": "all", "tags": "buildings;interiors;tavern;blacksmith;alchemy;guildhall;temple;academy;homes", "ideas": "Exterior and interior for each nation of: tavern/inn (Aurenne a courtyard caravanserai), blacksmith, alchemy shop, guildhall, temple/shrine, library/academy, homes. Gatelands thatch and stone; the Mark timber halls with carved posts; Aurenne arcades, tilework and courtyards.", "notes": "A direct reference for nation-specific interior kits. \"Sunhand order\" is invented; the canon's church is the Church of the Weaver.", "drive": "https://drive.google.com/file/d/13S6-QTVKliNiaKVgE4Cu5NPy5R3cye9D/view", "thumb": "thumbs/OG-043.jpg"}, {"id": "OG-044", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Sheet: the four peoples, Aurennais page", "island": "aurenne", "tags": "aurennais;peoples;costume;headwraps;jewellery;palette;harbour-city;market", "ideas": "Olive to dark brown skin, curly, wavy and braided hair, headwraps and turbans: the mixed, darker-skinned people of decision 4. Light layered clothes: loose cream shirts, indigo and madder-red sashes and skirts, saffron and blue scarves, printed cotton, leather sandals and soft boots. Silver, brass and glass jewellery (coin pendants, hoops, layered necklaces). Fishermen, merchants and sailors as pairs. Guards in a red cloak over a scale cuirass with a round bronze shield and a spear. A white hillside city of domes and towers above a harbour of lateen-sailed boats; a quayside market under striped awnings. Palette: madder red, rust, saffron, indigo, sea blue, olive, sand.", "notes": "Fits decision 4 and §1.3 (warm, coastal, trading). The guards are captioned 'Crown guard'; the Crown is the Gatelands' alone (§1.1), and Compact guards should wear blue-and-white (§1.5). The look leans Moorish and Levantine; the Roman, Egyptian and Greek parts of decision 4 are light (the bronze tier of OG-019 could supply them). The text says 'deserts to the south' and 'eastern and western shores', a wider world than the canon's three islands.", "drive": "https://drive.google.com/file/d/1UwbFdzc_1gJIuNXLUSJt3U7Op1GYRu01/view", "thumb": "thumbs/OG-044.jpg"}, {"id": "OG-045", "cat": "07_Combat_Keyframes", "rec": "MAYBE", "title": "Combat key frame: sword and spell against a skeleton (pass with crossed blades)", "island": "none", "tags": "combat;key-frame;parry;bind;spell;skeleton;gate-interior;sigils", "ideas": "Blades crossed high in a bind, both fighters leaning in: the posture contest. The player holds a charging blue spell low behind him in the off hand, cocked to release. A dark cloak with a gold tree. A tunnel of arches lit by amber script recedes behind.", "notes": "Pass of OG-011, darker. The crossed-blade bind is the clearest read of a parry-then-push of the four passes; worth keeping as a pose reference for the posture system. Near duplicate of OG-063.", "drive": "https://drive.google.com/file/d/1_vuOKnwaWPCJ9lRc0pcFnn_eNI6KUQt4/view", "thumb": "thumbs/OG-045.jpg"}, {"id": "OG-046", "cat": "03_World_Architecture_Transport", "rec": "KEEP", "title": "Board 15: ports, roads & infrastructure (refined)", "island": "all", "tags": "ports;roads;bridges;trade-routes;mills;shipyards;lighthouses;canals;caravanserai;watchtowers;toll-gates;mines;beasts-of-burden;carriages", "ideas": "Infrastructure set: stone roads and bridges, caravan trade routes, farms and windmills, shipyards and dry docks, lighthouses and beacons, canals, port cities, market towns, caravanserai, watchtowers and forts, toll gates, mines and quarries, aqueduct, river port and ferry. Beasts of burden: horse, mule, donkey, ox, cow, llama, camel, reindeer, highland yak, giant goat. Vehicles: covered wagon, merchant wagon, stagecoach, royal carriage, supply cart.", "notes": "Mines and quarries tie to the planned survival skills. Capital names are proposals.", "drive": "https://drive.google.com/file/d/1lHOghAGHBqjxHm1nbMtZfsIpkvX98WNB/view", "thumb": "thumbs/OG-046.jpg"}, {"id": "OG-047", "cat": "02_Creatures_Fauna_Bestiary", "rec": "MAYBE", "title": "Sheet G1: wildlife of the three islands (first pass, 15 species mixed)", "island": "all", "tags": "fauna;wildlife;field-guide;stag;goat;boar;seal;hawk;thrush;heron;fox;crab;otter;moth;wolf;tortoise;hare;lizard", "ideas": "Species not on the later sheets: Saltskim Seal (Aurennais coast, common; spotted seal near fishing villages, folklore says it sees weather coming); Embersong Thrush (Old Blood woodlands; red-breasted songbird with a fluting song at dawn and dusk that \"sings differently near gate sites\", a sound cue near a gate); Tidecrab (Aurennais coast; crabs prized for meat, shells used in crafts, a vivid blue kind unique to Aurenne); Stormlight Moth (forests and ruins, uncommon; iridescent night moth found near old stonework and latent magic, \"said to herald change\"); Warden Wolf (high forests, uncommon; larger, cleverer wolves in small disciplined packs; Markish clans claim descent from them, a lore hook); Sunshell Tortoise (southern valleys; kept in monastery gardens, shells patterned, bringers of patience); Dusk Hare (all islands; huge ears, \"faint magical echoes\"). Also Island Stag, Stone Goat, Gatefen Boar (said to avoid gate-touched ruins: animals that shun a gate are a readable sign), Cliffhawk (used by messengers), Marsh Heron, Redspine Fox (a good omen in some villages), River Otter, Stonecrawler Lizard (scales used in alchemy).", "notes": "Earlier pass of the island sheets OG-009, OG-031, OG-030 and the overview OG-084, which supersede it; keep for the species above. \"Old Blood woodlands\" makes the Old Blood a place, which they are not in canon (they are a people living inside each nation). Its \"warmer southern lands\" for the Aurennais coast contradicts the map: Aurenne is north-east and warm by island, not latitude (§1.5).", "drive": "https://drive.google.com/file/d/1ctx9V_deV9y1jllSxh1LZuUwAmm1kdQW/view", "thumb": "thumbs/OG-047.jpg"}, {"id": "OG-048", "cat": "01_Characters_Peoples_NPCs", "rec": "KEEP", "title": "Sheet: the four peoples, Gatelanders page", "island": "gatelands", "tags": "gatelanders;peoples;costume;crown-guard;palette;cloaks;harbour-town;tavern", "ideas": "Shorter, wiry Gatelanders with freckles and red hair common, darker hair too. Hooded wool cloaks in moss green and madder red pinned at the throat with a round brooch ('pinned collars, a hallmark of Gatelander dress'). A farmer with a pitchfork, a farm woman with an apron and a basket, a tradesman in a flat cap and apron, a woman in a patterned headscarf. Crown guards in a crimson cape and tabard with gold embroidery and a kettle helm. Layered linen sleeves, boot wraps, woven baskets, red embroidered borders. A castle above a harbour town, a tavern interior. Palette: madder red, ochre, moss, sea blue, sand, slate.", "notes": "The best of the three Gatelander passes (supersedes OG-038 and OG-010). It matches the canon: 'middling height, wiry, freckled, dark or red hair' (§2), the Crown's crimson and gold (§1.5), and its own line that 'Crown authority exists, but is layered over older local identity' (§1.1). The towns are drawn half-timbered; the canon has whitewashed lime and thatch villages and grey ashlar towns.", "drive": "https://drive.google.com/file/d/1-A2ffVTJbDJ4mbQFW3W6rD5wMClRNmaY/view", "thumb": "thumbs/OG-048.jpg"}, {"id": "OG-049", "cat": "05_Ships_Maritime", "rec": "KEEP", "title": "Board J6: legendary vessels and maritime mysteries", "island": "all", "tags": "ships;legendary-ships;ghost-ships;wrecks;sea-locations;experimental-ships;figureheads;encounters;strange", "ideas": "Named ships as world landmarks: a Crown flagship, a Mark raider's longship, an Aurenne explorer, an independent merchant legend that has circled all three islands, an unknown ship seen sailing against the wind before great change. Sea legends: a green spectral ship heard singing in fog, a cursed armada seen before storms, a ship locked in ice in the north, a ship that sails between the world and somewhere else. Strange hulls: a tri-hull explorer, a shallow-draught river and marsh ram, a skysail prototype with angled wing sails, the Living Hull (a ship grown, not built, that answers its crew). Wrecks to dive: a sunken Crown warship, a raider wreck with runes in the hull, the Sunken Library (an Aurenne scholar ship lost with a floating archive), a graveyard of mixed wrecks. Sea places: the Broken Reef, the Whispering Deep (a great whirlpool), the Veiled Isles (appear and vanish with the seasons), the Frozen Reach. Rewards: figureheads, ship blueprints, lost maps, navigational instruments.", "notes": "Fills the sea's gap for landmarks and legends; the Living Hull and the Veiled Isles are the 'strange, not stock' register. Conflicts: 'Raider King' and Jorund Bloodwake's 'raider clans' (the Mark has no king and scorns the word; the Captains' League), 'Imperial Explorer' (Aurenne is the Compact, not an empire). Ghost ships and the cursed armada are dark: Michael keeps dark imagery for the gates, so these would be rare, eerie rather than grim. The Sunken Library fits Aurenne's academy; wrecks already exist in the game. Names are proposals.", "drive": "https://drive.google.com/file/d/1dIBojBKGrZQIjOSVWv80_lt4cEauBg6b/view", "thumb": "thumbs/OG-049.jpg"}, {"id": "OG-050", "cat": "01_Characters_Peoples_NPCs", "rec": "MAYBE", "title": "Character creation: variations with a simple creator UI (second pass)", "island": "none", "tags": "character-creator;player;ui;body-types;hair;skin-tones;hero-outfit", "ideas": "A simple creator panel: a list on the left (race, gender, face, hair, hair colour, skin tone, appearance, confirm), a strip of choices, and a portrait on the right. Six builds of the same kit: default, stout, lean, tall, young
